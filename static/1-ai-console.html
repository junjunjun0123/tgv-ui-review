<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGV Showtime AI — Location Showtime Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090D; --panel:#0F131A; --panel2:#141922; --panel3:#1A202B;
  --line:#212936; --line2:#2C3646;
  --txt:#E9EEF6; --dim:#8A96A8; --dim2:#5A6678;
  --red:#E4002B; --red-l:#FF3B52; --amber:#F5A524; --teal:#22D3A6;
  --violet:#A78BFA; --blue:#4C9AFF;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#232B38;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#2F3A4B;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ---------- TOP BAR ---------- */
.topbar{
  flex:0 0 58px;display:flex;align-items:center;gap:20px;padding:0 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0D1117,#080A0F);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,#FF2D45,#B30020);
  box-shadow:0 4px 14px rgba(228,0,43,.42),inset 0 1px 0 rgba(255,255,255,.28);
  font-weight:800;font-size:12px;letter-spacing:-.4px;
}
.brand .name{font-size:13.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.brand .name span{color:var(--dim2);font-weight:500}
.brand .sub{font-size:8.5px;color:var(--dim2);letter-spacing:.8px;text-transform:uppercase;line-height:1.1;white-space:nowrap}

.steps{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.step{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;
  color:var(--dim);font-size:11.5px;font-weight:550;transition:.16s;white-space:nowrap;
}
.step:hover{background:#161B24;color:#C3CDDB}
.step .idx{
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;background:#1D2430;color:var(--dim2);
  border:1px solid #2A3341;transition:.16s;
}
.step.on{background:rgba(228,0,43,.12);color:#FF6B7C}
.step.on .idx{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 0 3px rgba(228,0,43,.16)}
.step.done .idx{background:#12362C;color:var(--teal);border-color:#1B5A48}
.step-sep{width:14px;height:1px;background:#242C39;flex:0 0 auto}

.topright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:#B9C4D2;
}
.pill b{color:#fff;font-weight:600}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal)}
.cta{
  height:30px;padding:0 15px;border-radius:8px;font-size:12px;font-weight:600;
  background:linear-gradient(180deg,#FF2D45,#D40026);color:#fff;
  box-shadow:0 3px 12px rgba(228,0,43,.35),inset 0 1px 0 rgba(255,255,255,.22);
  transition:.15s;display:flex;align-items:center;gap:7px;
}
.cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cta:active{transform:translateY(0)}

/* ---------- LAYOUT ---------- */
.workspace{flex:1;display:grid;grid-template-columns:262px minmax(0,1fr) 344px;min-height:0}

/* ---------- RAIL ---------- */
.rail{
  border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
.rail-hd{
  padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.rail-hd h3{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);font-weight:650}
.rail-hd .cnt{font-size:10px;color:var(--dim2);background:#1A202B;padding:1px 6px;border-radius:5px}
.rail-list{flex:1;overflow-y:auto;padding:8px}
.film{
  display:flex;gap:10px;padding:8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;transition:.15s;margin-bottom:3px;position:relative;
}
.film:hover{background:#151A23}
.film.on{background:linear-gradient(90deg,rgba(228,0,43,.14),rgba(228,0,43,.04));border-color:rgba(228,0,43,.34)}
.film.on::before{
  content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:2px;
  background:var(--red);border-radius:2px;box-shadow:0 0 8px var(--red);
}
.poster{
  width:40px;height:56px;border-radius:6px;flex:0 0 auto;position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:8px;font-weight:800;letter-spacing:.5px;
  color:rgba(255,255,255,.92);text-align:center;padding:3px;line-height:1.1;
  box-shadow:0 2px 8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);
}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.poster span{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.film-meta{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.film-title{font-size:11.5px;font-weight:600;color:#E4EAF3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.film-sub{font-size:10px;color:var(--dim2);display:flex;align-items:center;gap:5px}
.badge{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;text-transform:uppercase}
.b-new{background:rgba(228,0,43,.18);color:#FF6B7C}
.b-hold{background:rgba(76,154,255,.15);color:#7FB6FF}
.b-up{background:rgba(167,139,250,.15);color:#BFA8FF}
.film-proj{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}
.film-proj b{color:var(--teal);font-weight:650}

/* ---------- CANVAS ---------- */
.canvas{display:flex;flex-direction:column;min-height:0;overflow-y:auto;position:relative}
.canvas::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 400px at 20% -10%,rgba(228,0,43,.07),transparent 65%);
}
.sec{padding:16px 20px;position:relative}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}
.sec-hd h2{font-size:16px;font-weight:650;letter-spacing:-.3px}
.sec-hd p{font-size:11.5px;color:var(--dim2);margin-top:1px}
.crumb{
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim2);
  padding:6px 0 0;
}
.crumb b{color:#C9D3E0;font-weight:600}
.crumb .ar{color:#39424F}

/* film grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.fcard{
  border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);
  cursor:pointer;transition:.16s;position:relative;
}
.fcard:hover{border-color:#3A4658;transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.fcard.on{border-color:rgba(228,0,43,.55);box-shadow:0 0 0 1px rgba(228,0,43,.25),0 10px 26px rgba(0,0,0,.5)}
.fcard.lock{opacity:.62}
.fcard-top{height:84px;position:relative;display:flex;align-items:flex-end;padding:9px 11px}
.fcard-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(8,10,14,.9))}
.fcard-top .tt{position:relative;z-index:2;font-size:11.5px;font-weight:700;letter-spacing:-.1px;text-shadow:0 1px 6px #000}
.fcard-body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px}
.fcard-row{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--dim2)}
.fcard-row b{color:#CBD5E2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{height:3px;border-radius:2px;background:#1C232E;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#E4002B,#FF6B7C)}
.tagline{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.tg{font-size:8.5px;padding:1.5px 5px;border-radius:5px;background:#1A202B;color:#93A0B2;border:1px solid #242C39;white-space:nowrap}

/* demand matrix */
.mtx{width:100%;border-collapse:collapse;font-size:11px}
.mtx th{
  text-align:right;padding:8px 12px;font-size:9px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--dim2);font-weight:650;border-bottom:1px solid var(--line);white-space:nowrap;
}
.mtx th:first-child{text-align:left}
.mtx td{padding:7px 12px;text-align:right;border-bottom:1px solid #161D27;color:#C3CDDB;cursor:pointer;transition:.12s;white-space:nowrap}
.mtx td:first-child{text-align:left;color:#DDE5EF;font-weight:550}
.mtx tr:last-child td{border-bottom:none}
.mtx tbody tr:hover td{background:#141A24}
.mtx td.hot{color:#22D3A6;font-weight:650}
.mtx td.mid{color:#DDE5EF}
.mtx td.cold{color:#5A6678}
.mtx td.sel{background:rgba(228,0,43,.26);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,59,82,.45)}

/* week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:var(--panel);
  cursor:pointer;transition:.14s;position:relative;overflow:hidden;
}
.day:hover{background:#161C26;border-color:#33404F}
.day.on{border-color:rgba(228,0,43,.5);background:linear-gradient(180deg,rgba(228,0,43,.13),rgba(228,0,43,.03))}
.day .dw{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);font-weight:650}
.day .dt{font-size:15px;font-weight:650;letter-spacing:-.4px;margin-top:1px}
.day .da{font-size:10px;color:var(--teal);font-weight:600;margin-top:3px}
.day .dsh{font-size:9.5px;color:var(--dim2);margin-top:1px}
.day .spark{position:absolute;right:0;bottom:0;left:0;height:2px;background:#1B222D}
.day .spark i{display:block;height:100%;background:linear-gradient(90deg,#E4002B,#FF6B7C)}

/* cards */
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.card-hd{
  padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:8px;background:#121721;
}
.card-hd h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#93A0B2;font-weight:650}
.card-bd{padding:12px}

.drivers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:1180px){.drivers{grid-template-columns:1fr}}

.footbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;
  padding:11px 14px;border:1px solid var(--line);border-radius:11px;
  background:linear-gradient(90deg,#121721,#0F131A);
}
.fb-stats{display:flex;gap:26px;flex-wrap:wrap}
.fb-stats div{display:flex;flex-direction:column;gap:1px}
.fb-stats span{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2)}
.fb-stats b{font-size:15px;font-weight:700;letter-spacing:-.4px;color:#EAF0F8}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);
  background:#12171F;border:1px solid #2C3646;border-left:3px solid #22D3A6;
  color:#DCE4EF;font-size:12px;padding:10px 16px;border-radius:9px;
  box-shadow:0 14px 40px rgba(0,0,0,.65);z-index:99;opacity:0;
  transition:opacity .22s, transform .22s;
}
.toast.in{opacity:1;transform:translate(-50%,0)}

/* comparable rows */
.cmp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #1D2531}
.cmp:last-child{border-bottom:none}
.cmp .nm{flex:1;min-width:0;font-size:10.5px;color:#C2CCDA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .sim{width:44px;height:3px;border-radius:2px;background:#1C232E;overflow:hidden;flex:0 0 auto}
.cmp .sim i{display:block;height:100%;background:linear-gradient(90deg,#4C9AFF,#7FB6FF)}
.cmp .ap{font-size:10.5px;color:var(--dim);width:34px;text-align:right;flex:0 0 auto}
.baseline{
  margin-top:9px;padding:8px 10px;border-radius:8px;background:rgba(34,211,166,.07);
  border:1px solid rgba(34,211,166,.2);display:flex;align-items:center;justify-content:space-between;
}
.baseline span{font-size:10px;color:#8FB9AD;letter-spacing:.3px}
.baseline b{font-size:15px;font-weight:700;color:var(--teal);letter-spacing:-.3px}

/* slider */
.seg{display:flex;background:#161C26;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:3px 10px;border-radius:5px;font-size:10.5px;color:var(--dim);font-weight:600;transition:.14s}
.seg button.on{background:#252E3C;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.slider-wrap{margin-top:12px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.slider-top .lbl{font-size:10px;color:var(--dim2);letter-spacing:.4px;text-transform:uppercase}
.slider-top .val{font-size:15px;font-weight:700;letter-spacing:-.4px}
input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;border-radius:3px;background:#1E2632;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;cursor:pointer;
  background:linear-gradient(180deg,#FF5C70,#D40026);border:2px solid #0F131A;
  box-shadow:0 0 0 3px rgba(228,0,43,.22);
}
.scale{display:flex;justify-content:space-between;font-size:9px;color:#4E5A6B;margin-top:5px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dgrid .cell{display:flex;flex-direction:column;gap:3px;align-items:center}
.dgrid .cell label{font-size:8.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px}
.dgrid .cell input{
  width:100%;background:#161C26;border:1px solid var(--line);border-radius:5px;
  color:#DCE4EF;font-size:10.5px;padding:3px 0;text-align:center;outline:none;
}
.dgrid .cell input:focus{border-color:rgba(228,0,43,.6)}

/* rules */
.rule{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed #1D2531}
.rule:last-child{border-bottom:none}
.rule .ic{
  width:15px;height:15px;border-radius:4px;display:grid;place-items:center;flex:0 0 auto;
  font-size:8px;font-weight:800;margin-top:1px;
}
.ic.on{background:rgba(34,211,166,.15);color:var(--teal)}
.ic.off{background:#1B222D;color:#4E5A6B}
.ic.warn{background:rgba(245,165,36,.15);color:var(--amber)}
.rule .tx{flex:1;font-size:10.5px;color:#BCC7D5;line-height:1.4}
.rule .tx b{color:#fff;font-weight:650}
.rule .tx small{display:block;color:var(--dim2);font-size:9.5px}

/* cinema cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cin{
  border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:13px;
  cursor:pointer;transition:.16s;
}
.cin:hover{border-color:#3A4658;transform:translateY(-2px)}
.cin.on{border-color:rgba(228,0,43,.55);background:linear-gradient(180deg,rgba(228,0,43,.09),transparent)}
.cin h5{font-size:12.5px;font-weight:650;letter-spacing:-.2px}
.cin .city{font-size:10px;color:var(--dim2);margin-bottom:10px}
.cin .kv{display:flex;justify-content:space-between;font-size:10.5px;padding:3px 0;color:var(--dim2)}
.cin .kv b{color:#D3DCE8;font-weight:600}

/* hall chips */
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hchip{
  padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:6px;transition:.14s;
}
.hchip:hover{border-color:#3A4658;color:#C3CDDB}
.hchip.on{border-color:rgba(228,0,43,.55);background:rgba(228,0,43,.13);color:#FF8A96}
.hchip .cp{font-size:9px;color:var(--dim2)}
.hchip.on .cp{color:#C97E86}

/* timeline */
.tl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.tl-hd{display:flex;border-bottom:1px solid var(--line);background:#121721}
.tl-hd .lbl{width:146px;flex:0 0 auto;padding:6px 12px;font-size:9px;letter-spacing:.8px;color:var(--dim2);text-transform:uppercase}
.tl-hd .hrs{flex:1;display:flex;position:relative;height:26px}
.tl-hd .hrs span{
  flex:1;font-size:9px;color:var(--dim2);padding-left:4px;border-left:1px solid #1B222D;
  display:flex;align-items:center;
}
.tl-row{display:flex;border-bottom:1px solid var(--line);min-height:52px}
.tl-row:last-child{border-bottom:none}
.tl-row .lbl{
  width:146px;flex:0 0 auto;padding:6px 12px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;gap:1px;background:#0D1117;
}
.tl-row .lbl b{font-size:10.5px;font-weight:600;color:#CBD5E2}
.tl-row .lbl small{font-size:9px;color:var(--dim2)}
.tl-track{
  flex:1;position:relative;min-height:52px;
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);
  background-size:calc(100% / 17) 100%;
}
.sess{
  position:absolute;top:6px;bottom:6px;border-radius:5px;padding:3px 6px;overflow:hidden;
  font-size:9px;line-height:1.25;cursor:pointer;transition:.14s;
  border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center;
}
.sess:hover{filter:brightness(1.22);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.sess b{font-size:9.5px;font-weight:650;letter-spacing:-.1px;white-space:nowrap}
.sess small{font-size:8.5px;opacity:.85;white-space:nowrap}
.empty-hint{padding:26px;text-align:center;color:var(--dim2);font-size:11.5px}
.ubars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.ubar-top{display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);margin-bottom:5px}
.ubar-top b{color:#C3CDDB;font-weight:600}

/* ---------- WEEK BOARD ---------- */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:9px}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;color:#93A0B2;white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:2px;display:block}
.board{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.brow{display:flex;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.blbl{
  width:124px;flex:0 0 auto;padding:7px 11px;border-right:1px solid var(--line);
  background:#0D1117;display:flex;flex-direction:column;justify-content:center;gap:1px;
}
.blbl b{font-size:10.5px;font-weight:600;color:#CBD5E2;white-space:nowrap}
.blbl small{font-size:8.5px;color:var(--dim2);white-space:nowrap}
.bhead .blbl{background:#121721;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2)}
.bcell{
  flex:1;min-width:0;padding:5px 4px 3px;border-right:1px solid #161D27;
  cursor:pointer;transition:background .12s;
}
.bcell:last-child{border-right:none}
.bcell:hover{background:#171E29}
.bcell.on{background:rgba(228,0,43,.07)}
.bcell.off{opacity:.45}
.bdh{padding:6px 4px;text-align:center;cursor:pointer}
.bdh .dw{font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);font-weight:650}
.bdh .dd{font-size:12px;font-weight:650;color:#C3CDDB;letter-spacing:-.3px}
.bdh.on .dd{color:#FF6B7C}
.track{position:relative;height:40px;background:#0B0F15;border-radius:4px;overflow:hidden}
.blk{position:absolute;top:0;bottom:0;opacity:.9;border-radius:1px;transition:.12s;box-shadow:inset -1px 0 0 rgba(0,0,0,.55)}
.blk:hover{opacity:1;box-shadow:inset -1px 0 0 rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.6);z-index:3}
.bcell .meta{display:flex;justify-content:space-between;font-size:9px;color:#66748A;margin-top:3px;font-variant-numeric:tabular-nums}
.board-legend{
  display:flex;align-items:center;gap:7px;margin-top:7px;font-size:9px;color:#4E5A6B;
  padding-left:124px;
}
.board-legend .axis{flex:1;height:1px;background:linear-gradient(90deg,#2C3646,#1A222D);position:relative}
.board-legend .axis i{position:absolute;left:50%;top:-2px;width:1px;height:5px;background:#2C3646}
.btotal{background:#0F141C}
.btotal .blbl{background:#0F141C}
.btotal .blbl b{color:#FF8A96}
.bcell.bt-admits-cell{padding-top:8px}
.bt-admits{font-size:13px;font-weight:700;letter-spacing:-.4px;color:#EAF0F8;text-align:center;padding-top:6px}
.bt-sub{font-size:8.5px;color:#66748A;text-align:center;margin-top:1px;font-variant-numeric:tabular-nums}
.lg-rental{background:repeating-linear-gradient(45deg,#3A4351,#3A4351 2px,#2E3644 2px,#2E3644 4px)!important}
.lg-closed{background:repeating-linear-gradient(45deg,#15181E,#15181E 2px,#0C0F13 2px,#0C0F13 4px)!important;box-shadow:inset 0 0 0 1px #2C3646}

/* ---------- DAY SCREEN SCHEDULE ---------- */
.dt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.drow{display:flex;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.dlbl{
  width:138px;flex:0 0 auto;padding:6px 11px;border-right:1px solid var(--line);
  background:#0D1117;display:flex;flex-direction:column;justify-content:center;gap:1px;
}
.dlbl b{font-size:10.5px;font-weight:600;color:#CBD5E2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlbl small{font-size:8.5px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.dhead{background:#121721}
.dhead .dlbl{background:#121721}
.dhead .dlbl b{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2)}
.dhours{flex:1;display:flex;height:26px;min-width:0}
.dhours span{
  flex:1;min-width:0;font-size:8.5px;color:#5A6678;border-left:1px solid #1B222D;
  display:flex;align-items:center;padding-left:3px;font-variant-numeric:tabular-nums;
}
.dtrack{
  flex:1;position:relative;height:54px;min-width:0;
  background-image:linear-gradient(to right,#1A222D 1px,transparent 1px);
  background-size:calc(100% / 21) 100%;
}
.dsess{
  position:absolute;top:5px;bottom:5px;border-radius:4px;padding:2px 5px;overflow:hidden;
  font-size:8.5px;line-height:1.3;border:1px solid rgba(255,255,255,.16);
  display:flex;flex-direction:column;justify-content:center;cursor:pointer;color:#fff;
  transition:filter .12s;
}
.dsess:hover{filter:brightness(1.25);z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.7)}
.dsess b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8.5px;letter-spacing:-.1px}
.dsess small{font-size:8px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.blk-rental{background:repeating-linear-gradient(45deg,#3A4351,#3A4351 5px,#2E3644 5px,#2E3644 10px);color:#C2CCDA}
.blk-closed{background:repeating-linear-gradient(45deg,#15181E,#15181E 5px,#0A0D11 5px,#0A0D11 10px);color:#5A6678;border-color:#242C39}

.dt-daybar{display:flex;align-items:center;gap:9px;margin-top:8px}
.navbtn{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
  color:#93A0B2;font-size:14px;line-height:1;display:grid;place-items:center;transition:.14s;
}
.navbtn:hover{background:#1C2431;color:#fff;border-color:#3A4658}
.dt-dayname{font-size:12px;font-weight:650;color:#DDE5EF;letter-spacing:-.2px}
.dt-sum{font-size:10px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- INSPECTOR ---------- */
.inspector{
  border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;
}
.ins-hd{padding:12px 14px;border-bottom:1px solid var(--line);background:#0D1117}
.ins-hd .t{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);font-weight:650}
.ins-hd .v{font-size:12px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
.hero{padding:14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,166,.12),transparent 70%);
}
.hero .k{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);font-weight:650}
.hero .big{font-size:34px;font-weight:750;letter-spacing:-1.6px;line-height:1.05;margin-top:3px;color:#fff}
.hero .big em{font-style:normal;font-size:12px;color:var(--dim2);font-weight:500;letter-spacing:0;margin-left:4px}
.hero .rng{font-size:10.5px;color:var(--dim2);margin-top:3px}
.hero .rng b{color:var(--teal);font-weight:650}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:12px;border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:8px 10px}
.kpi .k{font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim2)}
.kpi .v{font-size:14px;font-weight:700;letter-spacing:-.4px;margin-top:1px}
.kpi .v small{font-size:9.5px;font-weight:500;color:var(--dim2);letter-spacing:0}

.ins-sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.ins-sec .sh{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between}
.formula{
  font-size:9.5px;line-height:1.85;color:#93A0B2;background:#0C1016;border:1px solid var(--line);
  border-radius:7px;padding:8px 10px;
}
.formula div{display:flex;justify-content:space-between;gap:8px}
.formula div span:last-child{color:#D5DEEA;font-weight:600}
.formula .eq{border-top:1px dashed #222B38;margin-top:5px;padding-top:5px;color:#fff;font-weight:650}
.formula .eq span:last-child{color:var(--teal)}

.note{
  display:flex;gap:8px;padding:8px 10px;border-radius:8px;font-size:10.5px;line-height:1.45;
  margin-bottom:6px;border:1px solid transparent;
}
.note:last-child{margin-bottom:0}
.note .i{flex:0 0 auto;font-size:11px;margin-top:-1px}
.n-warn{background:rgba(245,165,36,.08);border-color:rgba(245,165,36,.22);color:#E8C48A}
.n-info{background:rgba(76,154,255,.07);border-color:rgba(76,154,255,.2);color:#9EC2F0}
.n-good{background:rgba(34,211,166,.07);border-color:rgba(34,211,166,.2);color:#8FD8C4}

.ins-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);background:#0D1117}
.ghost{
  width:100%;height:32px;border-radius:8px;border:1px solid var(--line2);background:#161C26;
  font-size:11.5px;font-weight:600;color:#C3CDDB;transition:.14s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.ghost:hover{background:#1C2431;border-color:#3A4658;color:#fff}

/* ---------- DRAG-TO-MOVE SESSION BLOCKS ---------- */
.sess, .dsess{ cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; }
.sess:active, .dsess:active{ cursor:grabbing; }
.sess.drag-on, .dsess.drag-on{
  z-index:30 !important; opacity:.92; outline:2px solid #4DA3FF; outline-offset:-1px;
  box-shadow:0 16px 34px -10px rgba(0,0,0,.7); filter:brightness(1.15);
}
.tl-row.drop-hall, .drow.drop-hall{
  outline:2px solid #7C4DFF; outline-offset:-2px; background:rgba(124,77,255,.08);
  border-radius:6px;
}
#dragtip{
  position:fixed; z-index:9999; pointer-events:none; transform:translate(-50%,-130%);
  background:#0B0E13; border:1px solid #2A3543; color:#E6EDF6; border-radius:8px;
  padding:6px 9px; font-size:10.5px; line-height:1.4; box-shadow:0 10px 26px rgba(0,0,0,.6);
  white-space:nowrap; display:none; font-variant-numeric:tabular-nums;
}
#dragtip .dt-t{font-weight:700;font-size:12px}
#dragtip .dt-s{color:#9EC2F0;margin-top:1px}
#dragtip .dt-h{color:#C4B5FD;margin-top:1px;font-weight:600}

/* ---------- LOCATION SHOWTIME MANAGER ---------- */
.mgr-locbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-3px 0 12px;
  padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#0D1117;
}
.mgr-loc-label{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);font-weight:700;margin-right:2px}
.mgr-loc-note{margin-left:auto;font-size:10px;color:var(--dim2);white-space:nowrap}
.mgr-rail-note{padding:8px 12px;border-bottom:1px solid var(--line);font-size:9.5px;line-height:1.45;color:var(--dim2)}
.mgr-film{cursor:default!important;border-color:var(--line)!important;background:#0D1117!important;margin-bottom:5px}
.mgr-film:hover{background:#131A24!important}
.mgr-film.mgr-inactive{opacity:.55}
.mgr-swatch{
  display:inline-block;width:8px;height:8px;border-radius:2px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.mgr-hallcount,.mgr-weekline{font-size:9.5px;color:var(--dim2);display:flex;align-items:center;gap:4px}
.mgr-hallcount b,.mgr-weekline b{color:#C3CDDB;font-weight:600}
.mgr-halls{display:grid;grid-template-columns:1fr;gap:8px}
.mgr-halls .ubar-top{margin-bottom:3px}
.mgr-filmrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.mgr-filmrow span:first-child{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-editnote{font-size:10px;color:#9EC2F0;line-height:1.5}

/* ---------- DESIGN-2-STYLE FILM RATING (STEP 1) ---------- */
.rate-two{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:13px;align-items:stretch}
@media(max-width:1500px){.rate-two{grid-template-columns:minmax(0,1fr) 286px}}
@media(max-width:1280px){.rate-two{grid-template-columns:1fr}}
.rate-panel,.rate-card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:13px}
.rate-card{background:#0C1016}
.rate-dossier{display:grid;grid-template-columns:140px minmax(0,1fr);gap:15px}
@media(max-width:760px){.rate-dossier{grid-template-columns:1fr}}
.rate-poster{
  position:relative;aspect-ratio:2/3;border-radius:9px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;padding:11px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.08);
}
.rate-poster::after{content:'';position:absolute;inset:0;background:radial-gradient(100% 65% at 20% 0%,rgba(255,255,255,.16),transparent 62%),linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.02) 60%)}
.rate-poster .glow{position:absolute;width:130px;height:130px;border-radius:50%;filter:blur(44px);opacity:.5;left:-24px;top:-30px}
.rate-poster .pt{position:relative;z-index:2;font-size:17px;font-weight:750;line-height:1.05;letter-spacing:-.3px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.rate-poster .rt,.rate-poster .fm{position:absolute;top:9px;z-index:2;font-size:8.5px;font-weight:750;padding:2px 6px;border-radius:4px}
.rate-poster .rt{right:9px;background:rgba(255,255,255,.94);color:#10141B}
.rate-poster .fm{left:9px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25)}
.rate-hd h3{font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.rate-hd .sub{font-size:10.5px;color:var(--dim2);margin-top:3px}
.rate-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.rate-tags .tag{font-size:9px;font-weight:650;letter-spacing:.3px;padding:3px 7px;border-radius:5px;background:#161C26;color:#AAB6C6;border:1px solid var(--line2)}
.rate-tags .tag.red{background:rgba(228,0,43,.14);color:#FF8A96;border-color:rgba(228,0,43,.3)}
.rate-syn{font-size:11px;line-height:1.6;color:#AAB6C6;margin:12px 0}
.rate-hook{border-left:2px solid var(--red);padding:2px 0 2px 11px;margin:10px 0 13px;font-size:10.5px;line-height:1.55;color:#B9C4D2}
.rate-hook span{display:block;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:#FF6B7C;font-weight:750;margin-bottom:3px}
.rate-sec{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);font-weight:700;margin:15px 0 8px;display:flex;align-items:center;gap:8px}
.rate-sec::after{content:'';flex:1;height:1px;background:var(--line)}
.rate-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rate-meta div{background:#0C1016;padding:7px 9px}
.rate-meta dt{font-size:8px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.rate-meta dd{font-size:10.5px;font-weight:600;color:#C9D4E2;margin-top:2px}
.rate-cmp{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rate-cmp-r{background:#0C1016;display:grid;grid-template-columns:minmax(0,1fr) 70px 28px 46px;gap:7px;align-items:center;padding:7px 9px}
.rate-cmp-r .n{font-size:10px;color:#C9D4E2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate-cmp-r .b{height:5px;border-radius:3px;background:#1B2330;overflow:hidden;position:relative}
.rate-cmp-r .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#4C9AFF}
.rate-cmp-r .s{font-size:9px;color:var(--dim2);text-align:right;font-variant-numeric:tabular-nums}
.rate-cmp-r .v{font-size:10px;color:#C9D4E2;text-align:right;font-variant-numeric:tabular-nums}
.rate-cmp-r .v b{color:#8FD8C4}
.rate-rules{font-size:9.5px;color:var(--dim2);line-height:1.5;margin-top:6px}
.rate-rules b{color:#9EC2F0}

.rate-card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.rate-card-hd h4{font-size:12.5px;font-weight:700}
.rate-card-hd p{font-size:9.5px;color:var(--dim2);margin-top:2px;line-height:1.4}
.rate-card-hd .badge{font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:rgba(228,0,43,.16);color:#FF8A96;flex:0 0 auto}
.rate-prog{margin-bottom:9px}
.rate-prog select{width:100%;height:29px;border-radius:7px;border:1px solid var(--line2);background:#151B25;color:#DDE5EF;font-size:10.5px;padding:0 7px;outline:none}
.rate-gauge{display:flex;align-items:center;gap:10px;padding:8px 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rate-gauge svg{flex:0 0 auto}
.rate-gauge .ring-v{font-size:27px;font-weight:750;fill:#F2F6FC;letter-spacing:-1px}
.rate-gauge .ring-l{font-size:7px;fill:var(--dim2);letter-spacing:1.3px;font-weight:700}
.rate-gauge .vd{min-width:0}
.rate-gauge .vd .lab{font-size:13.5px;font-weight:700}
.rate-gauge .vd .sub{font-size:9.5px;color:var(--dim2);margin-top:2px;line-height:1.35}
.rate-gauge .vd .dl{font-size:9.5px;margin-top:5px;font-weight:650}
.rate-card .dims{padding:2px 0 0}
.rate-dim{padding:6px 0;border-bottom:1px dashed #1B2330}
.rate-dim:last-child{border-bottom:0}
.rate-dim-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rate-dim-t .nm{font-size:10.5px;font-weight:650;color:#DDE5EF}
.rate-dim-t .vl{font-size:14px;font-weight:750;color:#F2F6FC;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.rate-dim .w{font-size:8px;color:var(--dim2);letter-spacing:.4px;font-weight:650}
.rate-dim .hint{font-size:9px;color:var(--dim2);line-height:1.35;margin:1px 0 2px}
.rate-card input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;display:block}
.rate-card input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--red-l) 0%,var(--red-l) var(--pct,50%),#1E2632 var(--pct,50%),#1E2632 100%)}
.rate-card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--red-l);margin-top:-4.5px;box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .12s}
.rate-card input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
.rate-card input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#1E2632}
.rate-card input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--red-l)}
.rate-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.rate-actions .cta,.rate-actions .ghost{height:30px;font-size:10.5px;flex:1;min-width:92px}
.rate-actions .mini{flex:1;min-width:92px;font-size:10px;font-weight:600;padding:6px 8px;border-radius:7px;background:#161C26;color:#B9C4D2;border:1px solid var(--line2);text-align:center}
.rate-actions .mini:hover{background:#1D2532;color:#fff}
.rate-saved{font-size:9px;color:var(--dim2);margin-top:8px;line-height:1.45}

.cons-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:1200px){.cons-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cons-card{border:1px solid var(--line);border-radius:9px;background:#0C1016;padding:10px;min-width:0}
.cons-card.missing{opacity:.62;border-style:dashed}
.cons-card .who{font-size:10.5px;font-weight:700;color:#E4EAF3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cons-card .role{font-size:8.5px;color:var(--dim2);margin-top:1px}
.cons-card .ix{font-size:22px;font-weight:750;letter-spacing:-.8px;margin-top:5px;color:#F2F6FC}
.cons-card .ix small{font-size:9px;color:var(--dim2);font-weight:500;letter-spacing:0}
.cons-card .vd{font-size:9px;font-weight:700;margin-top:1px}
.cons-card .at{font-size:8.5px;color:var(--dim2);margin-top:5px}
.cons-bars{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.cons-bar{display:grid;grid-template-columns:48px 1fr 19px;gap:5px;align-items:center;font-size:8px;color:var(--dim2)}
.cons-bar i{height:3px;border-radius:2px;background:#1B2330;position:relative;overflow:hidden}
.cons-bar i b{position:absolute;left:0;top:0;bottom:0;background:#4C9AFF;border-radius:2px}
.cons-bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rate-viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.rate-viewbar .seg button{font-size:10px}
.rate-rail-film{cursor:pointer}
.rate-rail-film .film-proj b{color:#9EC2F0}
.rate-cov{font-size:9px;color:var(--dim2);margin-top:1px}
.rate-cov b{color:var(--teal);font-weight:650}


/* ---------- EMBEDDED POSTER ART ---------- */
.poster img.poster-img,.rate-poster img.poster-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;display:block
}
.rate-poster .glow{z-index:1}
.poster span{z-index:2}

/* ---------- OVERALL RATINGS VIEW ---------- */
.score-flow{flex-wrap:wrap}
.score-flow-actions{flex-wrap:wrap;justify-content:flex-end}
.score-flow-actions .ghost{width:auto;padding:0 11px;flex:0 0 auto}
.ov-btn,.ov-link{

/* ---- Shared titles published by the Creator in Create Film ----
   Programmers and viewers sign in and use these titles; they are never asked
   to raise the same title request again. */
function syncSharedTitles(){
  let changed = false;
  try{
    const raw = localStorage.getItem('tgv.createfilm.titles');
    if(!raw) return false;
    const created = JSON.parse(raw);
    if(!Array.isArray(created)) return false;
    created.forEach((t,i)=>{
      const id = 'shared-' + String(t.id || i).replace(/[^a-z0-9_-]/gi,'');
      if(FILMS.some(f=>f.id===id || f.title===t.title)) return;
      FILMS.push({
        id, title:t.title, tag:t.title, lang:t.lang || 'English', mins:t.mins || 120,
        rating:t.cert || 'P13', genre:t.genre || 'Feature', distributor:t.dist || 'TGV',
        release:t.release || '2026-11-12', status:'NEW', c1:'#171820', c2:t.color || '#E4002B',
        similar:[{n:'Comparable release', sim:0.62, aps:52}],
        rules:{minShows:3, minScreens:1, mustPlay:'', maxShows:8,
               imax:/IMAX/i.test(t.code || '') ? 2 : 0,
               note:'Published in Create Film · shared with every signed-in user.'}
      });
      changed = true;
    });
  }catch(e){}
  return changed;
}
syncSharedTitles();
addEventListener('storage', e=>{ if(e.key === 'tgv.createfilm.titles' && syncSharedTitles()) render(); });
addEventListener('message', e=>{ if(e.data && e.data.type === 'tgv.titles'){ syncSharedTitles(); render(); } });

/* ---------------- PROGRAMMER FILM RATINGS ----------------
   Design-2-style scoring: five weighted dimensions (0-100) roll up into an
   INDEX. Every INDEX is attributed to the programmer who set it; the consensus
   is the mean of all four INDEX values, so nobody owns the slate score alone. */
const PROGRAMMERS = [
  { id:'aina',    short:'Aina',     name:'Aina Rahman',  role:'Lead programmer' },
  { id:'weijian', short:'Wei Jian', name:'Wei Jian Tan', role:'Programmer' },

  { id:'meiling', short:'Mei Ling', name:'Mei Ling Kok', role:'Regional programmer' }

const DIMS = [
  {k:'story', label:'Story & craft',      w:.22, hint:'Does it hold up as a film? Review proxy.'},
  {k:'cast',  label:'Cast & star draw',   w:.20, hint:'Named talent that sells a ticket on its own.'},
  {k:'heat',  label:'Marketing heat',     w:.22, hint:'Awareness now — trailer reach, social, press.'},
  {k:'fit',   label:'Market fit',         w:.20, hint:'Does this genre work in this market, this season?'},
  {k:'ip',    label:'Franchise strength', w:.16, hint:'Sequel, series, or known IP carrying the open.'}
];
const INDEX_MAX = 100, RATING_EMPTY = 0;
const RATING_TIMES = ['03 Nov · 09:12','03 Nov · 10:05','03 Nov · 11:20','03 Nov · 14:10'];
const INDEX_BASE = [78,84,72,66,81,76,63,58,69,55];
const INDEX_TILT = [
  [ 6,-2,-5, 3],[ 2, 5,-3,-6],[ 0,-5, 4, 1],[-5, 3, 6,-2],[ 4, 0,-4, 6],
  [-2, 6,-1,-5],[ 3,-4, 5, 0],[-6, 2,-3, 5],[ 1,-3, 6,-4],[ 5, 0,-6, 2]
];
const RATING_STORE_KEY = 'tgv-d1-programmer-index-v2';
const FILM_BLURB = {
  baga:'Local action-drama opening against two wide-release tentpoles. Walk-in demand is concentrated in suburban Malay-language sites.',
  godzilla:'Wide-format kaiju release with an IMAX contract and a built-in genre audience. Premium-format capacity is the real constraint.',
  ramayana:'Epic fantasy holdover with a long tail. Week-two floors matter more than opening-day peaks.',
  conjuring:'Late-show horror holdover. The 18 rating halves the addressable audience but concentrates it into evenings.',
  zootopia:'Family animation with broad daytime reach. School-holiday timing and early slots drive its admissions.',
  wicked:'Musical event title with strong premium-format uplift and a loyal repeat audience.',
  predator:'Action sequel relying on franchise recognition and core genre fans rather than broad walk-in.',
  nowyouseeme:'Ensemble caper with moderate heat. Plays best as a counter-programmer to the tentpoles.',
  spongebob:'Childrens animation with a short runtime and high turnover. Best placed in early and matinee slots.',
  pulau:'Local horror with a low floor but a cheap break-even. Upside comes from social buzz in week one.'

function clampIndex(v){ return Math.max(0, Math.min(INDEX_MAX, Math.round(v))); }
function neutralDims(){ return DIMS.reduce((o,d)=>{ o[d.k]=50; return o; },{}); }
function validDims(dims){
  if(!dims || typeof dims !== 'object') return null;
  const out = {};
  for(const d of DIMS){
    const v = Number(dims[d.k]);
    if(!Number.isFinite(v) || v < 0 || v > INDEX_MAX) return null;
    out[d.k] = clampIndex(v);
  }
  return out;
}
function indexOfDims(dims){
  return DIMS.reduce((t,d)=> t + (dims && Number.isFinite(Number(dims[d.k])) ? Number(dims[d.k]) : 50) * d.w, 0);
}
function verdict(ix){
  if(ix >= 78) return {label:'Strong', note:'Above comparable benchmark', color:'#8FD8C4'};
  if(ix >= 62) return {label:'Solid',  note:'In line with comparables',   color:'#9EC2F0'};
  if(ix >= 45) return {label:'Watch',  note:'Below comparable benchmark', color:'#E8C48A'};
  return {label:'Weak', note:'Well below comparables', color:'#FF8A96'};
}
function compAnchor(f){
  const a = weightedAPS(f.similar || []);
  return Number.isFinite(a) ? a : 50;
}
function seededDims(fi, pi){
  const base = INDEX_BASE[fi % INDEX_BASE.length];
  const tilt = INDEX_TILT[fi % INDEX_TILT.length][pi % PROGRAMMERS.length];
  const dims = {};
  DIMS.forEach((d,k)=>{
    const jitter = ((fi*7 + pi*13 + k*17) % 13) - 6;
    dims[d.k] = clampIndex(base + tilt + jitter);
  });
  return dims;
}
function seedRatings(){
  const out = {};
  FILMS.forEach((f,i)=>{
    out[f.id] = {};
    PROGRAMMERS.forEach((p,j)=>{ out[f.id][p.id] = { dims:seededDims(i,j), by:p.id, at:RATING_TIMES[j] }; });
  });
  return out;
}
function clearRatings(){
  const out = {};
  FILMS.forEach(f=>{
    out[f.id] = {};
    PROGRAMMERS.forEach(p=>{ out[f.id][p.id] = { score:RATING_EMPTY, dims:null, by:p.id, at:'not rated' }; });
  });
  return out;
}
function loadRatings(){
  const seeded = seedRatings();
  try{
    const saved = JSON.parse(localStorage.getItem(RATING_STORE_KEY) || 'null');
    if(!saved) return seeded;
    FILMS.forEach(f=>PROGRAMMERS.forEach(p=>{
      const cell = saved[f.id] && saved[f.id][p.id];
      if(!cell) return;
      if(Number(cell.score) === RATING_EMPTY || cell.dims === null){
        seeded[f.id][p.id] = { score:RATING_EMPTY, dims:null, by:p.id, at:'not rated' };
      } else {
        const dims = validDims(cell.dims);
        if(dims) seeded[f.id][p.id] = { dims, by:p.id, at:cell.at || seeded[f.id][p.id].at };
      }
    }));
  }catch(_){}
  return seeded;
}

/* ---------------- FORECAST ENGINE ---------------- */
function weightedAPS(similar){
  const w = similar.reduce((s,x)=>s+x.sim, 0);
  return similar.reduce((s,x)=>s+x.sim*x.aps, 0) / w;
}
function weekIndexOf(film, week){
  const diff = (week.start - pd(film.release)) / 86400000;
  return Math.floor(diff/7);
}

function planShows(ceil, minShows, cap, target, maxSlots){
  const min = Math.max(1, Math.min(minShows || 1, maxSlots));
  let best = min;
  const A = k => ceil * (1 - Math.exp(-k/3.2));
  for(let k = min+1; k <= Math.min(20, maxSlots); k++){
    const marg = A(k) - A(k-1);
    const occ  = A(k) / (k * cap);
    if(marg < 10 || occ < target * 0.78) break;
    best = k;
  }
  return best;
}

function forecast(filmId, cinemaId, weekId){
  const film   = FILMS.find(f => f.id === filmId) || getFilm();
  const cinema = CINEMAS.find(c => c.id === cinemaId) || getCinema();
  const week   = WEEKS.find(w => w.id === weekId) || getWeek();

  const baseAPS = weightedAPS(film.similar);
  const wi      = weekIndexOf(film, week);
  const decay   = WEEK_DECAY[Math.min(Math.max(wi,0), WEEK_DECAY.length-1)];
  const preRelease = wi < 0;

  const hallIds = getHalls(cinema.id);
  const hallObjs = hallIds.map(id => cinema.halls.find(h=>h.id===id)).filter(Boolean);
  const avgCap = hallObjs.length ? hallObjs.reduce((s,h)=>s+h.cap,0)/hallObjs.length : 160;
  const premium = hallObjs.length ? hallObjs.reduce((s,h)=>s+h.premium,0)/hallObjs.length : 1;

  const slotLen = film.mins + 30;
  const maxSlots = Math.max(1, hallObjs.reduce((s)=>s + Math.floor(840/slotLen), 0));

  const days = week.days.map((d,i) => {
    const um  = state.mode === 'weekly' ? state.weeklyMult : state.dailyMult[i];
    const ceil = baseAPS * 6 * (avgCap / REF_CAP) * d.factor * decay * cinema.factor * um;
    const shows = planShows(ceil, film.rules.minShows, avgCap, state.targetOcc, maxSlots);
    const admits = ceil * (1 - Math.exp(-shows/3.2));
    const seats  = shows * avgCap;
    const occ    = seats > 0 ? admits / seats : 0;
    const band   = preRelease ? 0.24 : (0.10 + Math.abs(wi) * 0.03);
    return {
      idx:i, date:d.date, label:d.label, dow:d.dow, factor:d.factor,
      userMult:um, ceil, shows, admits, seats, occ,
      low: admits*(1-band), high: admits*(1+band),
      revenue: admits * cinema.atp * premium
    };
  });

  const tot = days.reduce((a,d)=>({
    admits: a.admits + d.admits,
    shows:  a.shows  + d.shows,
    revenue:a.revenue+ d.revenue,
    seats:  a.seats  + d.seats
  }), {admits:0,shows:0,revenue:0,seats:0});

  return {
    film, cinema, week, baseAPS, wi, decay, preRelease,
    hallIds, hallObjs, avgCap, premium, slotLen, maxSlots,
    days,
    total: { ...tot, occ: tot.seats ? tot.admits/tot.seats : 0 }
  };
}

/* ---------------- AI NOTES ---------------- */
function aiNotes(fc){
  const out = [];
  const f = fc.film, r = f.rules;

  if(fc.preRelease){
    out.push(['n-info','◈','Pre-release title. No run history — forecast leans on ' + f.similar.length + ' comparable releases (±24% band).']);
  }

  const peak = fc.days.reduce((a,b)=> b.occ > a.occ ? b : a, fc.days[0]);
  if(peak.occ > 0.70){
    out.push(['n-warn','▲', peak.dow + ' occupancy hits ' + Math.round(peak.occ*100) + '% on ' + peak.shows + ' shows. Add a 3rd hall — marginal shows still clear 12 admits.']);
  } else if(peak.occ < 0.20){
    out.push(['n-warn','▼', 'Over-screened: ' + peak.dow + ' is running at ' + Math.round(peak.occ*100) + '%. Trim to ' + Math.max(1,peak.shows-1) + ' shows and free the hall.']);
  }

  const floorBinds = fc.days.filter(d => d.shows === r.minShows && d.occ < 0.22).length;
  if(floorBinds > 0){
    out.push(['n-info','◇', 'Distributor floor of ' + r.minShows + ' shows/day is driving ' + floorBinds + ' day(s) — not demand. That is contractual, not optimal.']);
  }

  if(fc.wi >= 2 && fc.decay < 0.42){
    out.push(['n-info','◇','Week ' + (fc.wi+1) + ' decay at ' + Math.round(fc.decay*100) + '%. Consider migrating to Indulge / Beanie once occupancy drops under 20%.']);
  }

  if(fc.total.occ > 0.24 && fc.total.occ < 0.60 && !fc.preRelease){
    out.push(['n-good','✓','Plan is balanced — ' + Math.round(fc.total.occ*100) + '% blended occupancy with ' + fc.total.shows + ' shows. No capacity left on the table.']);
  }

  if(r.imax > 0){
    const hasIMAX = fc.hallObjs.some(h => h.type === 'IMAX');
    if(!hasIMAX) out.push(['n-warn','▲','IMAX contract requires ' + r.imax + ' IMAX shows/day — no IMAX hall selected.']);
  }

  if(!out.length) out.push(['n-good','✓','Forecast is stable. No conflicts between demand and distributor terms.']);
  return out;
}

/* ---------------- SESSIONS (hall timeline) ---------------- */
function buildSessions(fc, dayIdx){
  const day = fc.days[dayIdx];
  const halls = fc.hallObjs;
  if(!halls.length || !day) return [];

  const n = day.shows;
  const dur = fc.film.mins;
  const WIN_START = fc.film.rating === '18' ? 720 : 540;   // 18-rated: no shows before 12:00
  const WIN_END = 1530;
  const usable = Math.max(0, WIN_END - WIN_START - dur);

  const busy = {};
  const load = {};
  halls.forEach(h => { busy[h.id] = []; load[h.id] = 0; });
  const out = [];

  for(let i=0;i<n;i++){
    const t = n === 1 ? WIN_START + usable/2 : WIN_START + (usable * i) / (n - 1);
    const s = Math.round(t/5)*5;
    const e = s + dur;
    // among halls free at this time, pick the least-loaded one
    const free = halls.filter(h => busy[h.id].every(b => e <= b[0] || s >= b[1]));
    if(!free.length) continue;
    free.sort((a,b) => load[a.id] - load[b.id]);
    const h = free[0];
    busy[h.id].push([s,e]);
    load[h.id]++;
    out.push({ hallId:h.id, hallName:h.name, cap:h.cap, start:s, end:e,
               filmId:fc.film.id, dur:e-s, uid:'s4-'+dayIdx+'-'+out.length });
  }

  // prime-time weighting: evening shows pull more of the day's admits
  const weight = s => (s >= 1080 && s <= 1320) ? 1.45 : (s >= 900) ? 1.10 : (s >= 780) ? 0.95 : 0.72;
  const wsum = out.reduce((a,x)=> a + weight(x.start), 0) || 1;
  out.forEach(x => {
    x.admits = day.admits * weight(x.start) / wsum;
    x.occ = Math.min(1, x.admits / x.cap);
  });
  return out;
}
function hhmm(m){
  const h = Math.floor(m/60) % 24, mm = m % 60;
  return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

/* ---------------- WEEK BOARD (multi-film screen schedule) ---------------- */
/* operating day runs 09:00 -> 06:00 next day, like the printed screen schedule */
const OPEN_MIN = 540;        // 09:00
const PLACE_CLOSE = 1530;    // last session must end by 01:30
const DISPLAY_END = 1800;    // axis runs to 06:00
const SPAN_MIN = DISPLAY_END - OPEN_MIN;   // 1260
const WEEK_VIEW_END = 1560;  // week heat-grid compresses to 02:00
const TURNOVER = 30;
const REF_CAP = 120;         // reference auditorium size for the demand baseline
const FILM_COLORS = {
  baga:'#E4002B', godzilla:'#06B6D4', ramayana:'#8B5CF6', conjuring:'#F59E0B',
  zootopia:'#22D3A6', wicked:'#84CC16', predator:'#F97316', nowyouseeme:'#3B82F6',
  spongebob:'#FACC15', pulau:'#6B7280'
};
const primeWeight = s => (s >= 1080 && s <= 1320) ? 1.45 : (s >= 900) ? 1.10 : (s >= 780) ? 0.95 : 0.72;

function demandCeil(film, cinema, week, di, avgCap){
  const d = week.days[di];
  if(pd(film.release) > d.date) return 0;
  const wi = weekIndexOf(film, week);
  const decay = WEEK_DECAY[Math.min(Math.max(wi,0), WEEK_DECAY.length-1)];
  const sizeScale = avgCap ? avgCap / REF_CAP : 1;
  return weightedAPS(film.similar) * 6 * sizeScale * d.factor * decay * cinema.factor;
}

function tryPlace(busy, halls, film, startMin, need){
  const s = Math.round(startMin/5)*5;
  const e = s + film.mins;
  if(s < OPEN_MIN || e > PLACE_CLOSE) return null;
  const free = halls.filter(h => {
    // IMAX only takes titles with an IMAX contract
    if(h.type === 'IMAX' && !(film.rules.imax > 0)) return false;
    return busy[h.id].every(b => e <= b[0] || s >= b[1]);
  });
  if(!free.length) return null;
  // don't drop a film into a room far smaller than its per-show demand
  const big = free.filter(h => h.cap >= need);
  const pool = big.length ? big : free;
  // main auditoriums first, then rotate by load so one film doesn't own a screen all week
  pool.sort((a,b)=>{
    const ta = a.cap >= 100 ? 0 : 1, tb = b.cap >= 100 ? 0 : 1;
    if(ta !== tb) return ta - tb;
    const la = busy[a.id].length, lb = busy[b.id].length;
    if(la !== lb) return la - lb;
    return b.cap - a.cap;
  });
  const h = pool[0];
  return { hallId:h.id, hallName:h.name, cap:h.cap, start:s, end:e };
}

function buildWeekBoard(cinemaId, weekId){
  const cinema = CINEMAS.find(c=>c.id===cinemaId) || getCinema();
  const week   = WEEKS.find(w=>w.id===weekId) || getWeek();
  // planning capacity ignores the tiny premium/beanie rooms so occupancy stays honest
  const mainHalls = cinema.halls.filter(h => h.cap >= 100);
  const avgCap = (mainHalls.length ? mainHalls : cinema.halls)
    .reduce((s,h)=>s+h.cap,0) / (mainHalls.length || cinema.halls.length);

  const days = week.days.map((d, di) => {
    const busy = {};
    cinema.halls.forEach(h => busy[h.id] = []);
    const sessions = [];

    // seed contractual hall usage — rentals and closures block the timeline first
    cinema.halls.forEach(h => {
      (h.fixed || []).forEach(b => {
        if(b.days && b.days.indexOf(di) < 0) return;
        busy[h.id].push([b.from, b.to]);
        sessions.push({
          hallId:h.id, hallName:h.name, cap:h.cap,
          start:b.from, end:b.to, type:b.type, label:b.label,
          uid:'fx-'+h.id+'-'+b.from
        });
      });
    });

    // rank films by that day's demand — biggest title gets first pick of screens
    let sctr = 0;
    const ranked = FILMS
      .map(f => ({ f, dem: demandCeil(f, cinema, week, di, avgCap) }))
      .filter(x => x.dem > 0)
      .sort((a,b) => b.dem - a.dem);

    ranked.forEach(({ f, dem }) => {
      const slotLen  = f.mins + TURNOVER;
      const maxSlots = cinema.halls.length * Math.max(1, Math.floor((PLACE_CLOSE-OPEN_MIN)/slotLen));
      const shows    = planShows(dem, f.rules.minShows, avgCap, state.targetOcc, maxSlots);
      const usable   = PLACE_CLOSE - OPEN_MIN - f.mins;
      const need     = dem / Math.max(1, shows);
      const placed   = [];

      for(let i=0;i<shows;i++){
        const pref = shows === 1 ? OPEN_MIN + usable/2 : OPEN_MIN + (usable * i)/(shows - 1);
        let res = null;
        for(const shift of [0,15,-15,30,-30,45,-45,60,-60,75,-75,90,-90]){
          res = tryPlace(busy, cinema.halls, f, pref + shift, need);
          if(res) break;
        }
        if(res){
          busy[res.hallId].push([res.start, res.end + TURNOVER]);
          res.filmId = f.id;
          res.uid = 'f'+di+'-'+(sctr++);
          placed.push(res);
        }
      }

      const totalAdmits = dem * (1 - Math.exp(-Math.max(1, placed.length)/3.2));
      // split a film's demand across its sessions by prime-time pull AND hall size
      const wsum = placed.reduce((a,s)=> a + primeWeight(s.start) * s.cap, 0) || 1;
      placed.forEach(s => { s.admits = totalAdmits * primeWeight(s.start) * s.cap / wsum; });
      // any session that overflows its room spills into the sessions that still have headroom
      for(let pass = 0; pass < 3; pass++){
        let spill = 0;
        placed.forEach(s => { if(s.admits > s.cap){ spill += s.admits - s.cap; s.admits = s.cap; } });
        if(spill < 1) break;
        const head = placed.filter(s => s.admits < s.cap);
        const hw = head.reduce((a,s)=> a + (s.cap - s.admits), 0);
        if(hw <= 0) break;
        head.forEach(s => { s.admits += spill * (s.cap - s.admits) / hw; });
      }
      placed.forEach(s => {
        s.occ = Math.min(1, s.admits / s.cap);
        sessions.push(s);
      });
    });

    // Guarantee the location manager really shows the whole slate: any
    // in-release title the preferred-time heuristic could not place gets one
    // legal slot by scanning the operating day in 5-minute steps.
    const programmed = new Set(sessions.filter(s => !s.type).map(s => s.filmId));
    ranked.forEach(({ f, dem }) => {
      if(programmed.has(f.id)) return;
      for(let t = OPEN_MIN; t + f.mins <= PLACE_CLOSE; t += 5){
        const res = tryPlace(busy, cinema.halls, f, t, Math.max(1, dem));
        if(!res) continue;
        busy[res.hallId].push([res.start, res.end + TURNOVER]);
        res.filmId = f.id;
        res.uid = 'f'+di+'-'+(sctr++);
        res.admits = Math.min(res.cap, dem);
        res.occ = Math.min(1, res.admits / res.cap);
        sessions.push(res);
        programmed.add(f.id);
        break;
      }
    });

    settleSessions(sessions, cinema.halls);
    const shows  = sessions.filter(s => !s.type);
    const seats  = shows.reduce((a,s)=> a + s.cap, 0);
    const admits = shows.reduce((a,s)=> a + (s.admits||0), 0);
    return { idx:di, day:d, sessions, shows, seats, admits, occ: seats ? admits/seats : 0 };
  });

  return { cinema, week, days };
}

/* ============================================================
   DRAG SUPPORT — stable ids + persisted overrides + overlap reflow
   Sessions are regenerated from the forecast on every render, so a drag is
   stored as an override keyed by the session's stable uid. settleSessions()
   applies those overrides and resolves any Hall overlap deterministically
   (rentals/closures are fixed anchors; a moved session only nudges the others
   if it actually collides), so the manual layout survives re-renders.
   ============================================================ */
function hallNameById(id){
  const c = CINEMAS.find(x => x.id === state.cinemaId) || getCinema();
  const h = c.halls.find(x => x.id === id);
  return h ? h.name : id;
}
function settleSessions(sessions, halls){
  // 1) apply persisted drag overrides (keyed by stable uid)
  sessions.forEach(s=>{
    if(s.type){ s.dur = s.end - s.start; return; }
    s.dur = s.end - s.start;
    const ov = state.overrides[s.uid];
    if(ov){
      s.start = ov.start;
      s.end = ov.start + s.dur;
      if(ov.hallId && ov.hallId !== s.hallId){
        s.hallId = ov.hallId;
        const h = halls.find(x => x.id === ov.hallId);
        if(h){ s.hallName = h.name; s.cap = h.cap; }
      }
    }
  });
  // 2) resolve overlaps per hall — only shift a movable session when it truly
  //    collides, so the auto-generated layout stays intact until you drag.
  halls.forEach(h=>{
    const all   = sessions.filter(s => s.hallId === h.id);
    const fixed = all.filter(s => s.type).sort((a,b)=> a.start - b.start);
    const mov   = all.filter(s => !s.type).sort((a,b)=> a.start - b.start);
    let cursor = OPEN_MIN, fi = 0;
    mov.forEach(s=>{
      let st = Math.max(s.start, cursor);
      while(fi < fixed.length && fixed[fi].end + TURNOVER <= st) fi++;
      while(fi < fixed.length && st < fixed[fi].end + TURNOVER){
        st = fixed[fi].end + TURNOVER; fi++;
      }
      if(st < cursor) st = cursor;
      if(st + s.dur > PLACE_CLOSE) st = Math.max(OPEN_MIN, PLACE_CLOSE - s.dur);
      s.start = st; s.end = st + s.dur;
      cursor = s.end + TURNOVER;
    });
    mov.forEach(s => { s.occ = Math.min(1, (s.admits||0) / s.cap); });
  });
  return sessions;
}

function managerFilmStats(board){
  const week = {}, day = {}, dayHalls = {};
  FILMS.forEach(f => { week[f.id] = 0; day[f.id] = 0; dayHalls[f.id] = new Set(); });
  board.days.forEach(bd => bd.shows.forEach(s => {
    if(week[s.filmId] !== undefined) week[s.filmId]++;

  const dayData = board.days[Math.min(state.dayIdx, 6)];

  });
  return { week, day, dayHalls, dayData };
}

function chartSVG(fc){
  const days = fc.days;
  const W = 760, H = 218, PL = 42, PR = 14, PT = 20, PB = 30;
  const iw = W-PL-PR, ih = H-PT-PB;
  const rawMax = Math.max(...days.map(d=>d.high)) * 1.04 || 100;
  const LADDER = [1,1.5,2,2.5,3,4,5,6,8,10];
  const niceStep = v => {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v/p;
    const m = LADDER.find(x => n <= x) || 10;
    return m*p;
  };
  const tick = niceStep(rawMax/4);
  const maxY = tick * 4;
  const colW = iw/days.length;
  const bw = colW*0.5;
  const y = v => PT + ih - (v/maxY)*ih;

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = maxY*(i/4), yy = y(v);
    grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="#1C242F" stroke-width="1"/>`;
    grid += `<text x="${PL-8}" y="${(yy+3).toFixed(1)}" fill="#4E5A6B" font-size="9" text-anchor="end">${Math.round(v)}</text>`;
  }

  let bars = '';
  days.forEach((d,i)=>{
    const cx = PL + colW*i + colW/2;
    const x  = cx - bw/2;
    const top = y(d.admits);
    const hgt = PT + ih - top;
    const on = i === state.dayIdx;
    const grad = on ? 'url(#gOn)' : 'url(#gOff)';
    bars += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,hgt).toFixed(1)}" rx="3" fill="${grad}"/>`;
    bars += `<line x1="${cx.toFixed(1)}" y1="${y(d.high).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y(d.low).toFixed(1)}" stroke="${on?'#FF6B7C':'#3A4658'}" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>`;
    bars += `<line x1="${(cx-3).toFixed(1)}" y1="${y(d.high).toFixed(1)}" x2="${(cx+3).toFixed(1)}" y2="${y(d.high).toFixed(1)}" stroke="${on?'#FF6B7C':'#3A4658'}" stroke-width="1.4" stroke-linecap="round"/>`;
    bars += `<line x1="${(cx-3).toFixed(1)}" y1="${y(d.low).toFixed(1)}" x2="${(cx+3).toFixed(1)}" y2="${y(d.low).toFixed(1)}" stroke="${on?'#FF6B7C':'#3A4658'}" stroke-width="1.4" stroke-linecap="round"/>`;
    bars += `<text x="${cx.toFixed(1)}" y="${(y(d.high)-6).toFixed(1)}" fill="${on?'#fff':'#7C8798'}" font-size="10" font-weight="600" text-anchor="middle">${Math.round(d.admits)}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H-12}" fill="${on?'#FF6B7C':'#5A6678'}" font-size="9.5" text-anchor="middle" font-weight="${on?700:500}">${d.dow}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H-3}" fill="#39424F" font-size="8" text-anchor="middle">${d.shows}×</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs>
      <linearGradient id="gOn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF5C70"/><stop offset="100%" stop-color="#B30020"/>
      </linearGradient>
      <linearGradient id="gOff" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2E3A4B"/><stop offset="100%" stop-color="#1B222D"/>
      </linearGradient>
    </defs>
    ${grid}${bars}
  </svg>`;
}

        <span class="val num" style="color:${pct>0?'#22D3A6':pct<0?'#F5A524':'#fff'}">${pct>0?'+':''}${pct}%</span>
