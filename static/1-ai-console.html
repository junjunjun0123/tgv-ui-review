      <input type="range" min="60" max="150" step="1" value="${Math.round(state.weeklyMult*100)}" data-slider="weekly">
      <div class="scale"><span>−40%</span><span>baseline</span><span>+50%</span></div>
    </div>`;
  } else {
    const cells = fc.days.map((d,i)=>`
      <div class="cell">
        <label>${d.dow}</label>
        <input type="number" min="30" max="200" step="5" value="${Math.round(state.dailyMult[i]*100)}" data-daily="${i}">
      </div>`).join('');
    control = `<div class="dgrid">${cells}</div>
      <div style="font-size:9.5px;color:#5A6678;margin-top:8px">Per-day override, % of baseline. Type a value to lock that day.</div>`;
  }

  return `<div class="card">
    <div class="card-hd">
      <h4>Manual input</h4>
      <div class="seg">
        <button class="${weekly?'on':''}" data-act="mode" data-v="weekly">Weekly</button>
        <button class="${!weekly?'on':''}" data-act="mode" data-v="daily">Daily</button>
      </div>
    </div>
    <div class="card-bd">
      ${control}
      <div class="slider-wrap" style="margin-top:14px;border-top:1px dashed #1D2531;padding-top:11px">
        <div class="slider-top">
          <span class="lbl">Target occupancy</span>
          <span class="val num">${Math.round(state.targetOcc*100)}%</span>
        </div>
        <input type="range" min="15" max="65" step="1" value="${Math.round(state.targetOcc*100)}" data-slider="occ">
        <div class="scale"><span>15%</span><span>30%</span><span>65%</span></div>
      </div>
    </div>
  </div>`;
}

function driverRules(fc){
  const f = fc.film, r = f.rules;
  const rows = [];
  const mk = (ok,title,sub)=>`<div class="rule">
      <div class="ic ${ok?'on':'off'}">${ok?'✓':'–'}</div>
      <div class="tx"><b>${title}</b><small>${sub}</small></div>
    </div>`;

  rows.push(mk(r.minShows>0, r.minShows>0?`${r.minShows} shows/day minimum`:'No show minimum', r.minShows>0?'Contractual floor — cannot go lower':'Open programming'));
  rows.push(mk(r.minScreens>0, r.minScreens>0?`${r.minScreens} screen minimum`:'Screens reserved for the run', 'Distributor term'));
  rows.push(mk(!!r.mustPlay, r.mustPlay?`Must play until ${fmtDate(pd(r.mustPlay))}`:'No holdover obligation', 'Release window'));
  rows.push(mk(true, `Max ${r.maxShows} shows/day`, 'Caps cannibalisation between halls'));
  if(r.imax>0) rows.push(mk(fc.hallObjs.some(h=>h.type==='IMAX'), `IMAX: ${r.imax} shows/day`, fc.hallObjs.some(h=>h.type==='IMAX')?'IMAX hall selected':'⚠ No IMAX hall in selection'));

  return `<div class="card">
    <div class="card-hd"><h4>Distributor rules</h4><span style="font-size:9px;color:#5A6678">${f.distributor}</span></div>
    <div class="card-bd">
      ${rows.join('')}
      <div style="font-size:9.5px;color:#5A6678;margin-top:9px;line-height:1.5">${r.note}</div>
    </div>
  </div>`;
}

function stepForecast(){
  const fc = forecast();
  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>Forecast the week</h2><p>Three inputs blend into one demand curve — comparable titles, your override, and the distributor contract.</p></div>
      <div style="display:flex;gap:6px;align-items:center">
        ${WEEKS.map(w=>`<button class="hchip ${w.id===state.weekId?'on':''}" data-act="week" data-v="${w.id}">${w.label}</button>`).join('')}
      </div>
    </div>
    ${weekStrip(fc,true)}
    <div class="card" style="margin-bottom:10px">
      <div class="card-hd">
        <h4>Daily admits · ${fc.week.label}</h4>
        <span style="font-size:9.5px;color:#5A6678">bar = forecast · whisker = confidence band · n× = shows</span>
      </div>
      <div class="card-bd" style="padding:8px 6px 4px">${chartSVG(fc)}</div>
    </div>
    <div class="drivers">
      ${driverComparables(fc)}
      ${driverManual(fc)}
      ${driverRules(fc)}
    </div>
    <div class="footbar">
      <div class="fb-stats">
        <div><span>Week admits</span><b class="num">${Math.round(fc.total.admits).toLocaleString()}</b></div>
        <div><span>Shows</span><b class="num">${fc.total.shows}</b></div>
        <div><span>Occupancy</span><b class="num">${Math.round(fc.total.occ*100)}%</b></div>
        <div><span>Revenue</span><b class="num">${money(fc.total.revenue)}</b></div>
      </div>
      <button class="cta" data-act="step" data-v="3">Continue to cinema <span style="opacity:.7">→</span></button>
    </div>
  </div>`;
}

/* STEP 3 — CINEMA */
function stepCinema(){
  const cards = CINEMAS.map(c=>{
    const fcx = forecast(state.filmId, c.id, state.weekId);
    const on = c.id === state.cinemaId;
    return `<div class="cin ${on?'on':''}" data-act="cinema" data-v="${c.id}">
      <h5>${c.name}</h5>
      <div class="city">${c.city} · ${c.halls.length} halls · site factor ×${c.factor.toFixed(2)}</div>
      <div class="kv"><span>Weekly admits</span><b class="num">${Math.round(fcx.total.admits).toLocaleString()}</b></div>
      <div class="kv"><span>Shows / week</span><b class="num">${fcx.total.shows}</b></div>
      <div class="kv"><span>Occupancy</span><b class="num" style="color:${fcx.total.occ>0.55?'#22D3A6':fcx.total.occ<0.25?'#F5A524':'#D3DCE8'}">${Math.round(fcx.total.occ*100)}%</b></div>
      <div class="kv"><span>Revenue</span><b class="num">${money(fcx.total.revenue)}</b></div>
      <div class="fbar" style="margin-top:8px"><i style="width:${Math.min(100,fcx.total.occ*140)}%"></i></div>
    </div>`;
  }).join('');

  const head = `<tr><th>Film</th>${CINEMAS.map(c=>`<th>${c.name.replace('TGV ','')}</th>`).join('')}</tr>`;
  const weekEnd = getWeek().days[6].date;
  const inRelease = FILMS.filter(f => pd(f.release) <= weekEnd);
  const rows = inRelease.map(f=>{
    const cells = CINEMAS.map(c=>{
      const fx = forecast(f.id, c.id, state.weekId);
      const a = Math.round(fx.total.admits);
      const cls = fx.total.occ > 0.30 ? 'hot' : fx.total.occ > 0.18 ? 'mid' : 'cold';
      const sel = (f.id === state.filmId && c.id === state.cinemaId) ? ' sel' : '';
      return `<td class="${cls}${sel}" data-act="cell" data-film="${f.id}" data-cinema="${c.id}">${a.toLocaleString()}</td>`;
    }).join('');
    return `<tr><td>${f.title}</td>${cells}</tr>`;
  }).join('');

  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>Choose the cinema</h2><p>Demand is adjusted per site — footfall factor and ATP differ by location.</p></div>
      ${crumb()}
    </div>
    <div class="cgrid">${cards}</div>
    <div class="card" style="margin-top:12px">
      <div class="card-hd">
        <h4>Demand matrix · ${getWeek().label}</h4>
        <span style="font-size:9.5px;color:#5A6678">${inRelease.length} titles in release · weekly admits per site · click any cell to switch</span>
      </div>
      <table class="mtx"><thead>${head}</thead><tbody>${rows}</tbody></table>
    </div>
    <div class="footbar">
      <div class="fb-stats">
        <div><span>Selected site</span><b style="font-size:13px">${getCinema().name}</b></div>
        <div><span>Site factor</span><b class="num">×${getCinema().factor.toFixed(2)}</b></div>
        <div><span>Halls available</span><b class="num">${getCinema().halls.length}</b></div>
      </div>
      <button class="cta" data-act="step" data-v="4">Program halls <span style="opacity:.7">→</span></button>
    </div>
  </div>`;
}

/* STEP 4 — HALL */
function stepHall(){
  const fc = forecast();
  const cinema = fc.cinema;
  const dayIdx = Math.min(state.dayIdx, 6);
  const day = fc.days[dayIdx];
  const sessions = buildSessions(fc, dayIdx);
  settleSessions(sessions, fc.hallObjs);
  window._SCHED = {};
  sessions.forEach(s => { if(s.uid) window._SCHED[s.uid] = s; });
  const selected = getHalls();

  const chips = cinema.halls.map(h=>{
    const on = selected.indexOf(h.id) >= 0;
    return `<button class="hchip ${on?'on':''}" data-act="hall" data-v="${h.id}">
      ${h.name}<span class="cp">${h.cap}</span>
    </button>`;
  }).join('');

  const hours = [];
  for(let h=9; h<26; h++) hours.push(h);

  // Render selected halls PLUS any hall that holds a session (a session dragged
  // onto a non-selected hall must never disappear from the timeline).
  const rows = cinema.halls
    .filter(h => selected.indexOf(h.id) >= 0 || sessions.some(s => s.hallId === h.id))
    .map(h=>{
    const ss = sessions.filter(s => s.hallId === h.id);
    const blocks = ss.map(s=>{
      const left = (s.start - 540) / 1020 * 100;
      const width = (s.end - s.start) / 1020 * 100;
      const occ = Math.round(s.occ*100);
      const bg = occ > 60 ? 'linear-gradient(160deg,#E4002B,#8E0019)'
               : occ > 35 ? 'linear-gradient(160deg,#B30020,#5E0F1B)'
               : 'linear-gradient(160deg,#3B1620,#1E0A10)';
      return `<div class="sess" data-uid="${s.uid}" data-start="${s.start}" data-dur="${s.dur}" data-hall="${s.hallId}" data-cap="${s.cap}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;background:${bg}"
        title="${fc.film.title} · ${hhmm(s.start)}–${hhmm(s.end)} · ${Math.round(s.admits)}/${s.cap} admits (${occ}%)">
        <b>${hhmm(s.start)}–${hhmm(s.end)}</b>
        <small>${Math.round(s.admits)}/${s.cap} · ${occ}%</small>
      </div>`;
    }).join('');
    return `<div class="tl-row" data-hall="${h.id}">
      <div class="lbl"><b>${h.name}</b><small>${h.type} · ${h.cap} seats</small></div>
      <div class="tl-track" data-span="1020">${blocks}</div>
    </div>`;
  }).join('');

  const body = selected.length
    ? rows
    : `<div class="empty-hint">No halls selected. Pick one above to start programming.</div>`;

  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>Assign halls & slots</h2><p>Auto-generated from the forecast — ${day.shows} shows on ${day.dow} ${day.date.getDate()} ${MONTHS[day.date.getMonth()]}, ${Math.round(day.admits)} projected admits.</p></div>
      ${crumb()}
    </div>
    ${weekStrip(fc,true)}
    <div class="hchips">${chips}</div>
    <div class="tl">
      <div class="tl-hd">
        <div class="lbl">Screen</div>
        <div class="hrs">${hours.map(h=>`<span>${String(h).padStart(2,'0')}</span>`).join('')}</div>
      </div>
      ${body}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:10px;color:#5A6678">
      <span>Operating window ${fc.film.rating==='18'?'12:00':'09:00'} – 01:30 · ${fc.film.mins} min runtime + 30 min turnaround</span>
      <span>Hover a session to inspect its occupancy</span>
    </div>
    ${daySummary(fc, sessions, day)}
    <div class="footbar">
      <div class="fb-stats">
        <div><span>Week admits</span><b class="num">${Math.round(fc.total.admits).toLocaleString()}</b></div>
        <div><span>Week shows</span><b class="num">${fc.total.shows}</b></div>
        <div><span>Week revenue</span><b class="num">${money(fc.total.revenue)}</b></div>
      </div>
      <button class="cta" data-act="publish">Publish plan to POS <span style="opacity:.7">→</span></button>
    </div>
  </div>`;
}

function daySummary(fc, sessions, day){
  const seats   = sessions.reduce((a,s)=>a+s.cap,0);
  const admits  = sessions.reduce((a,s)=>a+s.admits,0);
  const rev     = admits * fc.cinema.atp * fc.premium;
  const occ     = seats ? admits/seats : 0;
  const byHall  = {};
  sessions.forEach(s=>{
    if(!byHall[s.hallId]) byHall[s.hallId] = {name:s.hallName, cap:s.cap, n:0, admits:0};
    byHall[s.hallId].n++;
    byHall[s.hallId].admits += s.admits;
  });
  const bars = Object.values(byHall).map(h=>{
    const o = h.cap*h.n ? h.admits/(h.cap*h.n) : 0;
    return `<div class="ubar">
      <div class="ubar-top"><span>${h.name}</span><b class="num">${h.n} shows · ${Math.round(o*100)}%</b></div>
      <div class="fbar"><i style="width:${Math.min(100,o*100)}%"></i></div>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-top:12px">
    <div class="card-hd">
      <h4>Day summary · ${day.dow} ${day.date.getDate()} ${MONTHS[day.date.getMonth()]}</h4>
      <span style="font-size:9.5px;color:#5A6678">${sessions.length} of ${day.shows} planned shows placed</span>
    </div>
    <div class="card-bd">
      <div class="kpis" style="margin-top:0;grid-template-columns:repeat(4,1fr)">
        <div class="kpi"><div class="k">Admits</div><div class="v num">${Math.round(admits).toLocaleString()}</div></div>
        <div class="kpi"><div class="k">Seats offered</div><div class="v num">${seats.toLocaleString()}</div></div>
        <div class="kpi"><div class="k">Occupancy</div><div class="v num" style="color:${occ>0.5?'#22D3A6':occ<0.2?'#F5A524':'#fff'}">${Math.round(occ*100)}%</div></div>
        <div class="kpi"><div class="k">Revenue</div><div class="v num" style="font-size:12.5px">${money(rev)}</div></div>
      </div>
      <div class="ubars">${bars}</div>
    </div>
  </div>`;
}

/* STEP 5 — BOARD (week overview + day screen schedule) */
function formatTag(h, f){
  if(h.type === 'IMAX') return 'IMAX2D';
  if(h.name.indexOf('BED') >= 0) return 'BED';
  if(h.type === 'Indulge') return 'INDU';
  if(f && f.lang === 'BM') return 'BM';
  return '2D';
}

function boardTotals(days, cinema){
  const t = days.reduce((a,d)=>({
    shows: a.shows + d.shows.length,
    admits: a.admits + d.admits,
    seats: a.seats + d.seats
  }), {shows:0, admits:0, seats:0});
  return { ...t, revenue: t.admits * cinema.atp };
}

/* ---- DAY VIEW: continuous 09:00 -> 06:00 screen schedule ---- */
function dayTimeline(board, di){
  const { cinema, week, days } = board;
  const bd = days[di];
  window._SCHED = {};
  bd.sessions.forEach(s => { if(s.uid) window._SCHED[s.uid] = s; });
  const hours = [];
  for(let h = 9; h < 30; h++) hours.push(h);

  const rows = cinema.halls.map(h=>{
    const ss = bd.sessions.filter(s => s.hallId === h.id).sort((a,b)=>a.start-b.start);
    const blocks = ss.map(s=>{
      const left = (s.start - OPEN_MIN)/SPAN_MIN*100;
      const w    = (s.end - s.start)/SPAN_MIN*100;
      const sty  = `left:${left.toFixed(3)}%;width:${w.toFixed(3)}%`;
      if(s.type){
        return `<div class="dsess blk-${s.type}" style="${sty}" title="${s.label} · ${hhmm(s.start)}–${hhmm(s.end)}">
          <b>${s.label}</b><small>${hhmm(s.start)}-${hhmm(s.end)}</small></div>`;
      }
      const f = FILMS.find(x=>x.id===s.filmId);
      const tag = formatTag(h, f);
      return `<div class="dsess" data-uid="${s.uid}" data-start="${s.start}" data-dur="${s.dur}" data-hall="${s.hallId}" data-cap="${s.cap}" style="${sty};background:${FILM_COLORS[s.filmId]}" title="${f.title} · ${hhmm(s.start)}–${hhmm(s.end)} · ${Math.round(s.admits)}/${s.cap} seats (${Math.round(s.occ*100)}%)">
        <b>[${tag}] ${f.title}</b><small>${hhmm(s.start)}-${hhmm(s.end)}</small></div>`;
    }).join('');

    const rev = ss.filter(s=>!s.type).reduce((a,s)=> a + s.admits * cinema.atp * h.premium, 0);
    const cnt = ss.filter(s=>!s.type).length;
    return `<div class="drow" data-hall="${h.id}">
      <div class="dlbl"><b>${h.name}</b><small>${h.cap} seats · ${money(rev)}</small></div>
      <div class="dtrack" data-span="1260">${blocks}</div>
    </div>`;
  }).join('');

  const d = week.days[di].date;
  const dayLabel = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}, ${week.days[di].dow === 'Sun' ? 'Sunday' : week.days[di].dow === 'Mon' ? 'Monday' : week.days[di].dow === 'Tue' ? 'Tuesday' : week.days[di].dow === 'Wed' ? 'Wednesday' : week.days[di].dow === 'Thu' ? 'Thursday' : week.days[di].dow === 'Fri' ? 'Friday' : 'Saturday'}`;

  return `<div class="dt">
    <div class="drow dhead">
      <div class="dlbl"><b>Screen</b><small>Time →</small></div>
      <div class="dhours">${hours.map(h=>`<span>${String(h%24).padStart(2,'0')}</span>`).join('')}</div>
    </div>
    ${rows}
  </div>
  <div class="dt-daybar">
    <button class="navbtn" data-act="daymove" data-v="-1">‹</button>
    <div class="dt-dayname">${dayLabel}</div>
    <button class="navbtn" data-act="daymove" data-v="1">›</button>
    <div class="dt-sum">${bd.shows.length} shows · ${Math.round(bd.admits).toLocaleString()} admits · ${Math.round(bd.occ*100)}% occupancy</div>
  </div>`;
}

function stepBoard(boardData){
  const board = boardData || buildWeekBoard(state.cinemaId, state.weekId);
  const { cinema, week, days } = board;
  const manager = state.workspace === 'manager';
  const view = state.boardView || 'day';
  const di = Math.min(state.dayIdx, 6);
  const totals = boardTotals(days, cinema);
  const slotCapacity = cinema.halls.length * week.days.length *
    Math.floor((PLACE_CLOSE-OPEN_MIN)/(FILMS[0].mins + TURNOVER));
  const inRelease = FILMS.filter(f => pd(f.release) <= week.days[6].date).length;

  const legend = FILMS.map(f=>
    `<span class="lg"><i style="background:${FILM_COLORS[f.id]}"></i>${f.title.split(':')[0]}</span>`
  ).join('') + `<span class="lg"><i class="lg-rental"></i>Hall rental</span><span class="lg"><i class="lg-closed"></i>Closed</span>`;

  const viewToggle = `<div class="seg">
    <button class="${view==='day'?'on':''}" data-act="bview" data-v="day">Day</button>
    <button class="${view==='week'?'on':''}" data-act="bview" data-v="week">Week</button>
  </div>`;

  const locationBar = manager ? `<div class="mgr-locbar">
    <span class="mgr-loc-label">Location</span>
    ${CINEMAS.map(c=>`<button class="hchip ${c.id===cinema.id?'on':''}" data-act="location" data-v="${c.id}">
      ${c.name.replace('TGV ','')}<span class="cp">${c.halls.length} halls</span>
    </button>`).join('')}
    <span class="mgr-loc-note">All ${inRelease} in-release movies · all ${cinema.halls.length} halls from this location</span>
  </div>` : '';

  let body;
  if(view === 'day'){
    body = dayTimeline(board, di);
  } else {
    const head = `<div class="brow bhead">
      <div class="blbl">Screen</div>
      ${week.days.map((d,i)=>`<div class="bcell bdh ${i===state.dayIdx?'on':''}" data-act="day" data-v="${i}">
        <div class="dw">${d.dow}</div><div class="dd num">${d.date.getDate()}</div>
      </div>`).join('')}
    </div>`;

    const rows = cinema.halls.map(h=>{
      const cells = days.map((bd,i)=>{
        const ss = bd.sessions.filter(s => s.hallId === h.id && !s.type);
        const blocks = ss.map(s=>{
          const left = (s.start - OPEN_MIN)/(WEEK_VIEW_END-OPEN_MIN)*100;
          const w    = (s.end - s.start)/(WEEK_VIEW_END-OPEN_MIN)*100;
          const f = FILMS.find(x=>x.id===s.filmId);
          return `<div class="blk" style="left:${left.toFixed(2)}%;width:${Math.max(0.8,w).toFixed(2)}%;background:${FILM_COLORS[s.filmId]}" title="${f.title} · ${hhmm(s.start)}–${hhmm(s.end)} · ${Math.round(s.admits)}/${s.cap} (${Math.round(s.occ*100)}%)"></div>`;
        }).join('');
        const occ = ss.length ? ss.reduce((a,s)=>a+s.occ,0)/ss.length : 0;
        const off = !ss.length;
        return `<div class="bcell ${i===state.dayIdx?'on':''} ${off?'off':''}" data-act="boardcell" data-hall="${h.id}" data-day="${i}">
          <div class="track">${blocks}</div>
          <div class="meta"><span>${ss.length}×</span><span>${off?'—':Math.round(occ*100)+'%'}</span></div>
        </div>`;
      }).join('');
      return `<div class="brow">
        <div class="blbl"><b>${h.name}</b><small>${h.type} · ${h.cap}</small></div>
        ${cells}
      </div>`;
    }).join('');

    const totalRow = `<div class="brow btotal">
      <div class="blbl"><b>All screens</b><small>${totals.shows} sessions</small></div>
      ${days.map((bd,i)=>`<div class="bcell ${i===state.dayIdx?'on':''}" data-act="day" data-v="${i}">
        <div class="bt-admits num">${Math.round(bd.admits).toLocaleString()}</div>
        <div class="bt-sub">${bd.shows.length}× · ${Math.round(bd.occ*100)}%</div>
      </div>`).join('')}
    </div>`;

    body = `<div class="board">${head}${rows}${totalRow}</div>
      <div class="board-legend"><span>09:00</span><span class="axis"><i></i></span><span>02:00</span></div>`;
  }

  const approval = manager ? currentApproval() : null;
  const coverage = ratingsCoverage();
  const ratingLead = approval
    ? ''
    : (coverage.complete
      ? `All ${coverage.submitted}/${coverage.total} attributed ratings complete.`
      : `Only ${coverage.submitted}/${coverage.total} attributed ratings; approval is locked until film rating is complete.`);
  const heading = manager
    ? `Showtime manager · ${cinema.name}`
    : (view==='day' ? 'Screen schedule' : 'Week board');
  const blurb = manager
    ? (approval
      ? `Approved by ${approval.byName} on ${formatWhen(approval.at)} · all ${inRelease} in-release movies and all ${cinema.halls.length} halls. Reopen the schedule to drag sessions.`
      : `${ratingLead} All ${inRelease} in-release movies and all ${cinema.halls.length} halls from this location on one screen. Drag any session to change its time or hall.`)
    : (view==='day'
      ? 'Continuous operating day, 09:00 to 06:00 — every screen, every session, with hall rentals and closures.'
      : 'Every screen, every film, the whole week — auto-programmed from the forecast.');

  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>${heading}</h2><p>${blurb}</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        ${viewToggle}
        ${WEEKS.map(w=>`<button class="hchip ${w.id===state.weekId?'on':''}" data-act="week" data-v="${w.id}">${w.label}</button>`).join('')}
      </div>
    </div>

    ${locationBar}

    <div class="legend">${legend}</div>

    ${body}

    <div class="footbar">
      <div class="fb-stats">
        <div><span>Sessions</span><b class="num">${totals.shows}</b></div>
        <div><span>Admits</span><b class="num">${Math.round(totals.admits).toLocaleString()}</b></div>
        <div><span>Occupancy</span><b class="num">${Math.round((totals.seats ? totals.admits/totals.seats : 0) * 100)}%</b></div>
        <div><span>Revenue</span><b class="num">${money(totals.revenue)}</b></div>
        <div><span>Screen utilisation</span><b class="num">${Math.round(totals.shows/Math.max(1,slotCapacity)*100)}%</b></div>
      </div>
      <button class="cta" data-act="publish">Publish week <span style="opacity:.7">→</span></button>
    </div>
  </div>`;
}

/* ---------- STEP 1 RAIL: choose the film to rate ---------- */
function ratingRail(board){
  const weekEnd = board.week.days[6].date;
  const cur = state.ratingDraft.filmId;
  const items = FILMS.map(f=>{
    const released = pd(f.release) <= weekEnd;
    const badge = f.status === 'NEW' ? 'b-new' : f.status === 'HOLDOVER' ? 'b-hold' : 'b-up';
    const badgeTxt = f.status === 'NEW' ? 'New' : f.status === 'HOLDOVER' ? 'Hold' : 'Soon';
    const n = filmScores(f.id).length;
    return `<div class="film mgr-film rate-rail-film ${f.id===cur?'on':''} ${released?'':'mgr-inactive'}" data-act="ratefilm" data-v="${f.id}">
      <div class="poster" style="background:linear-gradient(150deg,${f.c1},${f.c2})"><img class="poster-img" src="${posterURL(f.id)}" alt=""></div>
      <div class="film-meta">
        <div class="film-title">${escapeText(f.title)}</div>
        <div class="film-sub"><i class="mgr-swatch" style="background:${FILM_COLORS[f.id]}"></i><span class="badge ${badge}">${badgeTxt}</span>${f.rating} · ${f.mins}m</div>
        <div class="film-proj">INDEX <b>${n ? filmAverage(f.id).toFixed(1) : '—'}</b> / 100</div>

  }).join('');
  return `<aside class="rail">
    <div class="rail-hd"><h3>Films to rate</h3><span class="cnt">${FILMS.length}</span></div>
    <div class="mgr-rail-note">${board.cinema.name} · ${board.week.label}. Pick a title, then set five weighted dimensions for the selected programmer.</div>

  </aside>`;
}

function scoreViewBar(board){

/* Live gauge/verdict update while a slider is dragged — no full re-render, so
   pointer capture and keyboard focus stay on the slider. */
function updateScorecardLive(){
  const dims = state.ratingDraft.dims;
  DIMS.forEach(d=>{
    const v = document.querySelector(`[data-dim-value="${d.k}"]`);
    if(v) v.textContent = dims[d.k];
  });
  const idx = indexOfDims(dims);
  const C = 2*Math.PI*46;
  const arc = document.querySelector('[data-gauge-arc]');
  if(arc) arc.setAttribute('stroke-dasharray', `${(C*idx/100).toFixed(1)} ${C.toFixed(1)}`);
  const num = document.querySelector('[data-gauge-value]');
  if(num) num.textContent = Math.round(idx);
  const vd = verdict(idx);
  const lab = document.querySelector('[data-verdict-label]');
  if(lab){ lab.textContent = vd.label; lab.style.color = vd.color; }
  const note = document.querySelector('[data-verdict-note]');
  if(note) note.textContent = vd.note;
  const dl = document.querySelector('[data-verdict-delta]');
  if(dl){
    const f = FILMS.find(x=>x.id===state.ratingDraft.filmId) || FILMS[0];
    const anchor = compAnchor(f), delta = idx - anchor;
    dl.textContent = `${delta>=0?'▲':'▼'} ${Math.abs(Math.round(delta))} vs comparables (${Math.round(anchor)})`;
    dl.style.color = delta >= 0 ? '#8FD8C4' : '#E8C48A';
  }
}

function scoreCardHTML(f, programmer, d, idx, vd, anchor, delta, C, saved){
  const dims = DIMS.map(dim=>{
    const val = d.dims[dim.k];
    return `<div class="rate-dim">
      <div class="rate-dim-t"><span class="nm">${dim.label}</span><span class="vl" data-dim-value="${dim.k}">${val}</span></div>
      <div class="w">weight ${Math.round(dim.w*100)}%</div>

      <input type="range" min="0" max="100" step="1" value="${val}" data-rating-dim="${dim.k}" style="--pct:${val}%"/>
    </div>`;
  }).join('');
  const programmerOptions = PROGRAMMERS.map(p=>
    `<option value="${p.id}" ${p.id===programmer.id?'selected':''}>${p.name} · ${p.role}</option>`).join('');
  const ring = `<svg width="90" height="90" viewBox="0 0 104 104">

    <text x="52" y="71" text-anchor="middle" class="ring-l">INDEX</text>
  </svg>`;
  const savedDims = validDims(saved?.dims);

  const savedNote = locked
    ? 'Schedule approved — saving a new score returns it to draft.'
    : (savedDims
      ? `Saved by ${programmer.name} · ${escapeText(saved?.at || '')} · INDEX ${Math.round(indexOfDims(savedDims))}`

      </div>

}

function consensusHTML(f){
  const xs = filmScores(f.id), avg = filmAverage(f.id), spread = filmSpread(f.id);
  const info = consensusInfo(spread, xs.length);
  const cards = PROGRAMMERS.map(p=>{
    const cell = ratingCell(f.id, p.id);
    const dims = validDims(cell?.dims);
    const ix = dims ? indexOfDims(dims) : null;
    const vd = ix === null ? null : verdict(ix);
    const bars = dims ? DIMS.map(d=>`<div class="cons-bar"><span>${d.label.split(' ')[0]}</span><i><b style="width:${dims[d.k]}%"></b></i><span>${dims[d.k]}</span></div>`).join('') : '';
    return `<div class="cons-card ${dims?'':'missing'}">
      <div class="who">${escapeText(p.name)}</div>
      <div class="role">${p.role}</div>
      <div class="ix">${ix===null?'—':Math.round(ix)}<small> / 100 INDEX</small></div>
      <div class="vd" style="color:${vd?vd.color:'#5A6678'}">${vd?vd.label:'Not rated'}</div>
      ${dims?`<div class="cons-bars">${bars}</div>`:''}
      <div class="at">${escapeText(cell?.at || 'not rated')}</div>
    </div>`;
  }).join('');
  return `<div class="rate-sec" style="margin-top:16px">Who scored this film · consensus average</div>
    <div class="cons-grid">${cards}</div>
    <div class="score-flow" style="margin-top:10px;margin-bottom:0">
      <div class="score-flow-main"><span class="step-badge">Σ</span>
        <div><b>Consensus INDEX ${xs.length ? avg.toFixed(1) : '—'} / 100</b>
        <small>${xs.length}/${PROGRAMMERS.length} programmers · ${spread.toFixed(0)} point spread · ${info.label}</small></div>
      </div>
      <div class="score-flow-actions"><button class="ov-link" data-act="scoreview" data-v="overview">See everyone's ratings →</button><span class="agree agree-${info.cls}">${info.label} · ${info.text}</span></div>
    </div>`;
}

function scoreDossier(board){
  const coverage = ratingsCoverage();
  const f = FILMS.find(x=>x.id===state.ratingDraft.filmId) || FILMS[0];
  const programmer = PROGRAMMERS.find(p=>p.id===state.ratingDraft.programmerId) || PROGRAMMERS[0];
  const d = state.ratingDraft;
  const idx = indexOfDims(d.dims), vd = verdict(idx);
  const anchor = compAnchor(f), delta = idx - anchor, C = 2*Math.PI*46;
  const saved = ratingCell(f.id, programmer.id);
  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>Film rating · five-dimension INDEX</h2>
      <p>Rate one film at a time like a programming meeting. Each programmer's five weighted sliders roll up into an attributed INDEX; the consensus is the mean of all ${PROGRAMMERS.length}.</p></div>
    </div>
    ${scoreViewBar(board)}
    ${scoreFlow(coverage)}
    <div class="rate-two">
      ${dossierHTML(f)}
      ${scoreCardHTML(f, programmer, d, idx, vd, anchor, delta, C, saved)}
    </div>
    ${consensusHTML(f)}
  </div>`;
}

function scoreMatrix(board){
  const coverage = ratingsCoverage();
  const submitted = coverage.submitted;
  const filmsRated = FILMS.filter(f=>filmScores(f.id).length===PROGRAMMERS.length).length;
  const slateAvg = FILMS.reduce((a,f)=>a+filmAverage(f.id),0)/FILMS.length;
  const ranked = FILMS.map(f=>({f,avg:filmAverage(f.id),spread:filmSpread(f.id)})).sort((a,b)=>b.avg-a.avg);
  const debated = ranked.reduce((a,b)=>b.spread>a.spread?b:a);
  const strongest = ranked.reduce((a,b)=>b.spread<a.spread?b:a);
  const rows = ranked.map(({f,avg,spread},i)=>{
    const count = filmScores(f.id).length;
    const info = consensusInfo(spread,count);
    const cells = PROGRAMMERS.map(p=>{
      const cell = ratingCell(f.id,p.id);
      const dims = validDims(cell?.dims);
      const ix = dims ? indexOfDims(dims) : null;
      const cls = ix===null?'none':ix>=78?'hi':ix<45?'lo':'mid';
      return `<td class="score-cell ${cls}" data-act="edit-rating" data-film="${f.id}" data-programmer="${p.id}" title="${ix===null?p.name+' has not rated this film yet':p.name+' · INDEX '+Math.round(ix)+' · '+(cell?.at||'')}">
        <b>${ix===null?'—':Math.round(ix)}</b><small>${p.short}</small></td>`;
    }).join('');
    return `<tr>
      <td><div class="score-film"><span class="rank">${i+1}</span><img class="ov-film-thumb" src="${posterURL(f.id)}" alt=""><b>${escapeText(f.title)}</b></div></td>
      ${cells}
      <td class="score-avg"><b>${avg.toFixed(1)}</b><small>/ 100</small></td>
      <td class="center"><span class="agree agree-${info.cls}">${info.label} · ${info.text}</span></td>
    </tr>`;
  }).join('');
  const noteText = coverage.complete
    ? 'Ratings complete. Every film carries four attributed INDEX ratings; click any cell to open that programmer\'s five sliders.'
    : `Ratings incomplete: ${coverage.total-coverage.submitted} ratings are missing. Click a blank cell to open the dossier and save an INDEX for that programmer.`;
  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>All film scores · programmer consensus</h2>
      <p>One row per title, one column per programmer. Each cell is that programmer's five-dimension INDEX, not a single 1–5 score.</p></div>
    </div>
    ${scoreViewBar(board)}
    ${scoreFlow(coverage)}
    <div class="score-kpis">
      <div class="score-kpi"><div class="k">Films rated</div><div class="v num">${filmsRated}/${FILMS.length}</div><div class="s">${coverage.complete?'All titles have a consensus':'Awaiting programmer scores'}</div></div>
      <div class="score-kpi"><div class="k">Attributed ratings</div><div class="v num">${submitted}/${coverage.total}</div><div class="s">${PROGRAMMERS.length} programmers × ${FILMS.length} films</div></div>
      <div class="score-kpi"><div class="k">Slate INDEX</div><div class="v num">${slateAvg.toFixed(1)}<small style="font-size:11px;color:var(--dim2)"> / 100</small></div><div class="s">Mean of all film averages</div></div>
      <div class="score-kpi"><div class="k">Most debated</div><div class="v" style="font-size:13px;line-height:1.3">${escapeText(debated.f.title.split(':')[0])}</div><div class="s">${debated.spread.toFixed(0)} point spread</div></div>
    </div>
    <div class="note ${coverage.complete?'n-good':'n-warn'}" style="margin-bottom:12px"><span class="i">${coverage.complete?'✓':'!'}</span><span>${noteText}</span></div>
    <div class="score-table-wrap">
      <table class="score-table">
        <thead><tr><th>Film · ranked by consensus INDEX</th>${PROGRAMMERS.map(p=>`<th class="center"><b>${p.short}</b><small>${p.role}</small></th>`).join('')}<th class="center">Consensus average</th><th class="center">Agreement</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="score-help">“Strong” means the four INDEX values are within 8 points; “Split” means a gap over 20 points; “Pending” means not everyone has rated the film. Strongest consensus: ${escapeText(strongest.f.title.split(':')[0])} (${strongest.spread.toFixed(0)} spread).</p>
  </div>`;
}


/* Overall ratings: one place to see every programmer's input, side by side. */
function scoreOverview(board){
  const coverage = ratingsCoverage();
  const slateAvg = FILMS.reduce((a,f)=>a+filmAverage(f.id),0)/FILMS.length;
  const ranked = FILMS.map(f=>({f,avg:filmAverage(f.id),spread:filmSpread(f.id),count:filmScores(f.id).length}))
                      .sort((a,b)=>b.avg-a.avg);
  const full = ranked.filter(r=>r.count===PROGRAMMERS.length);
  const widest = full.slice().sort((a,b)=>b.spread-a.spread)[0];
  const PCOLORS = ['#FF3B52','#4C9AFF','#A78BFA','#22D3A6'];
  const initials = n => n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

  const progs = PROGRAMMERS.map((p,pi)=>{
    const vals = FILMS.map(f=>{
      const cell = ratingCell(f.id,p.id);
      return {f, ix:cellIndex(cell), dims:validDims(cell?.dims)};
    });
    const present = vals.filter(v=>v.ix!==null);
    const avg = present.length ? present.reduce((a,b)=>a+b.ix,0)/present.length : null;
    const dimAvg = DIMS.map(d=>{
      const ds = vals.filter(v=>v.dims).map(v=>v.dims[d.k]);
      return {k:d.k,label:d.label,v:ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null};
    });
    const top = present.length ? present.slice().sort((a,b)=>b.ix-a.ix)[0] : null;
    const low = present.length ? present.slice().sort((a,b)=>a.ix-b.ix)[0] : null;
    return {p,pi,vals,present,avg,dimAvg,top,low};
  });

  const kpis = `<div class="score-kpis">
    <div class="score-kpi"><div class="k">Attributed ratings</div><div class="v num">${coverage.submitted}/${coverage.total}</div><div class="s">${PROGRAMMERS.length} programmers × ${FILMS.length} films</div></div>
    <div class="score-kpi"><div class="k">Slate consensus INDEX</div><div class="v num">${slateAvg.toFixed(1)}<small style="font-size:11px;color:var(--dim2)"> / 100</small></div><div class="s">Mean of all ${FILMS.length} film averages</div></div>
    <div class="score-kpi"><div class="k">Films fully rated</div><div class="v num">${full.length}/${FILMS.length}</div><div class="s">${coverage.complete?'Every title has four INDEX values':'Some programmer scores still missing'}</div></div>
    <div class="score-kpi"><div class="k">Widest disagreement</div><div class="v num">${widest?widest.spread.toFixed(0):'—'}<small style="font-size:11px;color:var(--dim2)"> pts</small></div><div class="s">${widest?escapeText(widest.f.title.split(':')[0]):'No complete film yet'}</div></div>
  </div>`;

  const progCards = progs.map(g=>{
    const delta = g.avg===null ? null : g.avg-slateAvg;
    const bars = g.vals.map(v=>`<span class="ov-spark ${v.ix===null?'blank':''}" style="--h:${v.ix===null?6:Math.max(7,v.ix)}%" title="${escapeText(v.f.title)} · ${v.ix===null?'not rated':Math.round(v.ix)+' INDEX'}"></span>`).join('');
    const pick = (v,label) => v
      ? `<div class="ov-pick"><img src="${posterURL(v.f.id)}" alt=""><div><span>${label}</span><b>${escapeText(v.f.title.split(':')[0])}</b></div><em>${Math.round(v.ix)}</em></div>`
      : '';
    return `<div class="ov-prog">
      <div class="ov-prog-hd">
        <div class="ov-av" style="--c:${PCOLORS[g.pi]}">${initials(g.p.name)}</div>
        <div class="ov-who"><b>${escapeText(g.p.name)}</b><span>${escapeText(g.p.role)}</span></div>
        <div class="ov-cnt">${g.present.length}/${FILMS.length}</div>
      </div>
      <div class="ov-prog-avg"><span class="num">${g.avg===null?'—':g.avg.toFixed(1)}</span><small> / 100 avg INDEX</small>
        ${delta===null?'':`<em style="color:${delta>=0?'#8FD8C4':'#E8C48A'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1)} vs slate</em>`}</div>
      <div class="ov-sparks" title="One bar per film, in slate order">${bars}</div>
      <div class="ov-picks">${pick(g.top,'Highest')}${pick(g.low,'Lowest')}</div>
    </div>`;
  }).join('');

  const heatRows = ranked.map((r,i)=>{
    const f = r.f;
    const cells = PROGRAMMERS.map(p=>{
      const ix = cellIndex(ratingCell(f.id,p.id));
      const tone = ix===null?'none':ix>=78?'hi':ix>=62?'good':ix>=45?'mid':'lo';
      return `<td class="ov-cell ${tone}" data-act="edit-rating" data-film="${f.id}" data-programmer="${p.id}" title="${escapeText(p.name)} · ${escapeText(f.title)} · ${ix===null?'not rated':Math.round(ix)+' INDEX'}">
        <b>${ix===null?'—':Math.round(ix)}</b><i style="width:${ix===null?0:ix}%"></i></td>`;
    }).join('');
    const info = consensusInfo(r.spread,r.count);
    return `<tr>
      <td class="ov-film" data-act="ratefilm" data-v="${f.id}" title="Open ${escapeText(f.title)} dossier">
        <span class="rank">${i+1}</span><img src="${posterURL(f.id)}" alt=""><div><b>${escapeText(f.title)}</b><small>${escapeText(f.genre)}</small></div></td>
      ${cells}
      <td class="ov-avg"><b>${r.count?r.avg.toFixed(1):'—'}</b><small>/ 100</small></td>
      <td class="ov-spread num">${r.count?r.spread.toFixed(0):'—'}</td>
      <td class="center"><span class="agree agree-${info.cls}">${info.label}</span></td>
    </tr>`;
  }).join('');

  const debates = full.slice().sort((a,b)=>b.spread-a.spread).slice(0,3).map(r=>{
    const xs = PROGRAMMERS.map(p=>({p,ix:cellIndex(ratingCell(r.f.id,p.id))}))
                          .filter(x=>x.ix!==null).sort((a,b)=>b.ix-a.ix);
    const hi = xs[0], lo = xs[xs.length-1];
    return `<div class="ov-debate-card">
      <img src="${posterURL(r.f.id)}" alt="">
      <div class="ov-debate-main">
        <div class="t">${escapeText(r.f.title)}</div>
        <div class="s">${r.spread.toFixed(0)} point spread · consensus ${r.avg.toFixed(1)} INDEX</div>
        <div class="ov-scale">${xs.map(x=>`<span class="ov-dot" style="left:${x.ix}%;--c:${PCOLORS[PROGRAMMERS.indexOf(x.p)]}" title="${escapeText(x.p.name)} · ${Math.round(x.ix)}"></span>`).join('')}</div>
        <div class="ov-hilo"><b style="color:#8FD8C4">High · ${escapeText(hi.p.short)} ${Math.round(hi.ix)}</b><b style="color:#FF8A96">Low · ${escapeText(lo.p.short)} ${Math.round(lo.ix)}</b></div>
      </div>
    </div>`;
  }).join('');

  const dimRows = DIMS.map(d=>{
    const cells = progs.map(g=>{
      const x = g.dimAvg.find(y=>y.k===d.k);
      const v = x ? x.v : null;
      return `<td><div class="ov-dbar"><i style="width:${v===null?0:v}%;background:${PCOLORS[g.pi]}"></i></div><b class="num">${v===null?'—':Math.round(v)}</b></td>`;
    }).join('');
    return `<tr><th>${escapeText(d.label)}<small>weight ${Math.round(d.w*100)}%</small></th>${cells}</tr>`;
  }).join('');

  const noteText = coverage.complete
    ? `All ${coverage.total} attributed INDEX ratings are in. Click any heatmap cell to open that programmer's five sliders, or click a film to open its dossier.`
    : `${coverage.total-coverage.submitted} ratings are still missing. Blank heatmap cells are dashed — click one to open the dossier and save that programmer's INDEX.`;

  return `<div class="sec">
    <div class="sec-hd">
      <div><h2>Overall ratings · who scored what</h2>
      <p>One place to compare every programmer's input. The cards summarise each person's average and bias, the heatmap shows all ${coverage.total} individual INDEX values, and the debate cards name who is high and who is low.</p></div>
    </div>
    ${scoreViewBar(board)}
    ${scoreFlow(coverage)}
    ${kpis}
    <div class="note ${coverage.complete?'n-good':'n-warn'}" style="margin-bottom:4px"><span class="i">${coverage.complete?'✓':'!'}</span><span>${noteText}</span></div>

    <div class="ov-sec-t">Programmers at a glance <span>${PROGRAMMERS.length} people · ${coverage.submitted} attributed INDEX ratings</span></div>
    <div class="ov-prog-grid">${progCards}</div>

    <div class="ov-sec-t">All inputs · film × programmer heatmap <span>click a cell to edit · click a film for its dossier</span></div>
    <div class="score-table-wrap">
      <table class="score-table ov-heat">
        <thead><tr><th>Film · ranked by consensus INDEX</th>${PROGRAMMERS.map((p,i)=>`<th class="center"><b style="color:${PCOLORS[i]}">${p.short}</b><small>${p.role}</small></th>`).join('')}<th class="center">Consensus</th><th class="center">Spread</th><th class="center">Agreement</th></tr></thead>
        <tbody>${heatRows}</tbody>
      </table>
    </div>
    <div class="ov-legend">
      <span><i style="background:rgba(34,211,166,.5)"></i>78–100 Strong</span>
      <span><i style="background:rgba(76,154,255,.5)"></i>62–77 Solid</span>
      <span><i style="background:rgba(245,165,36,.5)"></i>45–61 Watch</span>
      <span><i style="background:rgba(228,0,43,.5)"></i>0–44 Weak</span>
      <span><i style="background:#2A3341;border:1px dashed #4E5A6B"></i>Not rated</span>
    </div>

    <div class="ov-sec-t">Where they disagree most <span>names the highest and lowest programmer per film</span></div>
    <div class="ov-debate">${debates || '<div class="note n-warn"><span class="i">!</span><span>No film has all four ratings yet.</span></div>'}</div>

    <div class="ov-sec-t">Dimension bias by programmer <span>mean slider value across their rated films</span></div>
    <div class="score-table-wrap">
      <table class="score-table ov-dim">
        <thead><tr><th>Weighted dimension</th>${PROGRAMMERS.map((p,i)=>`<th class="center"><b style="color:${PCOLORS[i]}">${p.short}</b><small>${p.role}</small></th>`).join('')}</tr></thead>
        <tbody>${dimRows}</tbody>
      </table>
    </div>
    <p class="score-help">The INDEX is the weighted mean of the five dimensions (Story 22%, Cast 20%, Marketing heat 22%, Market fit 20%, Franchise 16%). A programmer's consensus contribution is their own INDEX — the film average is the mean of all ${PROGRAMMERS.length}. Agreement: Strong ≤ 8 points spread, Mixed ≤ 20, Split &gt; 20, Pending when someone has not rated.</p>
  </div>`;
}

function scoreBoard(board){
  if(state.scoreView === 'matrix')   return scoreMatrix(board);
  if(state.scoreView === 'overview') return scoreOverview(board);
  return scoreDossier(board);
}

function managerScoresInspector(board){
  const approval = currentApproval();
  const coverage = ratingsCoverage();
  const submitted = coverage.submitted;
  const totalRatings = coverage.total;
  const slateAvg = FILMS.reduce((a,f)=>a + filmAverage(f.id), 0) / FILMS.length;
  const ranked = FILMS.map(f => ({ f, avg:filmAverage(f.id), spread:filmSpread(f.id) }));
  const top = ranked.slice().sort((a,b)=>b.avg-a.avg)[0];
  const split = ranked.slice().sort((a,b)=>b.spread-a.spread)[0];
  const f = FILMS.find(x=>x.id===state.ratingDraft.filmId) || FILMS[0];

  const programmerRows = PROGRAMMERS.map(p => {
    const xs = FILMS.map(fm => cellIndex(ratingCell(fm.id,p.id))).filter(v => v !== null);
    const avg = xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : 0;
    return `<div class="mgr-filmrow">
      <span><i class="mgr-swatch" style="background:#4C9AFF"></i>${p.short} · ${p.role}</span>
      <span class="num">${avg.toFixed(1)} INDEX · ${xs.length} films</span>
    </div>`;
  }).join('');
  const filmRows = PROGRAMMERS.map(p => {
    const ix = cellIndex(ratingCell(f.id,p.id));
    return `<div class="mgr-filmrow">
      <span><i class="mgr-swatch" style="background:${FILM_COLORS[f.id]}"></i>${p.short}</span>
      <span class="num">${ix===null?'—':Math.round(ix)+' / 100'}</span>
    </div>`;
  }).join('');

  const approvalNote = approval
    ? `Approved by ${approval.byName} on ${formatWhen(approval.at)}. Session dragging is locked; a score, location, week, or layout change returns the schedule to draft.`
    : (coverage.complete
      ? 'Ratings are complete. Review the schedule, then approve to lock the current score snapshot and layout.'
      : `Film rating comes first: ${submitted}/${totalRatings} attributed INDEX ratings are present. Approval stays locked until every programmer scores every film.`);
  const approvalState = approval ? 'Locked' : (coverage.complete ? 'Ready' : 'Rating first');
  const secondAct = approval ? 'reopen-approval' : (coverage.complete ? 'open-approval' : 'ratings-incomplete');
  const secondLabel = approval ? 'Reopen' : (coverage.complete ? 'Approve schedule' : 'Complete ratings first');
  const secondDisabled = !approval && !coverage.complete ? ' disabled' : '';

  return `<aside class="inspector">
    <div class="ins-hd">
      <div class="t">Consensus & approval</div>
      <div class="v">${PROGRAMMERS.length} programmers · 0–100 INDEX</div>
    </div>

    <div class="hero">
      <div class="k">Slate consensus INDEX</div>
      <div class="big num">${slateAvg.toFixed(1)}<em>/ 100</em></div>
      <div class="rng">${submitted}/${totalRatings} attributed ratings · ${board.week.label}</div>
      <div class="kpis">
        <div class="kpi"><div class="k">Highest rated</div><div class="v" style="font-size:11.5px">${escapeText(top.f.title.split(':')[0])}<small> · ${top.avg.toFixed(1)}</small></div></div>
        <div class="kpi"><div class="k">Most split</div><div class="v" style="font-size:11.5px">${escapeText(split.f.title.split(':')[0])}<small> · ${split.spread.toFixed(0)}</small></div></div>
        <div class="kpi"><div class="k">Programmers</div><div class="v num">${PROGRAMMERS.length}</div></div>
        <div class="kpi"><div class="k">Approval</div><div class="v" style="font-size:11.5px;color:${approval?'#8FD8C4':'#E8C48A'}">${approval?'Approved':(coverage.complete?'Draft':'Locked')}</div></div>
      </div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Selected film · ${escapeText(f.title.split(':')[0])}</span><span>${filmScores(f.id).length}/${PROGRAMMERS.length}</span></div>
      <div class="formula">${filmRows}
        <div class="eq"><span>→ Consensus INDEX</span><span class="num">${filmScores(f.id).length?filmAverage(f.id).toFixed(1):'—'} / 100</span></div>
      </div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Programmer coverage</span><span>${submitted}/${totalRatings}</span></div>
      <div class="formula">${programmerRows}</div>
      <button class="ov-btn" data-act="scoreview" data-v="overview">Open overall ratings →</button>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>How consensus works</span><span>Mean of 4 INDEX values</span></div>
      <div class="note n-good"><span class="i">✓</span><span>Five weighted dimensions (Story 22%, Cast 20%, Heat 22%, Fit 20%, Franchise 16%) roll up into one INDEX per programmer. Each INDEX keeps its author and timestamp, so disagreement stays visible.</span></div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Schedule approval</span><span>${approvalState}</span></div>
      <div class="note ${approval?'n-good':'n-warn'}"><span class="i">${approval?'✓':'!'}</span><span>${approvalNote}</span></div>
    </div>

    <div class="ins-foot" style="display:flex;gap:8px">
      <button class="ghost" style="flex:1" data-act="managertab" data-v="schedule">Schedule</button>
      <button class="ghost" style="flex:1" data-act="${secondAct}"${secondDisabled}>${secondLabel}</button>
    </div>
  </aside>`;
}

/* ---------------- APPROVAL MODAL ---------------- */
function approvalModalHTML(board){
  if(!state.approvalOpen) return '';
  const totals = boardTotals(board.days, board.cinema);
  const coverage = ratingsCoverage();
  const slateAvg = FILMS.reduce((a,f)=>a + filmAverage(f.id), 0) / FILMS.length;
  const draft = state.approvalDraft;
  const programmerOptions = PROGRAMMERS.map(p =>
    `<option value="${p.id}" ${p.id===draft.approverId?'selected':''}>${p.name} · ${p.role}</option>`).join('');
  return `<div class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="approval-title">
      <div class="modal-hd">
        <h3 id="approval-title">Approve schedule</h3>
        <p>Film rating and schedule review are complete. Confirm this location's week before session editing is locked.</p>
      </div>
      <div class="modal-body">
        <div class="modal-summary">
          <div><span>Location</span><b>${board.cinema.name}</b></div>
          <div><span>Week</span><b>${board.week.label}</b></div>
          <div><span>Sessions</span><b class="num">${totals.shows}</b></div>
          <div><span>Scope</span><b>${board.cinema.halls.length} halls · ${FILMS.length} films</b></div>
          <div><span>Film ratings</span><b class="num">${coverage.submitted}/${coverage.total}</b></div>
          <div><span>Consensus INDEX</span><b class="num">${slateAvg.toFixed(1)} / 100</b></div>
        </div>
        <label><span>Approved by</span><select data-approval-field="approver">${programmerOptions}</select></label>
        <label><span>Approval note (optional)</span><textarea data-approval-field="note" placeholder="e.g. Slate checked against distributor terms">${escapeText(draft.note)}</textarea></label>
        <div class="note n-warn"><span class="i">!</span><span>Approval applies only to this location, week, target occupancy, film-score snapshot, and current dragged layout. Changing any of those returns the schedule to draft.</span></div>
      </div>
      <div class="modal-foot">
        <button class="ghost" data-act="close-approval">Cancel</button>
        <button class="cta" data-act="confirm-approval">Confirm approval</button>
      </div>
    </div>
  </div>`;
}

function canvas(managerBoard){
  let inner;
  if(state.workspace === 'manager') inner = state.managerTab === 'scores' ? scoreBoard(managerBoard) : stepBoard(managerBoard);
  else if(state.step === 1) inner = stepFilm();
  else if(state.step === 2) inner = stepForecast();
  else if(state.step === 3) inner = stepCinema();
  else if(state.step === 4) inner = stepHall();
  else inner = stepBoard();
  return `<section class="canvas">${inner}</section>`;
}

/* ---------------- RENDER: INSPECTOR ---------------- */

  const um = state.mode === 'weekly' ? state.weeklyMult : state.dailyMult[Math.min(state.dayIdx,6)];

  return `<aside class="inspector">
    <div class="ins-hd">
      <div class="t">Forecast inspector</div>
      <div class="v">${fc.film.title} <span class="badge ${fc.film.status==='NEW'?'b-new':fc.film.status==='HOLDOVER'?'b-hold':'b-up'}">${fc.film.status==='NEW'?'New':fc.film.status==='HOLDOVER'?'Hold':'Soon'}</span></div>
    </div>

    <div class="hero">
      <div class="k">Projected admits · week</div>

      <div class="rng">Range <b class="num">${Math.round(fc.days.reduce((s,d)=>s+d.low,0)).toLocaleString()} – ${Math.round(fc.days.reduce((s,d)=>s+d.high,0)).toLocaleString()}</b> · ${fc.week.label}</div>

        <div class="kpi"><div class="k">Revenue</div><div class="v num" style="font-size:12.5px">${money(fc.total.revenue)}</div></div>

    <div class="ins-sec">

        <div><span>Day factor · ${day.dow}</span><span class="num">× ${day.factor.toFixed(2)}</span></div>
        <div><span>Run decay · week ${Math.max(0,fc.wi)+1}</span><span class="num">× ${fc.decay.toFixed(2)}</span></div>
        <div><span>Site factor · ${fc.cinema.name.replace('TGV ','')}</span><span class="num">× ${fc.cinema.factor.toFixed(2)}</span></div>

    </div>

    <div class="ins-foot">
      <button class="ghost" data-act="reset">Reset overrides to baseline</button>

/* Site-wide inspector: all movies and every hall from the selected location. */
function managerInspector(board){
  const stats = managerFilmStats(board);
  const { cinema, week, days } = board;
  const totals = boardTotals(days, cinema);
  const bd = stats.dayData;
  const di = Math.min(state.dayIdx, 6);
  const dayDate = week.days[di];

  const weekFilms = new Set(), dayFilms = new Set(bd.shows.map(s => s.filmId));
  days.forEach(d => d.shows.forEach(s => weekFilms.add(s.filmId)));
  const hallsUsed = new Set(bd.shows.map(s => s.hallId));

  const hallBars = cinema.halls.map(h=>{
    const ss = bd.shows.filter(s => s.hallId === h.id);
    const seats = ss.reduce((a,s)=>a+s.cap,0);
    const admits = ss.reduce((a,s)=>a+(s.admits||0),0);
    const occ = seats ? admits/seats : 0;
    return `<div class="ubar">
      <div class="ubar-top"><span>${h.name} · ${h.cap} seats</span><b class="num">${ss.length}× · ${Math.round(occ*100)}%</b></div>
      <div class="fbar"><i style="width:${Math.min(100,occ*100)}%"></i></div>
    </div>`;
  }).join('');

  const filmRows = FILMS.map(f=>`<div class="mgr-filmrow">
    <span><i class="mgr-swatch" style="background:${FILM_COLORS[f.id]}"></i>${f.title.split(':')[0]}</span>
    <span class="num">avg ${filmAverage(f.id).toFixed(1)} · ${stats.day[f.id]||0} today · ${stats.week[f.id]||0} wk</span>
  </div>`).join('');

  const approval = currentApproval();
  const coverage = ratingsCoverage();
  const ratingNote = approval
    ? ''
    : (coverage.complete
      ? `Ratings complete (${coverage.submitted}/${coverage.total}). `
      : `Ratings incomplete (${coverage.submitted}/${coverage.total}); approval locked. `);
  const editNote = approval
    ? `Approved by ${approval.byName} on ${formatWhen(approval.at)}. Session dragging is locked; choose Reopen to edit, or change a score / location / week / layout to return to draft.`
    : `${ratingNote}${state.boardView === 'day'
      ? 'Drag any colored session left/right to change its time, or up/down to reassign it to another hall. The purple outline marks the target hall.'
      : 'Switch to Day view to drag sessions. Week view still shows every movie across every hall for all seven days.'}`;

  return `<aside class="inspector">
    <div class="ins-hd">
      <div class="t">Location overview</div>
      <div class="v">${cinema.name}</div>
    </div>

    <div class="hero">
      <div class="k">Projected admits · whole week</div>
      <div class="big num">${Math.round(totals.admits).toLocaleString()}<em>admits</em></div>
      <div class="rng">${weekFilms.size} programmed movies · ${cinema.halls.length} halls · ${week.label}</div>
      <div class="kpis">
        <div class="kpi"><div class="k">Week sessions</div><div class="v num">${totals.shows}</div></div>
        <div class="kpi"><div class="k">Today</div><div class="v num">${bd.shows.length}<small> shows</small></div></div>
        <div class="kpi"><div class="k">Movies today</div><div class="v num">${dayFilms.size}<small> / ${FILMS.length}</small></div></div>
        <div class="kpi"><div class="k">Halls used</div><div class="v num">${hallsUsed.size}<small> / ${cinema.halls.length}</small></div></div>
      </div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Location</span><span>All halls shown</span></div>
      <div class="formula">
        <div><span>City</span><span>${cinema.city}</span></div>
        <div><span>Halls shown</span><span class="num">${cinema.halls.length} / ${cinema.halls.length}</span></div>
        <div><span>ATP</span><span class="num">RM ${cinema.atp.toFixed(2)}</span></div>
        <div><span>Site factor</span><span class="num">×${cinema.factor.toFixed(2)}</span></div>
        <div><span>Target occupancy</span><span class="num">${Math.round(state.targetOcc*100)}%</span></div>
        <div class="eq"><span>Selected day</span><span>${dayDate.dow} ${dayDate.date.getDate()} ${MONTHS[dayDate.date.getMonth()]}</span></div>
      </div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Hall utilisation · selected day</span><span>${cinema.halls.length} halls</span></div>
      <div class="mgr-halls">${hallBars}</div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Movie mix · all titles</span><span>${FILMS.length}</span></div>
      <div class="formula">${filmRows}</div>
    </div>

    <div class="ins-sec">
      <div class="sh"><span>Editing</span><span>${approval ? 'Approved' : (state.boardView === 'day' ? 'Day view' : 'Week view')}</span></div>
      <div class="note ${approval?'n-good':'n-info'}"><span class="i">${approval?'✓':'↔'}</span><span class="mgr-editnote">${editNote}</span></div>
    </div>

    <div class="ins-foot" style="display:flex;gap:8px">
      <button class="ghost" style="flex:1" data-act="reset">Reset dragged sessions</button>
      <button class="ghost" style="flex:1" data-act="managertab" data-v="scores">Film rating</button>
    </div>
  </aside>`;
}

/* ---------------- MAIN RENDER ---------------- */
/* Manual drags belong to ONE generated plan. If any plan-affecting input changes
   (cinema / week / film / demand sliders / hall selection), drop the overrides so
   a stale drag can't re-attach itself to a different session. */
function planSig(){
  return [state.cinemaId, state.weekId, state.filmId, state.weeklyMult,
          state.dailyMult.join(','), state.targetOcc,
          getHalls().join(',')].join('|');   // getHalls() normalizes lazy init
}
function render(){
  const sig = planSig();
  if(window._planSig && window._planSig !== sig) state.overrides = {};
  window._planSig = sig;
  // A schedule approval is valid only for the exact plan it signed. Any change
  // to location, week, target occupancy, or manual layout returns it to draft.
  if(state.approval && !currentApproval()) state.approval = null;
  const manager = state.workspace === 'manager';
  const board = manager ? buildWeekBoard(state.cinemaId, state.weekId) : null;
  const inspectorHTML = manager
    ? (state.managerTab === 'scores' ? managerScoresInspector(board) : managerInspector(board))
    : inspector();
  const modalHTML = manager ? approvalModalHTML(board) : '';
  const railHTML = manager
    ? (state.managerTab === 'scores' ? ratingRail(board) : managerRail(board))
    : rail();
  document.getElementById('app').innerHTML =
    (manager ? managerTopbar(board) : topbar()) +
    `<div class="workspace">${railHTML}${canvas(board)}${inspectorHTML}</div>` +
    modalHTML;
  document.body.classList.toggle('schedule-locked', manager && isApproved());
  if(state._focus){
    const el = document.querySelector(`[data-slider="${state._focus}"]`) ||
               document.querySelector(`[data-daily="${state._focus}"]`);
    if(el){ el.focus(); }
    state._focus = null;
  }
  if(state._scoreFocus){
    const el = document.querySelector('[data-rating-dim="story"]');
    if(el){ el.focus(); }
    state._scoreFocus = false;
  }
}

/* ---------------- EVENTS ---------------- */
document.getElementById('app').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  if(act === 'workspace'){
    state.workspace = v;
    state.approvalOpen = false;
    if(v === 'manager'){ state.managerTab = 'scores'; state.boardView = 'day'; state.step = 5; }
    else { state.step = 1; }
  }
  else if(act === 'managertab'){
    state.managerTab = v === 'scores' ? 'scores' : 'schedule';
    state.approvalOpen = false;
  }
  else if(act === 'scoreview'){
    state.scoreView = v === 'matrix' ? 'matrix' : (v === 'overview' ? 'overview' : 'dossier');
  }
  else if(act === 'ratefilm'){
    const film = FILMS.find(f => f.id === v);
    if(film){
      state.ratingDraft = draftFor(film.id, state.ratingDraft.programmerId);
      state.scoreView = 'dossier';
      toast(`Rating ${film.title.split(':')[0]} — set five dimensions, then save the INDEX`);
    }
  }
  else if(act === 'edit-rating'){
    const film = FILMS.find(f => f.id === el.dataset.film);
    const programmer = PROGRAMMERS.find(p => p.id === el.dataset.programmer);
    if(film && programmer){
      state.ratingDraft = draftFor(film.id, programmer.id);
      state.scoreView = 'dossier';
      state._scoreFocus = true;
      toast(`${programmer.short} · ${film.title.split(':')[0]} loaded into the sliders`);
    }
  }
  else if(act === 'save-rating'){
    const d = state.ratingDraft;
    const film = FILMS.find(f => f.id === d.filmId);
    const programmer = PROGRAMMERS.find(p => p.id === d.programmerId);
    const dims = validDims(d.dims);
    if(film && programmer && dims){
      state.ratings[film.id] = state.ratings[film.id] || {};
      state.ratings[film.id][programmer.id] = { dims:{...dims}, by:programmer.id, at:ratingStamp() };
      saveRatings();
      const complete = ratingsComplete();
      toast(`${programmer.short} rated ${film.title.split(':')[0]} INDEX ${Math.round(indexOfDims(dims))} · ${complete ? 'all ratings complete, approval unlocked' : 'consensus updated'}`);
    }
  }
  else if(act === 'preset-dims'){
    const f = FILMS.find(x => x.id === state.ratingDraft.filmId) || FILMS[0];
    const anchor = clampIndex(compAnchor(f));
    DIMS.forEach((d,k)=>{ state.ratingDraft.dims[d.k] = clampIndex(anchor + (k-2)*2); });
    toast(`Sliders set from comparable titles (${anchor} anchor) — save to attribute them`);
  }
  else if(act === 'reset-dims'){
    state.ratingDraft = draftFor(state.ratingDraft.filmId, state.ratingDraft.programmerId);
    toast('Sliders restored to the last saved INDEX');
  }
  else if(act === 'clear-this-rating'){
    const d = state.ratingDraft;
    state.ratings[d.filmId] = state.ratings[d.filmId] || {};
    state.ratings[d.filmId][d.programmerId] = { score:RATING_EMPTY, dims:null, by:d.programmerId, at:'not rated' };
    state.approval = null;
    saveRatings();
    toast('This programmer INDEX was cleared — approval returns to draft');
  }
  else if(act === 'reset-ratings'){
    state.ratings = seedRatings();
    state.ratingDraft = draftFor(FILMS[0].id, PROGRAMMERS[0].id);
    state.managerTab = 'scores';   // keep whichever Step 1 view the reviewer is on
    saveRatings();
    toast('Sample INDEX ratings restored — ratings are complete again');
  }
  else if(act === 'clear-ratings'){
    state.ratings = clearRatings();
    state.ratingDraft = draftFor(FILMS[0].id, PROGRAMMERS[0].id);
    state.approval = null;
    state.approvalOpen = false;
    state.managerTab = 'scores';   // keep whichever Step 1 view the reviewer is on
    saveRatings();
    toast('All programmer INDEX ratings cleared — complete ratings to unlock approval');
  }
  else if(act === 'ratings-incomplete'){
    const c = ratingsCoverage();
    state.managerTab = 'scores';
    state.approvalOpen = false;
    toast(`Film rating comes first — ${c.submitted}/${c.total} attributed ratings complete`);
  }
  else if(act === 'open-approval'){
    if(!ratingsComplete()){
      const c = ratingsCoverage();
      state.workspace = 'manager';
      state.managerTab = 'scores';
      state.approvalOpen = false;
      toast(`Film rating comes first — ${c.submitted}/${c.total} attributed ratings complete`);
    } else {
      state.workspace = 'manager';
      state.approvalOpen = true;
      state.approvalDraft.note = '';
    }
  }
  else if(act === 'close-approval'){
    state.approvalOpen = false;
    state.approvalDraft.note = '';
  }
  else if(act === 'confirm-approval'){
    if(!ratingsComplete()){
      const c = ratingsCoverage();
      state.approvalOpen = false;
      state.managerTab = 'scores';
      toast(`Film rating comes first — ${c.submitted}/${c.total} attributed ratings complete`);
    } else {
      const programmer = PROGRAMMERS.find(p => p.id === state.approvalDraft.approverId) || PROGRAMMERS[0];
      const b = buildWeekBoard(state.cinemaId, state.weekId);
      const totals = boardTotals(b.days, b.cinema);
      state.approval = {
        status: 'approved',
        by: programmer.id,
        byName: programmer.name,
        at: new Date().toISOString(),
        note: state.approvalDraft.note || '',
        sig: approvalSig(),
        summary: {
          cinema: b.cinema.name,
          week: b.week.label,
          shows: totals.shows,
          halls: b.cinema.halls.length,
          films: FILMS.length
        }
      };
      state.approvalOpen = false;
      state.approvalDraft.note = '';
      toast(`Schedule approved by ${programmer.name} — session dragging is locked`);
    }
  }
  else if(act === 'reopen-approval'){
    state.approval = null;
    state.approvalOpen = false;
    toast('Schedule reopened — session editing is unlocked');
  }
  else if(act === 'location'){
    if(state.cinemaId !== v){
      state.cinemaId = v; state.dayIdx = 0; state.boardView = 'day'; state.overrides = {};
    }
  }
  else if(act === 'step'){ state.step = Number(v); }
  else if(act === 'film'){ state.filmId = v; state.step = Math.max(state.step, 2); state.dayIdx = 0; }
  else if(act === 'week'){ state.weekId = v; }
  else if(act === 'day'){ state.dayIdx = Math.max(0, Math.min(6, Number(v))); }
  else if(act === 'bview'){ state.boardView = v; }
  else if(act === 'daymove'){
    const next = state.dayIdx + Number(v);
    state.dayIdx = Math.max(0, Math.min(6, next));
  }
  else if(act === 'cinema'){ state.cinemaId = v; state.step = Math.max(state.step, 4); state.dayIdx = 0; }
  else if(act === 'cell'){
    state.filmId = el.dataset.film;
    state.cinemaId = el.dataset.cinema;
    state.dayIdx = 0;
  }
  else if(act === 'mode'){ state.mode = v; }
  else if(act === 'hall'){
    const cur = getHalls().slice();
    const i = cur.indexOf(v);
    if(i >= 0){ if(cur.length > 1) cur.splice(i,1); }
    else cur.push(v);
    setHalls(state.cinemaId, cur);
  }
  else if(act === 'generate'){ state.workspace = 'manager'; state.managerTab = 'scores'; state.step = 5; state.boardView = 'day'; }
  else if(act === 'boardcell'){
    const hallId = el.dataset.hall, dayIdx = Number(el.dataset.day);
    state.dayIdx = Math.max(0, Math.min(6, dayIdx));
    if(state.workspace === 'manager'){
      state.boardView = 'day';
    } else {
      const bd = buildWeekBoard(state.cinemaId, state.weekId).days[state.dayIdx];
      const ss = bd.sessions.filter(s => s.hallId === hallId);
      if(ss.length){
        const counts = {};
        ss.forEach(s => counts[s.filmId] = (counts[s.filmId]||0) + 1);
        state.filmId = Object.keys(counts).sort((a,b)=> counts[b]-counts[a])[0];
        if(!getHalls().includes(hallId)) setHalls(state.cinemaId, [hallId]);
      }
      state.step = 4;
    }
  }
  else if(act === 'publish'){
    if(state.workspace === 'manager'){
      const b = buildWeekBoard(state.cinemaId, state.weekId);
      const t = boardTotals(b.days, b.cinema);
      toast(`Week published — ${t.shows} sessions across ${b.cinema.halls.length} halls · ${b.cinema.name}`);
    } else {
      const fc = forecast();
      toast(`Plan published — ${fc.total.shows} sessions for ${fc.week.label} sent to POS · ${fc.cinema.name}`);
    }
    return;
  }
  else if(act === 'reset'){
    state.overrides = {};
    if(state.workspace !== 'manager'){
      state.weeklyMult = 1.0; state.dailyMult = [1,1,1,1,1,1,1]; state.targetOcc = 0.30;
    }
  }
  render();
});

function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  document.body.appendChild(d);
  requestAnimationFrame(()=> d.classList.add('in'));
  setTimeout(()=>{ d.classList.remove('in'); setTimeout(()=>d.remove(), 260); }, 2400);
}

/* Approval form fields update state without re-rendering, so the textarea keeps
   its caret and the modal stays open. Dimension sliders are handled live below. */
function formFieldInput(t){
  const af = t.dataset.approvalField;
  if(af){
    if(af === 'approver') state.approvalDraft.approverId = t.value;
    else if(af === 'note') state.approvalDraft.note = t.value;
    return true;
  }
  return false;
}

document.getElementById('app').addEventListener('input', (e)=>{
  const t = e.target;
  if(formFieldInput(t)) return;
  if(t.dataset.ratingDim){
    state.ratingDraft.dims[t.dataset.ratingDim] = Number(t.value);
    t.style.setProperty('--pct', t.value + '%');
    updateScorecardLive();
    return;
  }
  if(t.dataset.slider === 'weekly'){
    state.weeklyMult = Number(t.value)/100;
    state._focus = 'weekly';
    render();
  } else if(t.dataset.slider === 'occ'){
    state.targetOcc = Number(t.value)/100;
    state._focus = 'occ';
    render();
  } else if(t.dataset.daily !== undefined){
    const i = Number(t.dataset.daily);
    const val = Math.max(30, Math.min(200, Number(t.value) || 100));
    state.dailyMult[i] = val/100;
    state._focus = String(i);
    render();
  }
});

document.getElementById('app').addEventListener('change', (e)=>{
  const t = e.target;
  if(t.dataset.ratingField === 'programmerId'){
    state.ratingDraft = draftFor(state.ratingDraft.filmId, t.value);
    render();
    return;
  }
  formFieldInput(t);
});

/* ============================================================
   DRAG A SESSION BLOCK — 2D: left/right = move in time, up/down = reassign hall.
   The drop is stored as a persistent override keyed by the block's stable uid;
   render() re-applies it (settleSessions) and resolves any hall overlap.
   ============================================================ */
let _drag = null, _pend = null;

function dragLanes(){
  return [...document.querySelectorAll('.tl-track, .dtrack')].map(t=>{
    const lane = t.closest('.tl-row, .drow');
    return { hallId: lane && lane.dataset.hall, track:t, lane, span:Number(t.dataset.span) };
  }).filter(l => l.hallId);
}
function laneAt(lanes, y){
  for(const l of lanes){
    const r = l.track.getBoundingClientRect();     // fresh each move -> survives scrolling
    if(y >= r.top - 10 && y <= r.bottom + 10) return l;
  }
  return null;
}
/* Mirror settleSessions' per-hall reflow for ONE candidate placement, so the
   tooltip shows the time the session will REALLY land at (no surprises on drop),
   and the persisted override is already collision-free / idempotent. */
function landingStart(d, targetHall, proposed){
  const items = Object.values(window._SCHED || {})
    .filter(s => s.hallId === targetHall && s.uid !== d.uid)
    .map(s => ({ start:s.start, end:s.end, dur:s.dur || (s.end - s.start), type:!!s.type, drag:false }));
  items.push({ start:proposed, end:proposed + d.dur, dur:d.dur, type:false, drag:true });
  const fixed = items.filter(x => x.type).sort((a,b)=> a.start - b.start);
  const mov   = items.filter(x => !x.type).sort((a,b)=> a.start - b.start);
  let cursor = OPEN_MIN, fi = 0, result = proposed;
  mov.forEach(s=>{
    let st = Math.max(s.start, cursor);
    while(fi < fixed.length && fixed[fi].end + TURNOVER <= st) fi++;
    while(fi < fixed.length && st < fixed[fi].end + TURNOVER){ st = fixed[fi].end + TURNOVER; fi++; }
    if(st < cursor) st = cursor;
    if(st + s.dur > PLACE_CLOSE) st = Math.max(OPEN_MIN, PLACE_CLOSE - s.dur);
    if(s.drag) result = st;
    cursor = st + s.dur + TURNOVER;
  });
  return result;
}
function dragTip(){
  let t = document.getElementById('dragtip');
  if(!t){ t = document.createElement('div'); t.id = 'dragtip'; document.body.appendChild(t); }
  return t;
}
function showDragTip(d, proposed, targetHall){
  const t = dragTip();
  const dir = proposed === d.start ? 'same time'
            : (proposed < d.start ? `▲ ${d.start - proposed} min earlier` : `▼ ${proposed - d.start} min later`);
  t.innerHTML =
    `<div class="dt-t">${hhmm(proposed)} – ${hhmm(proposed + d.dur)}</div>`+
    `<div class="dt-h">${targetHall !== d.hallId ? '→ ' + hallNameById(targetHall) : hallNameById(d.hallId)}</div>`+
    `<div class="dt-s">${dir} · release to apply</div>`;
  t.style.display = 'block';
  t.style.left = d._cx + 'px';
  t.style.top  = d._cy + 'px';
}
function hideDragTip(){ const t = document.getElementById('dragtip'); if(t) t.style.display = 'none'; }

document.addEventListener('pointerdown', e=>{
  const block = e.target.closest('.sess, .dsess');
  if(!block || !block.dataset.uid) return;            // rental / closed blocks are not draggable
  if(e.target.closest('[data-act]')) return;
  if(state.workspace === 'manager' && isApproved()){
    e.preventDefault();
    toast('Schedule approved — choose Reopen before dragging sessions');
    return;
  }
  e.preventDefault();                                 // no native text-select / DnD hijack
  const track = block.parentElement;
  const r = track.getBoundingClientRect();
  _pend = {
    block, uid:block.dataset.uid,
    start:Number(block.dataset.start), dur:Number(block.dataset.dur),
    hallId:block.dataset.hall,
    x:e.clientX, y:e.clientY, startY:e.clientY,
    rect:r, pxPerMin: r.width / Number(track.dataset.span),
    lanes: dragLanes()
  };
}, {passive:false});

document.addEventListener('pointermove', e=>{
  if(_drag){ e.preventDefault(); stepDrag(e); return; }
  if(_pend && Math.hypot(e.clientX - _pend.x, e.clientY - _pend.y) >= 4){
    _drag = _pend; _pend = null;
    _drag.block.classList.add('drag-on');
    document.body.classList.add('dragging');
    try { _drag.block.setPointerCapture(_drag.block._pid = e.pointerId); } catch(_){}
  }
});

function stepDrag(e){
  const d = _drag;
  d._cx = e.clientX; d._cy = e.clientY;
  const dx = e.clientX - d.x;
  const deltaMin = Math.round((dx / d.pxPerMin) / 5) * 5;         // snap to 5 min
  let proposed = Math.max(OPEN_MIN, Math.min(PLACE_CLOSE - d.dur, d.start + deltaMin));
  // which hall row is the cursor over?
  const lane = laneAt(d.lanes, e.clientY);
  const targetHall = lane ? lane.hallId : d.hallId;
  // show + store the time it will ACTUALLY land at after overlap reflow
  const landing = landingStart(d, targetHall, proposed);
  d._proposed = landing; d._targetHall = targetHall;
  d.block.style.transform = `translate(${dx}px, ${e.clientY - d.startY}px)`;  // whole block follows cursor
  document.querySelectorAll('.drop-hall').forEach(n => n.classList.remove('drop-hall'));
  if(lane && targetHall !== d.hallId) lane.lane.classList.add('drop-hall');
  showDragTip(d, landing, targetHall);
}

function finishDrag(){
  if(!_drag) return;
  const d = _drag; _drag = null;
  document.body.classList.remove('dragging');
  d.block.classList.remove('drag-on');
  d.block.style.transform = '';
  document.querySelectorAll('.drop-hall').forEach(n => n.classList.remove('drop-hall'));
  hideDragTip();
  const targetHall = d._targetHall || d.hallId;
  const proposed = d._proposed != null ? d._proposed : d.start;
  state.overrides[d.uid] = { start:proposed, hallId:targetHall };
  state.approval = null;                               // a manual layout edit always returns to draft
  render();                                            // re-apply override + reflow + repaint
  toast(`Moved · ${hallNameById(targetHall)} · ${hhmm(proposed)}`);
}
document.addEventListener('pointerup', finishDrag);
document.addEventListener('pointercancel', finishDrag);

render();
</script>
