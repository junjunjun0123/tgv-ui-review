function rowHTML(s){
  const f = s.film;
  const pre = s.screenRef.prefix;
  const card = priceCard(state.cinema, s.screenRef);
  const sel = state.edit && state.edit.id === s.id;
  const cls = [s.mine?'mine':'', sel?'sel':''].filter(Boolean).join(' ');
  const kb = s.mine ? 'plan' : (s.status==='Open'?'open':s.status==='Closed'?'grey':'dark');
  const occCls = s.occ >= .55 ? 'occ-hi' : s.occ >= .25 ? 'occ-md' : 'occ-lo';
  const showGrip = state.groupBy === 'screen';
  const grip = showGrip ? `<span class="grip" data-act="drag" data-id="${s.id}" title="Drag up / down to change the show time"><svg width="9" height="14" viewBox="0 0 9 14"><circle cx="2" cy="2" r="1.4"/><circle cx="6.5" cy="2" r="1.4"/><circle cx="2" cy="7" r="1.4"/><circle cx="6.5" cy="7" r="1.4"/><circle cx="2" cy="12" r="1.4"/><circle cx="6.5" cy="12" r="1.4"/></svg></span>` : '';
  const step = `<span class="stepbtns">
      <button data-act="stepup" data-id="${s.id}" title="Move earlier — click or hold to keep moving up">▲</button>
      <button data-act="stepdown" data-id="${s.id}" title="Move later — click or hold to keep moving down">▼</button>
    </span>`;
  return `<tr class="${cls}" data-id="${s.id}" ${s.mine?`data-act="editsess" title="Click to adjust the time"`:''}>
    <td class="scr">${grip}${esc(s.screen)}</td>
    <td>${pre}${esc(f.title)}</td>
    <td class="tm">${s.mine?`<b>${hhmm(s.start)}</b>`:hhmm(s.start)}${step}</td>
    <td>${hhmm(s.end)}</td>
    <td><span class="kb ${kb}">${s.status}</span></td>
    <td><span class="ch"><span class="fil">▣</span> P, K, W, M</span></td>
    <td><span class="kb open">Manual</span> <span class="kb open">Allowed</span></td>
    <td>${esc(card)}</td>
    <td class="info"><span class="ib">i</span></td>
    <td class="n">${s.sold}</td>
    <td class="n">${s.locked}</td>
    <td class="n">${s.avail}</td>
    <td class="n">${s.cap}</td>
    <td class="occ ${occCls}">${(s.occ*100).toFixed(2)}%</td>
  </tr>`;
}

function priceCard(cinemaName, screen){
  const code = getCinema(cinemaName).code;
  switch(screen.type){
    case 'IMAX':    return 'MVC IMAX2D RM35 (NEW)';
    case 'Beanie':  return `[ ${code} ] BEANIE RM55`;
    case 'Indulge': return '[1U,SWV,PBJ,KLCC,SW,ALM,SWS] Indulge';
    case 'BEREX':   return '[KLCC,PBJ,SW] Indulge Coway Berex 130';
    case 'Junior':  return `[ ${code} ] EB RM17 (Deluxe)`;
    default:        return `[ ${code} ] MVC SB RM25`;
  }
}

function groupRows(rows, by){
  const key = s => by === 'film' ? s.film.title : s.screen;
  const map = new Map();
  rows.forEach(s=>{
    const k = key(s);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(s);
  });
  return [...map.entries()].map(([k, v])=>{
    v.sort((a,b)=> a.start-b.start);
    return { key:k, rows:v };
  });
}

function stageSchedule(){
  if(!state.plan) return '<div class="hd"><h1>No plan yet</h1></div>';
  const { fc, cinema, days } = state.plan;
  const day = days[state.dayIdx];
  const by = state.groupBy;

  const allowed = rows => rows.filter(s=>{
    const k = s.status === 'Open' ? 'O' : s.status === 'Planned' ? 'P' : s.status === 'Closed' ? 'C' : 'I';
    return state.statuses[k] !== false;
  });

  const groups = groupRows(allowed(day.rows), by);
  const total = groups.reduce((a,g)=>{
    g.rows.forEach(s=>{ a.sold+=s.sold; a.locked+=s.locked; a.avail+=s.avail; a.cap+=s.cap; });
    return a;
  }, {sold:0,locked:0,avail:0,cap:0});

  let body = '';
  groups.forEach(g=>{
    g.rows.forEach(s=>{ body += rowHTML(s); });
    const st = g.rows.reduce((a,s)=>({sold:a.sold+s.sold,locked:a.locked+s.locked,avail:a.avail+s.avail,cap:a.cap+s.cap}),{sold:0,locked:0,avail:0,cap:0});
    body += `<tr class="subrow">
      <td class="lbl" colspan="8">${by==='film' ? esc(g.key)+' — Sub Total' : 'Sub Total'}</td>
      <td class="cnt">${g.rows.length} session(s)</td>
      <td class="n">${st.sold}</td><td class="n">${st.locked}</td>
      <td class="n">${st.avail}</td><td class="n">${st.cap}</td>
      <td class="n">${st.cap?((st.sold/st.cap)*100).toFixed(2):'0.00'}%</td>
    </tr>`;
  });

  body += `<tr class="grand">
    <td class="lbl" colspan="9">Grand Total</td>
    <td class="n">${total.sold}</td><td class="n">${total.locked}</td>
    <td class="n">${total.avail}</td><td class="n">${total.cap}</td>
    <td class="n">${total.cap?((total.sold/total.cap)*100).toFixed(2):'0.00'}%</td>
  </tr>`;

  const weekStrip = state.plan.days.map((d,i)=>`
    <button class="wkd ${i===state.dayIdx?'on':''}" data-act="day" data-v="${i}">
      <div class="dw">${d.dow}</div>
      <div class="dd">${d.date.getDate()}</div>
      <div class="ad">${Math.round(d.admits).toLocaleString()}</div>
    </button>`).join('');

  const cineOpts = CINEMA_NAMES.map(n=>`<option ${n===state.cinema?'selected':''}>${n}</option>`).join('');

  const statusDefs = [['O','Open'],['C','Closed'],['P','Planned'],['I','Inactive'],['M','Imported'],['U','Unavailable']];

  const mineCount = day.rows.filter(s=>s.mine).length;
  const daySold = day.rows.reduce((a,s)=>a+s.sold,0);
  const dayCap  = day.rows.reduce((a,s)=>a+s.cap,0);

  return `
  <div class="hd" style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <div>
      <div class="kick">Screen schedule</div>
      <h1>${esc(cinema.name)} — ${day.date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}, ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][day.date.getDay()===0?6:day.date.getDay()-1]}</h1>
      <p>${mineCount} planned session${mineCount===1?'':'s'} for ${esc(fc.film.title)} inserted into the live grid. ${day.rows.length} sessions on ${cinema.screens.length} screens · ${daySold.toLocaleString()} / ${dayCap.toLocaleString()} seats · ${((daySold/dayCap)*100).toFixed(1)}% occupancy.</p>
      <p style="margin-top:6px;font-size:11px;color:var(--red-dk);font-weight:550"><b>Every</b> session can move — including live <b>Open</b> ones. Grab any row and drag it up/down (a card + purple drop zone show where it lands), or use its <b>▲ / ▼</b> buttons (click = 15 min, hold to keep moving). Moving a session later pushes the ones below it.</p>
    </div>
    <div style="display:flex;gap:7px">
      ${WEEKS.map(w=>`<button class="chip ${w.id===state.weekId?'on':''}" data-act="week" data-v="${w.id}">${w.label}</button>`).join('')}
    </div>
  </div>

  <div class="ss-shell">
    <div class="ss-top">
      <div class="ss-f">
        <label>Show Date</label>
        <div class="ss-date">
          <button class="ss-btn" data-act="daymove" data-v="-1">‹</button>
          <input value="${fmtDate(day.date)}" readonly/>
          <button class="ss-btn" data-act="daymove" data-v="1">›</button>
          <button class="ss-btn" data-act="daymove" data-v="0" title="First day">▣</button>
        </div>
      </div>
      <div class="ss-f">
        <label>Cinema <span style="color:#B00020">*</span></label>
        <select id="cinSel">${cineOpts}</select>
      </div>
      <div class="ss-f">
        <label>Session Status</label>
        <div class="ss-status">
          ${statusDefs.map(([k,l])=>`<label><input type="checkbox" data-status="${k}" ${state.statuses[k]!==false?'checked':''}/>${l}</label>`).join('')}
        </div>
      </div>
      <div class="ss-f">
        <label>Grouping</label>
        <div class="ss-grp">
          <label><input type="radio" name="grp" value="screen" ${by==='screen'?'checked':''}/>By screen</label>
          <label><input type="radio" name="grp" value="film" ${by==='film'?'checked':''}/>By film</label>
        </div>
      </div>
      <div class="ss-acts">
        <button class="ss-push" data-act="push">▣ Push to Screen Schedule</button>
        <button class="ss-go" data-act="search">⌕ Search</button>
      </div>
    </div>

    <div class="wkstrip">${weekStrip}</div>

    <div class="ss-scroll">
      <table class="ss">
        <thead>
          <tr>
            <th>Screen</th><th>Film</th><th>Showing</th><th>Finishing</th><th>Status</th>
            <th>Sales<br>Channels</th><th>Seat Allocation /<br>Complimentary?</th><th>Price Card</th><th>Info</th>
            <th class="n nw">Sold</th><th class="n nw">Locked</th><th class="n nw">Avail</th>
            <th class="n nw">Capacity</th><th class="n nw">Occ %</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>

    <div class="ss-foot">
      <div class="lgd">
        <span><span class="sw" style="background:#E6F7F7"></span>Existing session</span>
        <span><span class="sw" style="background:#FFF1F2;border-color:#F0C6CB"></span>Planned for ${esc(fc.film.title)}</span>
        <span><span class="kb open" style="font-size:9px">Open</span> live</span>
        <span><span class="kb plan" style="font-size:9px">Planned</span> not yet committed</span>
      </div>
      <div>Screen Schedule format · Release/v1/1.0.3</div>
    </div>
  </div>

  <div class="datanote">
    <span>◈</span>
    <span><b>Preview only.</b> Nothing is written to the live system. Pushing would post ${mineCount} Planned sessions for ${fmtDate(day.date)} to <b>/screenschedule/Schedule</b>; screen list, capacities and price cards are taken from the current Screen Schedule master.</span>
  </div>`;
}

/* ============================================================
   11. MAIN RENDER
   ============================================================ */
function render(){
  renderChrome();
  let html = '';
  if(state.stage === 1 || !state.filmId) html = stageFilm();
  else if(state.stage === 2) html = stageDossier();
  else if(state.stage === 3) html = stageForecast();
  else html = stageSchedule();
  $('#shell').innerHTML = html;
  $('#wkchip').textContent = state.weekId;
  const ci = document.querySelector('#cinSel');
  if(ci) ci.value = state.cinema;
}

/* ============================================================
   12. EVENTS
   ============================================================ */
function toast(msg){
  $('#toastmsg').textContent = msg;
  $('#toast').classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> $('#toast').classList.remove('on'), 2600);
}

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id === 'q'){
    state.q = t.value;
    const list = document.querySelector('.fgrid');
    if(list){
      // re-render only the grid area to keep focus
      const tmp = document.createElement('div');
      tmp.innerHTML = stageFilm();
      const newGrid = tmp.querySelector('.fgrid');
      const newCount = tmp.querySelector('.pickcount');
      list.innerHTML = newGrid.innerHTML;
      document.querySelector('.pickcount').innerHTML = newCount.innerHTML;
    }
    return;
  }
  if(t.id === 'edslide'){
    // live preview while dragging; the move is committed on release
    const row = editRow();
    if(!row) return;
    const target = Number(t.value);
    const clock = document.querySelector('.sed-clock .t');
    const fin = document.querySelector('.sed-clock .e b');
    if(clock) clock.textContent = hhmm(target);
    if(fin) fin.textContent = hhmm(target + row.film.mins + PRE_ROLL);
    return;
  }
  if(t.dataset && t.dataset.dim){
    const k = t.dataset.dim;
    if(!state.scores[state.filmId]) state.scores[state.filmId] = defaultScores(getFilm(state.filmId));
    state.scores[state.filmId][k] = Number(t.value);
    t.style.setProperty('--pct', t.value + '%');
    t.closest('.dim').querySelector('.vl').textContent = t.value;
    // live index + gauge + context bar
    const sc = currentScores();
    const idx = composite(sc);
    const v = verdict(idx);
    const anchor = compAnchor(getFilm(state.filmId));
    const g = document.querySelector('.gauge');
    if(g){
      const C = 2*Math.PI*46;
      const ring = g.querySelectorAll('circle')[1];
      if(ring) ring.setAttribute('stroke-dasharray', `${(C*idx/100).toFixed(1)} ${C.toFixed(1)}`);
      g.querySelector('.ring-v').textContent = Math.round(idx);
      g.querySelector('.vd .lab').textContent = v.label;
      g.querySelector('.vd .sub').textContent = v.note;
      const d = idx - anchor.idx;
      const dl = g.querySelector('.dl');
      dl.style.color = d>=0 ? 'var(--green)' : 'var(--amber)';
      dl.textContent = (d>=0?'▲':'▼') + ' ' + Math.abs(Math.round(d)) + ' vs comparables (' + Math.round(anchor.idx) + ')';
    }
    renderChrome();
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id === 'cinSel'){
    state.cinema = t.value;
    closeEdit();
    if(state.plan){
      const fc = forecast(state.filmId, state.cinema, state.weekId);
      state.plan = buildWeekPlan(fc);
      state.dayIdx = clamp(state.dayIdx, 0, 6);
    }
    render(); return;
  }
  if(t.dataset && t.dataset.status){
    state.statuses[t.dataset.status] = t.checked;
    render(); return;
  }
  if(t.name === 'grp'){ state.groupBy = t.value; render(); return; }
  if(t.id === 'edslot'){
    const row = editRow();
    if(row && Number(t.value) !== row.start) nudgeRow(row, Number(t.value) - row.start);
    return;
  }
  if(t.id === 'edslide'){
    const row = editRow();
    if(row && Number(t.value) !== row.start) nudgeRow(row, Number(t.value) - row.start);
    return;
  }
});

/* Arrow keys nudge the session that is open in the drawer. */
document.addEventListener('keydown', e=>{
  if(!state.edit) return;
  if(e.key === 'Escape'){ closeEdit(); render(); return; }
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const row = editRow();
  if(!row) return;
  e.preventDefault();
  const step = e.shiftKey ? 60 : 15;
  nudgeRow(row, e.key === 'ArrowUp' ? -step : step);
});

document.addEventListener('click', e=>{
  if(window.__suppressRowClick){ window.__suppressRowClick = false; return; }  // a drag just happened
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  if(act === 'film'){
    state.filmId = v;
    if(!state.scores[v]) state.scores[v] = defaultScores(getFilm(v));
    state.stage = 2; state.plan = null; render(); window.scrollTo(0,0); return;
  }
  if(act === 'stage'){
    const n = Number(v);
    if(n > 1 && !state.filmId) return;
    if(n === 4 && !state.plan) return;
    closeEdit(); state.stage = n; render(); window.scrollTo(0,0); return;
  }
  if(act === 'filter'){ state.filter = v; render(); return; }
  if(act === 'restart'){ closeEdit(); state.filmId = null; state.stage = 1; state.plan = null; render(); window.scrollTo(0,0); return; }
  if(act === 'preset'){
    const f = getFilm(state.filmId);
    state.scores[state.filmId] = compScores(f);
    render(); toast('Scores set from comparable titles'); return;
  }
  if(act === 'resetscore'){
    state.scores[state.filmId] = defaultScores(getFilm(state.filmId));
    render(); toast('Score reset'); return;
  }
  if(act === 'generate'){
    const fc = forecast(state.filmId, state.cinema, state.weekId);
    state.plan = buildWeekPlan(fc);
    state.dayIdx = 0;
    state.stage = 4;
    closeEdit();
    render(); window.scrollTo(0,0);
    toast('Week generated · ' + state.plan.days.reduce((a,d)=>a+d.rows.filter(r=>r.mine).length,0) + ' sessions planned');
    return;
  }
  if(act === 'day'){ state.dayIdx = Number(v); closeEdit(); render(); return; }
  if(act === 'daymove'){
    const d = Number(v);
    if(d === 0) state.dayIdx = 0;
    else state.dayIdx = clamp(state.dayIdx + d, 0, 6);
    closeEdit(); render(); return;
  }
  if(act === 'week'){
    state.weekId = v;
    closeEdit();
    if(state.plan){
      const fc = forecast(state.filmId, state.cinema, state.weekId);
      state.plan = buildWeekPlan(fc);
      state.dayIdx = 0;
    }
    render(); return;
  }
  if(act === 'search'){
    closeEdit();
    if(state.plan){
      const fc = forecast(state.filmId, state.cinema, state.weekId);
      state.plan = buildWeekPlan(fc);
      toast('Schedule regenerated for ' + state.cinema);
    }
    render(); return;
  }
  if(act === 'push'){
    toast('Queued for Screen Schedule — ' + state.plan.days.reduce((a,d)=>a+d.rows.filter(r=>r.mine).length,0) + ' sessions (preview only)');
    return;
  }

  /* ---- time adjustment ---- */
  if(act === 'editsess'){ openEdit(el.dataset.id); return; }
  if(act === 'edclose'){ closeEdit(); render(); return; }
  if(act === 'nudge' || act === 'edmove'){
    const row = state.plan ? state.plan.days[state.dayIdx].rows.find(r=>r.id === el.dataset.id) || editRow() : null;
    if(!row) return;
    nudgeRow(row, Number(v));
    return;
  }
  if(act === 'stepup' || act === 'stepdown'){
    if(holdSuppress){ holdSuppress = false; return; }   // step already applied by mousedown/touchstart
    const row = state.plan ? state.plan.days[state.dayIdx].rows.find(r=>r.id === el.dataset.id) : null;
    if(!row) return;
    stepMove(row, act === 'stepup' ? -1 : 1, false);
    return;
  }
  if(act === 'edrevert'){
    const row = editRow();
    if(!row || !state.edit) return;
    const target = row.planStart != null ? row.planStart : state.edit.start0;
    const delta = target - row.start;
    if(!delta){ toast('Already at the planned time'); return; }
    if(nudgeRow(row, delta)) toast('Reverted to planned time ' + hhmm(row.start));
    return;
  }
});

/* ============================================================
   12b. DRAG A PLANNED SESSION CARD — grab the whole row, a ghost
        card follows the cursor, a purple drop zone shows where it
        will land, release to apply the new show time.
   ============================================================ */
const PX_PER_MIN = 2;                 // vertical drag sensitivity (px per minute)
let drag = null, pend = null;

function dragTip(){
  let t = document.getElementById('dragtip');
  if(!t){ t = document.createElement('div'); t.id = 'dragtip'; document.body.appendChild(t); }
  return t;
}
function clearDrop(){ document.querySelectorAll('.drop-target').forEach(n=> n.classList.remove('drop-target')); }
function showDrop(row, day, proposed){
  clearDrop();
  const L = limits(day, row);
  const start = Math.max(L.earliest, Math.min(L.latest, proposed));
  const others = L.chain.filter(r=> r !== row);            // same screen, sorted by start
  const mark = others.find(r=> r.start > start) || others[others.length - 1];
  if(mark){ const t = document.querySelector(`tr[data-id="${mark.id}"]`); if(t) t.classList.add('drop-target'); }
}

document.addEventListener('pointerdown', e=>{
  window.__suppressRowClick = false;
  if(!state.plan) return;
  if(e.target.closest('.stepbtns')) return;                // move buttons handle themselves
  const tr = e.target.closest && e.target.closest('tr[data-id]');  // any session row (Open, Planned, …)
  if(!tr) return;
  const id = tr.dataset.id;
  const day = state.plan.days[state.dayIdx];
  const row = day.rows.find(r=> r.id === id);
  if(!row) return;
  e.preventDefault();                                      // stop native text-select / drag-and-drop from hijacking the gesture
  pend = { tr, row, day, x: e.clientX, y: e.clientY, pointerId: e.pointerId };
}, {passive:false});

document.addEventListener('pointermove', e=>{
  if(drag){ e.preventDefault(); stepDrag(e); return; }
  if(pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) >= 5){ startDrag(); stepDrag(e); }
});

function startDrag(){
  drag = { ...pend, startY: pend.y, orig: pend.row.start, dy: 0, delta: 0 };
  pend = null;
  document.body.classList.add('dragging');
  drag.tr.classList.add('drag-on');
  window.__suppressRowClick = true;                        // the trailing click must not open the editor
  try { drag.tr.setPointerCapture(drag.pointerId); } catch(_){}   // keep events flowing even if the cursor leaves the row/iframe
}

/* The WHOLE row follows the cursor — it physically slides up/down. A tooltip shows
   the new time and a purple drop zone marks where it will land. */
function stepDrag(e){
  const d = drag;
  d.dy = e.clientY - d.startY;
  d.delta = Math.round((d.dy / PX_PER_MIN) / 5) * 5;        // snap to 5-min steps
  const proposed = d.orig + d.delta;
  d.tr.style.transform = `translateY(${d.dy}px)`;           // the entire row moves with the cursor
  const tb = d.tr.querySelector('td.tm b');
  if(tb) tb.textContent = hhmm(proposed);
  showDrop(d.row, d.day, proposed);
  const dir = d.delta === 0 ? 'release to set'
    : (d.delta < 0 ? `▲ ${Math.abs(d.delta)} min earlier` : `▼ ${d.delta} min later`);
  const tip = dragTip();
  tip.innerHTML =
    `<div class="dt-t">${hhmm(proposed)} – ${hhmm(proposed + d.row.film.mins + PRE_ROLL)}</div>`+
    `<div class="dt-s">${bandName(proposed)} · ${dir}</div>`;
  tip.style.display = 'block';
  tip.style.left = e.clientX + 'px';
  tip.style.top  = e.clientY + 'px';
}

function finishDrag(){
  if(!drag) return;
  const { row, day, tr, delta } = drag;
  drag = null;
  document.body.classList.remove('dragging');
  clearDrop();
  const tip = document.getElementById('dragtip');
  if(tip) tip.style.display = 'none';
  tr.classList.remove('drag-on');
  try { tr.releasePointerCapture(drag.pointerId); } catch(_){}
  tr.style.transform = '';
  if(!delta){ render(); return; }                          // no real movement — restore row
  const L = limits(day, row);
  const d = Math.max(L.earliest - row.start, Math.min(L.latest - row.start, delta)); // clamp to free slot
  if(!d){ toast('No room — already at the edge of its free slot'); render(); return; }
  nudgeRow(row, d);                                        // commits the move (cascade + reflow + toast)
}
document.addEventListener('pointerup', finishDrag);
document.addEventListener('pointercancel', finishDrag);

/* ============================================================
   13. BOOT
   ============================================================ */
render();
</script>
</body>
</html>
