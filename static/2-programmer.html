<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TGV Programmer — Film Intake to Screen Schedule</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --paper:#F5F2ED;
  --paper2:#EFEBE4;
  --card:#FFFFFF;
  --ink:#14110E;
  --ink2:#3A3530;
  --ink3:#5C554D;
  --dim:#8B8279;
  --dim2:#A79E94;
  --line:#E3DDD4;
  --line2:#EDE8E0;
  --red:#E4002B;
  --red-dk:#B00022;
  --red-lt:#FDECEE;
  --teal:#0E7C7B;
  --gold:#A97B1E;
  --green:#1B7A45;
  --amber:#B06A06;
  --violet:#6B4EA8;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'SF Mono','Cascadia Mono','Consolas','Roboto Mono',monospace;
  --sh:0 1px 2px rgba(20,17,14,.05),0 6px 20px -8px rgba(20,17,14,.12);
  --sh2:0 2px 4px rgba(20,17,14,.06),0 16px 40px -16px rgba(20,17,14,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:13px;line-height:1.5;min-height:100vh;
}
::selection{background:rgba(228,0,43,.16)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ============================================================
   TOPBAR
   ============================================================ */
.top{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.top-in{max-width:1660px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand .mk{
  width:30px;height:30px;border-radius:7px;background:var(--red);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:.4px;
  box-shadow:0 1px 2px rgba(228,0,43,.35),inset 0 -1px 0 rgba(0,0,0,.18);
}
.brand .tx{display:flex;flex-direction:column;line-height:1.15}
.brand .tx b{font-size:12.5px;font-weight:700;letter-spacing:-.1px}
.brand .tx span{font-size:9.5px;color:var(--dim);letter-spacing:.55px;text-transform:uppercase;font-weight:600}

.steps{display:flex;align-items:center;gap:2px;margin-left:6px}
.stp{
  display:flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;border-radius:20px;
  font-size:11.5px;color:var(--ink3);font-weight:550;transition:.14s;white-space:nowrap;
}
.stp i{
  width:18px;height:18px;border-radius:50%;background:var(--paper2);color:var(--dim);
  display:grid;place-items:center;font-size:9.5px;font-weight:700;font-style:normal;transition:.14s;
  border:1px solid var(--line);
}
.stp.done i{background:var(--green);border-color:var(--green);color:#fff}
.stp.on{background:var(--ink);color:#fff}
.stp.on i{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.stp:not(.on):hover{background:var(--paper2)}
.stp-sep{width:14px;height:1px;background:var(--line);flex-shrink:0}

.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.wk-chip{
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);
  background:var(--paper2);padding:5px 11px;border-radius:16px;font-weight:550;
}
.wk-chip b{color:var(--ink);font-weight:700}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.av{width:27px;height:27px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}

/* ============================================================
   CONTEXT BAR
   ============================================================ */
.ctx{
  max-width:1660px;margin:0 auto;padding:0 24px;display:none;align-items:center;gap:12px;
  height:52px;border-bottom:1px solid var(--line2);background:#fff;
}
.ctx.on{display:flex}
.ctx .thumb{
  width:26px;height:36px;border-radius:3px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.28);
}
.ctx .ti{line-height:1.2}
.ctx .ti b{font-size:12px;font-weight:650;display:block}
.ctx .ti span{font-size:10px;color:var(--dim)}
.ctx .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.ctx .stat{display:flex;align-items:baseline;gap:5px;font-size:10.5px;color:var(--dim)}
.ctx .stat b{font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:400;letter-spacing:-.3px}
.ctx .link{
  margin-left:auto;font-size:11px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:6px;transition:.14s;
}
.ctx .link:hover{background:var(--red-lt)}

/* ============================================================
   SHELL
   ============================================================ */
.shell{max-width:1660px;margin:0 auto;padding:26px 24px 64px}
.hd{margin-bottom:20px}
.hd .kick{
  font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);
  font-weight:700;margin-bottom:7px;
}
.hd h1{font-family:var(--serif);font-size:33px;font-weight:400;letter-spacing:-.7px;line-height:1.1}
.hd p{font-size:12.5px;color:var(--ink3);margin-top:7px;max-width:660px;line-height:1.55}

/* ============================================================
   STAGE 1 — FILM PICKER
   ============================================================ */
.pickbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{
  position:relative;flex:1;min-width:220px;max-width:330px;
}
.search input{
  width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:0 12px 0 31px;font-size:12px;outline:none;transition:.14s;
}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,14,.06)}
.search svg{position:absolute;left:10px;top:10px;opacity:.4}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:16px;font-size:11px;font-weight:550;color:var(--ink3);
  background:#fff;border:1px solid var(--line);transition:.14s;
}
.chip:hover{border-color:var(--dim2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pickcount{font-size:11px;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.fc{
  background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  text-align:left;transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;
  display:flex;flex-direction:column;
}
.fc:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#D2CABE}
.fc:active{transform:translateY(-1px)}
.fc .pos{height:158px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:13px}
.fc .pos::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.16),transparent 60%),
             linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,.06) 55%);
}
.fc .pos .glow{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(38px);opacity:.55;right:-18px;top:-24px}
.fc .pos .ti{
  position:relative;z-index:2;font-family:var(--serif);font-size:23px;line-height:.98;
  color:#fff;letter-spacing:-.3px;text-shadow:0 1px 10px rgba(0,0,0,.4);
}
.fc .pos .ti small{display:block;font-size:11px;letter-spacing:.4px;opacity:.82;font-family:var(--sans);font-weight:500;margin-top:4px}
.fc .pos .rt{
  position:absolute;top:9px;right:9px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.3px;
  padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.92);color:var(--ink);
}
.fc .pos .st{
  position:absolute;top:9px;left:9px;z-index:2;font-size:8.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;padding:2.5px 6px;border-radius:4px;backdrop-filter:blur(6px);
  background:rgba(0,0,0,.42);color:#fff;border:1px solid rgba(255,255,255,.22);
}
.fc .pos .st.prev{background:rgba(228,0,43,.9);border-color:transparent}
.fc .bd{padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.fc .bd .g{font-size:11.5px;font-weight:650;color:var(--ink);letter-spacing:-.1px;line-height:1.25}
.fc .bd .m{font-size:10px;color:var(--dim);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fc .bd .m i{font-style:normal;width:2px;height:2px;border-radius:50%;background:var(--dim2)}
.fc .bd .bot{
  margin-top:auto;padding-top:8px;border-top:1px solid var(--line2);display:flex;
  align-items:center;justify-content:space-between;font-size:10px;color:var(--dim);
}
.fc .bd .bot b{color:var(--ink2);font-weight:600}
.ixpill{
  font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:var(--paper2);color:var(--ink3);font-variant-numeric:tabular-nums;
}
.ixpill.strong{background:#E6F4EC;color:var(--green)}
.ixpill.solid{background:#EAF1FA;color:#2C5C8F}
.ixpill.watch{background:#FCF1DC;color:var(--amber)}
.ixpill.weak{background:#F7E7E7;color:#9B2C2C}

/* ============================================================
   STAGE 2 — DOSSIER + SCORE
   ============================================================ */
.two{display:grid;grid-template-columns:1fr 396px;gap:18px;align-items:start}
@media(max-width:1180px){.two{grid-template-columns:1fr}}

.dossier{display:grid;grid-template-columns:196px 1fr;gap:20px}
@media(max-width:760px){.dossier{grid-template-columns:1fr}}
.poster{
  border-radius:10px;overflow:hidden;position:relative;aspect-ratio:2/3;
  box-shadow:0 2px 6px rgba(20,17,14,.14),0 22px 44px -22px rgba(20,17,14,.45);
  display:flex;flex-direction:column;justify-content:flex-end;padding:16px;
}
.poster::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(100% 70% at 20% 0%,rgba(255,255,255,.14),transparent 62%),
             linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.04) 58%);
}
.poster .glow{position:absolute;width:170px;height:170px;border-radius:50%;filter:blur(52px);opacity:.6;left:-30px;top:-40px}
.poster .pt{position:relative;z-index:2;color:#fff;font-family:var(--serif);font-size:27px;line-height:.98;letter-spacing:-.4px}
.poster .pt small{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;opacity:.75;margin-top:7px}
.poster .rt{position:absolute;top:11px;right:11px;z-index:2;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.94);color:var(--ink)}
.poster .fm{position:absolute;top:11px;left:11px;z-index:2;font-size:8.5px;font-weight:700;letter-spacing:.7px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.25)}

.dos-main{min-width:0}
.dos-hd{margin-bottom:12px}
.dos-hd h2{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.6px;line-height:1.08}
.dos-hd .sub{font-size:12px;color:var(--ink3);margin-top:4px}
.dos-hd .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{
  font-size:9.5px;font-weight:650;letter-spacing:.3px;padding:3px 7px;border-radius:5px;
  background:var(--paper2);color:var(--ink3);border:1px solid var(--line);
}
.tag.red{background:var(--red-lt);color:var(--red-dk);border-color:#F6D3D8}

.syn{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:14px 0}
.syn b{color:var(--ink);font-weight:650}

.hook{
  border-left:2px solid var(--red);padding:2px 0 2px 13px;margin:14px 0 18px;
  font-size:12px;line-height:1.6;color:var(--ink2);
}
.hook span{display:block;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:4px}

.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
@media(max-width:720px){.meta{grid-template-columns:repeat(2,1fr)}}
.meta div{background:#fff;padding:9px 11px}
.meta dt{font-size:9px;letter-spacing:.85px;text-transform:uppercase;color:var(--dim2);font-weight:700;margin-bottom:3px}
.meta dd{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.3}
.meta dd.nil{font-weight:400;color:var(--dim2);font-size:10.5px}

.sec-t{
  font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin:20px 0 9px;display:flex;align-items:center;gap:8px;
}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line2)}

/* comparables */
.cmp{display:flex;flex-direction:column;gap:1px;background:var(--line2);border-radius:9px;overflow:hidden;border:1px solid var(--line2)}
.cmp-r{background:#fff;display:grid;grid-template-columns:1fr 104px 34px 56px;gap:11px;padding:9px 12px;align-items:center}
.cmp-r .n{font-size:11.5px;font-weight:600;color:var(--ink2)}
.cmp-r .b{height:5px;border-radius:3px;background:var(--paper2);overflow:hidden;position:relative}
.cmp-r .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink3)}
.cmp-r .s{font-size:10px;text-align:right;color:var(--dim2);font-variant-numeric:tabular-nums}
.cmp-r .v{font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.cmp-r .v b{color:var(--ink);font-weight:700}

/* audience */
.aud{display:flex;flex-direction:column;gap:8px}
.aud-r{display:grid;grid-template-columns:96px 1fr 38px;gap:9px;align-items:center;font-size:11px;color:var(--ink3)}
.aud-r .b{height:5px;border-radius:3px;background:var(--paper2);overflow:hidden}
.aud-r .b i{display:block;height:100%;border-radius:3px}
.aud-r .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink2);font-size:10.5px}

/* ============================================================
   SCORE CARD
   ============================================================ */
.scorecard{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 17px 15px;
  box-shadow:var(--sh);position:sticky;top:126px;
}
.sc-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.sc-hd h3{font-size:13px;font-weight:700;letter-spacing:-.1px}
.sc-hd p{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;max-width:210px}
.sc-hd .badge{
  font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 6px;border-radius:4px;background:var(--red-lt);color:var(--red-dk);flex-shrink:0;
}

.gauge{display:flex;align-items:center;gap:14px;padding:12px 0 14px;border-bottom:1px solid var(--line2)}
.gauge svg{flex-shrink:0}
.ring-v{font-family:var(--serif);font-size:30px;fill:var(--ink);letter-spacing:-1px}
.ring-l{font-size:7.5px;fill:var(--dim);letter-spacing:1.4px;font-weight:700;font-family:var(--sans)}
.gauge .vd{min-width:0}
.gauge .vd .lab{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.gauge .vd .sub{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.gauge .vd .dl{font-size:10px;margin-top:6px;color:var(--ink3);display:flex;align-items:center;gap:4px;font-weight:600}

.dims{padding:4px 0 2px}
.dim{padding:9px 0;border-bottom:1px dashed var(--line2)}
.dim:last-child{border-bottom:0}
.dim-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:1px}
.dim-t .nm{font-size:11.5px;font-weight:600;color:var(--ink)}
.dim-t .w{font-size:8.5px;color:var(--dim2);font-weight:600;letter-spacing:.4px}
.dim-t .vl{font-family:var(--serif);font-size:18px;letter-spacing:-.4px;color:var(--ink);min-width:26px;text-align:right}
.dim .hint{font-size:9.5px;color:var(--dim2);line-height:1.35;margin-bottom:2px}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;
  background:linear-gradient(to right,var(--red) 0%,var(--red) var(--pct,50%),var(--line) var(--pct,50%),var(--line) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
  border:2.5px solid var(--red);margin-top:-5px;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .12s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--red)}

.sc-actions{display:flex;gap:6px;margin-top:13px}
.mini{
  flex:1;font-size:10.5px;font-weight:600;padding:7px 8px;border-radius:7px;
  background:var(--paper2);color:var(--ink3);transition:.14s;text-align:center;
}
.mini:hover{background:#E6E1D8;color:var(--ink)}
.mini.solid{background:var(--ink);color:#fff}
.mini.solid:hover{background:#000}

.cta{
  width:100%;margin-top:9px;height:41px;border-radius:9px;background:var(--red);color:#fff;
  font-size:12.5px;font-weight:650;letter-spacing:.1px;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:.15s;box-shadow:0 1px 2px rgba(228,0,43,.3),0 8px 20px -10px rgba(228,0,43,.7);
}
.cta:hover{background:var(--red-dk);transform:translateY(-1px);box-shadow:0 2px 4px rgba(228,0,43,.34),0 12px 26px -10px rgba(228,0,43,.8)}
.cta:active{transform:translateY(0)}
.cta.ghost{
  background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;
}
.cta.ghost:hover{background:var(--paper2);box-shadow:none;transform:none}

/* ============================================================
   STAGE 3 — FORECAST
   ============================================================ */
.kpis{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .k{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700}
.kpi .v{font-family:var(--serif);font-size:34px;letter-spacing:-1.2px;line-height:1.05;margin-top:5px;color:var(--ink)}
.kpi .v small{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--dim);letter-spacing:0;margin-left:3px}
.kpi .f{font-size:10px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:5px}
.kpi.hero{background:var(--ink);border-color:var(--ink)}
.kpi.hero .k{color:rgba(255,255,255,.5)}
.kpi.hero .v{color:#fff}
.kpi.hero .v small{color:rgba(255,255,255,.55)}
.kpi.hero .f{color:rgba(255,255,255,.6)}
.kpi.hero::after{
  content:'';position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:var(--red);filter:blur(46px);opacity:.35;
}

.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-hd h3{font-size:12.5px;font-weight:700;letter-spacing:-.1px}
.panel-hd .hint{font-size:10px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start;margin-bottom:14px}
@media(max-width:1120px){.grid2{grid-template-columns:1fr}}

/* chart */
.chartwrap{position:relative}
.chart-legend{display:flex;gap:14px;font-size:10px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* derivation */
.deriv{font-family:var(--mono);font-size:10.5px;line-height:1.85}
.deriv .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}

.ss-shell{background:#fff;border:1px solid #CBD5DE;border-radius:6px;overflow:hidden}

.ss-btn{
  width:26px;height:26px;border:1px solid #CFD8E0;border-radius:3px;background:#FBFCFD;

  display:inline-flex;align-items:center;justify-content:center;width:14px;height:16px;
  margin-right:6px;color:#9fb0b0;cursor:grab;vertical-align:-2px;border-radius:3px;
  transition:.12s;user-select:none;
}

body.dragging{cursor:grabbing;user-select:none}

  background:#221b16;color:#fff;padding:7px 11px;border-radius:9px;
  font-size:11.5px;line-height:1.5;box-shadow:0 10px 24px -6px rgba(0,0,0,.55);
  transform:translate(-50%,calc(-100% - 16px));white-space:nowrap;

/* ---- session time editor ---- */
.sed{
  position:fixed;top:0;right:0;bottom:0;width:394px;max-width:94vw;background:var(--card);
  border-left:1px solid var(--line);box-shadow:-26px 0 70px -34px rgba(20,17,14,.5);

  display:flex;flex-direction:column;
}

  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:16px 18px 14px;border-bottom:1px solid var(--line2);
}

}

  if(l.includes('indulge')) return 'Indulge';
  if(l.includes('beanie')) return 'Beanie';
  if(l.includes('junior')) return 'Junior';
  return 'Standard';
}
function fmtCode(t){
  return {IMAX:'(I-2D)',Beanie:'(B)',Indulge:'(IND)',BEREX:'(ICB)',Junior:'(JR)',Standard:''}[t] || '';
}
function cinCode(name){
  const m = {'Suria KLCC':'KLCC','1 Utama':'1U','Sunway Pyramid':'SWP','Pavilion KL':'PBJ','Velocity':'VEL',
    'Setia Walk':'SW','Gurney Paragon Mall':'GP','Tebrau':'TEB','Mines':'MINES','Pavilion Bukit Jalil':'PBJ',
    'Sunway Square':'SWS','Alamanda':'ALM','Pavilion Damansara Height':'PDH'};
  return m[name] || name.replace(/[^A-Z]/g,'').slice(0,4) || 'TGV';
}
function buildCinema(name){
  let defs = SCREEN_DEFS[name];
  if(!defs){
    // deterministic synthetic config for cinemas we did not sample
    let h = 0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    const n = 6 + (h % 4);
    defs = [];
    if(h % 3 === 0) defs.push(['Beanie', 20 + (h%4)*6]);
    for(let i=1;i<=n;i++) defs.push(['Cinema '+i, 90 + ((h>>i) % 170)]);
    if(h % 2 === 0) defs.push(['IMAX', 200 + (h%140)]);
    defs.push(['Indulge 1', 36 + (h%6)]);
    defs.sort((a,b)=> a[0].localeCompare(b[0],'en',{sensitivity:'base'}));
  }
  const screens = defs.map(([n,cap],i)=>{
    const type = screenType(n);
    const firstStd = defs.findIndex(d=>screenType(d[0])==='Standard') === i;
    return {
      name:n, cap, type,
      prefix: type === 'Standard' ? (firstStd ? '(AT)' : '') : fmtCode(type),
      premium: type==='IMAX'?1.65:type==='Indulge'?2.2:type==='BEREX'?2.6:type==='Beanie'?1.1:1
    };
  });
  const totalCap = screens.reduce((a,s)=>a+s.cap,0);
  return {
    name, code: cinCode(name), screens, totalCap,
    atp: CINEMA_ATP[name] || 18.5,
    factor: 0.55 + 0.55*(totalCap/1200)
  };
}
const CINEMAS = CINEMA_NAMES.map(buildCinema);
function getCinema(n){ return CINEMAS.find(c=>c.name===n) || CINEMAS[0]; }

(function(){
  function sync(){
    let changed = false;
    try{
      const raw = localStorage.getItem('tgv.createfilm.titles');
      if(!raw) return false;
      const created = JSON.parse(raw);
      if(!Array.isArray(created)) return false;
      created.forEach((t,i)=>{
        const id = 'shared-' + String(t.id || i).replace(/[^a-z0-9_-]/gi,'');
        if(FILMS.some(f=>f.id===id || f.title===t.title)) return;
        FILMS.push({
          id, title:t.title, sub:t.expName || '', lang:t.lang || 'English', mins:t.mins || 120,
          rating:t.cert || 'P13', genre:t.genre || 'Feature', distributor:t.dist || 'TGV',

          hook:'Title request already completed by the creator; no duplicate setup needed.',
          c1:'#171820', c2:t.color || '#E4002B', accent:'#E4002B',
          comps:[{n:'Comparable release',sim:.62,aps:52,idx:58}],
          scores:{story:65,cast:62,heat:70,fit:66,ip:60},
          rules:{minShows:3,minScreens:1,mustPlay:'',maxShows:8,imax:/IMAX/i.test(t.code || '') ? 2 : 0}

      });

  }

})();

const WEEK_DECAY = [1.00,0.72,0.52,0.38,0.28,0.21,0.16,0.12,0.09,0.07];
const DOW = [

const WEEKS = [
  {id:'W44', start:'2026-10-26', label:'W44'},
  {id:'W45', start:'2026-11-02', label:'W45'},

/* ============================================================
   2. UTILITIES
   ============================================================ */
const $ = s => document.querySelector(s);
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = n => 'RM ' + Math.round(n).toLocaleString('en-MY');
const pad2 = n => String(n).padStart(2,'0');
function hhmm(m){
  m = Math.round(m);
  const h = Math.floor(m/60) % 24, mm = ((m%60)+60)%60;
  return pad2(h) + ':' + pad2(mm);
}
function fmtDate(d){ return d.getFullYear()+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate()); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s = (Math.imul(s,1664525) + 1013904223) >>> 0; return s/4294967296; }; }
function getFilm(id){ return FILMS.find(f=>f.id===id); }
function getWeek(){ return WEEKS.find(w=>w.id===state.weekId) || WEEKS[1]; }
function weekDates(w){ const s = pd(w.start); return DOW.map((d,i)=>({...d, date:addDays(s,i), idx:i})); }

/* ============================================================
   3. SCORING
   ============================================================ */
function composite(sc){
  let t = 0;
  DIMS.forEach(d => t += (sc[d.k] ?? 50) * d.w);
  return t;
}
function verdict(v){
  if(v >= 78) return {label:'Strong', tone:'strong', cls:'strong', note:'Above comparable benchmark'};
  if(v >= 62) return {label:'Solid',  tone:'solid',  cls:'solid',  note:'In line with comparables'};
  if(v >= 45) return {label:'Watch',  tone:'watch',  cls:'watch',  note:'Below comparable benchmark'};
  return {label:'Weak', tone:'weak', cls:'weak', note:'Well below comparables'};
}
function compAnchor(film){
  let ws=0, aps=0, idx=0;
  film.comps.forEach(c=>{ ws += c.sim; aps += c.sim*c.aps; idx += c.sim*c.idx; });
  return {aps: aps/ws, idx: idx/ws, wsum: ws};
}
function compScores(film){
  const a = compAnchor(film);
  return {
    story: clamp(Math.round(a.idx - 4), 5, 95),
    cast:  clamp(Math.round(a.idx), 5, 95),
    heat:  clamp(Math.round(a.idx + 3), 5, 95),
    fit:   clamp(Math.round(a.idx - 6), 5, 95),
    ip:    clamp(Math.round(a.idx), 5, 95)
  };
}
/* The programmer's opening position: the film's own authored score.
   "Score from comparables" is the alternative that overwrites it. */
function defaultScores(film){
  return film.scores ? {...film.scores} : compScores(film);
}
function currentScores(){ return state.scores[state.filmId] || defaultScores(getFilm(state.filmId)); }

/* ============================================================
   4. FORECAST ENGINE
   ============================================================ */
const PRE_ROLL = 15;      // ads + trailers on top of runtime
const TURNOVER = 15;      // clean-down between sessions
const OPEN_MIN = 630;     // 10:30
const CLOSE_MIN = 1560;   // 02:00 next day

function primeWeight(m){
  const h = ((m % 1440) + 1440) % 1440 / 60;
  if(h < 11)  return 0.30;
  if(h < 12)  return 0.46;
  if(h < 14)  return 0.74;
  if(h < 17)  return 0.60;
  if(h < 19)  return 0.86;
  if(h < 22)  return 1.45;
  if(h < 24)  return 0.72;
  return 0.34;
}

function weekIndexOf(film, weekStart){
  const rel = pd(film.release);
  const diff = Math.floor((weekStart - rel) / 86400000);
  return Math.floor(diff / 7);
}

/* Core forecast for one film at one cinema across one week. */
function forecast(filmId, cinemaName, weekId){
  const film = getFilm(filmId);
  const cinema = getCinema(cinemaName);
  const week = WEEKS.find(w=>w.id===weekId) || WEEKS[1];
  const sc = state.scores[filmId] || defaultScores(film);
  const idx = composite(sc);
  const anchor = compAnchor(film);

  const wi = weekIndexOf(film, pd(week.start));
  const pre = wi < 0;
  const decay = pre ? 1.0 : WEEK_DECAY[clamp(wi,0,WEEK_DECAY.length-1)];

  // index lift vs the comparables' own index
  let lift = (0.55 + 0.90*(idx/100)) / (0.55 + 0.90*(anchor.idx/100));
  if(pre) lift = 1 + (lift - 1) * 0.5;   // compress when there is nothing to calibrate against

  const filmAPS = anchor.aps * lift;

  const avgCap = cinema.totalCap / cinema.screens.length;
  const capScale = clamp(avgCap / 120, 0.70, 2.20);

  const maxSlots = cinema.screens.reduce((a,s)=>{
    return a + Math.floor((CLOSE_MIN - OPEN_MIN) / (film.mins + PRE_ROLL + TURNOVER));
  }, 0);

  const r = film.rules;
  const days = weekDates(week).map((d, di) => {
    const ceiling = filmAPS * 10 * d.f * decay * cinema.factor * capScale;
    const n = pickShows(ceiling, r, maxSlots, d.f);
    const admits = ceiling * (1 - Math.exp(-n/4.5));
    const shows = n;
    const seats = shows * avgCap;
    return {
      dow:d.n, date:d.date, factor:d.f, ceiling, shows, admits,
      occ: seats ? admits/seats : 0,
      seats, revenue: admits * cinema.atp
    };
  });

  const total = days.reduce((a,d)=>({
    shows:a.shows+d.shows, admits:a.admits+d.admits, seats:a.seats+d.seats, revenue:a.revenue+d.revenue
  }), {shows:0,admits:0,seats:0,revenue:0});
  total.occ = total.seats ? total.admits/total.seats : 0;

  const bandPct = pre ? 0.34 : clamp(0.14 + Math.abs(idx - anchor.idx)/260, 0.11, 0.24);

  return {
    film, cinema, week, days, total, idx, anchor, lift, filmAPS, decay, wi, pre,
    capScale, maxSlots, bandPct,
    scores: sc, avgCap,
    band: { lo: total.admits*(1-bandPct), hi: total.admits*(1+bandPct) }
  };
}

/* Choose show count by marginal admits, floored by distributor minimum. */
function pickShows(ceiling, rules, maxSlots, dayFactor){
  const min = Math.max(1, rules.minShows);
  const cap = Math.min(maxSlots, rules.maxShows || 99, 18);
  let n = Math.min(min, cap);
  while(n < cap){
    const marginal = (ceiling/4.5) * Math.exp(-(n+1)/4.5);
    if(marginal < 7) break;
    n++;
  }
  if(dayFactor > 1.15 && n < cap && (ceiling/4.5)*Math.exp(-(n+1)/4.5) > 5) n++;
  return n;
}

/* ============================================================
   5. SCHEDULE BUILDER
   ============================================================ */
function weightedPick(pool, rand){
  let t = pool.reduce((a,p)=>a+p.w,0), x = rand()*t;
  for(const p of pool){ x -= p.w; if(x <= 0) return p.f; }
  return pool[pool.length-1].f;
}

/* Which films belong on which kind of screen. */
function poolFor(type, excludeId, dayDate){
  const out = [];
  FILMS.forEach(f=>{
    if(f.id === excludeId) return;
    if(pd(f.release) > dayDate) return;   // not in release yet — not in the grid
    let w = 1;
    if(type === 'IMAX')   { if(!f.rules.imax) return; w = compAnchor(f).aps; }
    else if(type === 'Beanie' || type === 'Junior'){ w = Math.max(6, 60 - compAnchor(f).aps); }
    else if(type === 'Indulge' || type === 'BEREX'){ w = 18 + compAnchor(f).aps*0.6; }
    else { w = 4 + compAnchor(f).aps; }
    out.push({f, w});
  });
  return out;
}

function screenSuitability(screen, film){
  const aps = compAnchor(film).aps;
  const strength = clamp((aps - 20) / 55, 0, 1);   // 0 = small title, 1 = tentpole
  switch(screen.type){
    case 'IMAX':   return film.rules.imax ? 1.55 : 0;
    case 'Beanie':
    case 'Junior': return 0.15 + (1 - strength) * 0.55;
    case 'Indulge':
    case 'BEREX':  return 0.72;
    default:       return 1.0 + clamp(screen.cap/260, 0, .35);
  }
}

function buildDay(cinema, date, film, dayForecast, seedKey){
  const blockLen = film.mins + PRE_ROLL;
  const rand = rng(hash(seedKey));
  const sessions = [];
  const need = Math.min(dayForecast.shows, cinema.screens.length * 3);
  const openMin = film.rating === '18' ? 720 : OPEN_MIN;   // 18-rated: nothing before 12:00

  /* ---- A. reserve the film's own slots first, spread across the day ---- */
  const lateStart = dayForecast.factor > 1.0 ? 1410 : 1335;   // 23:30 weekends / 22:15 weekdays
  const winEnd = Math.min(CLOSE_MIN, lateStart + blockLen);
  const usable = winEnd - openMin - blockLen;
  const perScreen = {};
  const usableScreens = cinema.screens.filter(s=>screenSuitability(s, film) >= 0.5).length;
  let allowPer = 1;
  for(let k = 0; k < need; k++){
    if(k >= usableScreens) allowPer = 3;
    const target = need === 1 ? openMin + usable/2 : openMin + usable * k/(need-1);
    let best = null;
    cinema.screens.forEach(screen=>{
      const suit = screenSuitability(screen, film);
      if(suit <= 0) return;
      if((perScreen[screen.name]||0) >= allowPer) return;
      for(let off = 0; off <= 75; off += 15){
        const signs = off === 0 ? [1] : [1,-1];
        for(const sign of signs){
          const t = Math.round((target + off*sign)/15)*15;
          if(t < openMin || t + blockLen > CLOSE_MIN || t > lateStart) continue;
          const clash = sessions.some(s =>
            s.screen === screen.name && !(t + blockLen + TURNOVER <= s.start || t >= s.end + TURNOVER));
          if(clash) continue;
          const score = primeWeight(t) * suit - off * 0.006;
          if(!best || score > best.score) best = {screen, start:t, score};
        }
      }
    });
    if(!best) continue;
    sessions.push({
      screen: best.screen.name, film, start: best.start, end: best.start + blockLen,
      status:'Planned', mine:true, screenRef: best.screen,
      planStart: best.start
    });
    perScreen[best.screen.name] = (perScreen[best.screen.name]||0) + 1;
  }

  /* ---- B. fill every remaining gap with the existing grid ---- */
  cinema.screens.forEach(screen => {
    const pool = poolFor(screen.type, film.id, date);
    if(!pool.length) return;
    const localRand = rng(hash(seedKey + screen.name));
    const occupied = sessions.filter(s=>s.screen===screen.name).sort((a,b)=>a.start-b.start);
    const gaps = [];
    let cur = OPEN_MIN;
    occupied.forEach(s=>{
      if(s.start - cur > 0) gaps.push([cur, s.start]);
      cur = Math.max(cur, s.end + TURNOVER);
    });
    if(CLOSE_MIN - cur > 0) gaps.push([cur, CLOSE_MIN]);

    gaps.forEach(([gs, ge]) => {
      let t = gs + Math.round(localRand()*10);
      let lastId = null, guard = 0;
      while(guard++ < 8){
        let f = weightedPick(pool, localRand);
        if(f.id === lastId && pool.length > 1) f = weightedPick(pool, localRand);
        if(f.rating === '18' && t < 720){            // no 18-rated before noon
          const safe = pool.filter(p=>p.f.rating !== '18');
          if(safe.length) f = weightedPick(safe, localRand);
          else { t += 30; continue; }
        }
        const len = f.mins + PRE_ROLL;
        if(t + len > ge) break;
        sessions.push({
          screen: screen.name, film: f, start: t, end: t + len,
          status:'Open', mine:false, screenRef: screen
        });
        lastId = f.id;
        t += len + TURNOVER;
      }
    });
  });

  /* ---- C. sell the seats ---- */
  const mineS = sessions.filter(s=>s.mine);
  const wsum = mineS.reduce((a,s)=> a + primeWeight(s.start) * s.screenRef.cap, 0) || 1;
  mineS.forEach(s=>{
    const cap = s.screenRef.cap;
    const raw = dayForecast.admits * (primeWeight(s.start) * cap) / wsum;
    s.sold = Math.min(cap, Math.round(raw));
    s.locked = Math.min(cap - s.sold, Math.round(rand()*2));
    s.cap = cap;
    s.avail = cap - s.sold - s.locked;
    s.occ = s.sold / cap;
  });

  // existing sessions get plausible occupancy from their own title's demand
  sessions.filter(s=>!s.mine).forEach(s=>{
    const aps = compAnchor(s.film).aps;
    const base = clamp(0.12 + 0.36 * (aps/70), 0.03, 0.55);
    const jitter = 0.75 + rand()*0.6;
    const occ = clamp(base * primeWeight(s.start)/1.2 * jitter, 0.01, 0.82);
    s.cap = s.screenRef.cap;
    s.sold = Math.round(s.cap * occ);
    s.locked = Math.round(rand()*3);
    s.avail = s.cap - s.sold - s.locked;
    s.occ = s.sold / s.cap;
  });

  // order screens the way the house system does (alphabetical)
  const order = {};
  cinema.screens.map(s=>s.name).sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'})).forEach((n,i)=>order[n]=i);
  sessions.sort((a,b)=> (order[a.screen]-order[b.screen]) || (a.start-b.start));

  return sessions;
}

function buildWeekPlan(fc){
  const cinema = fc.cinema;
  const week = fc.week;
  const dates = weekDates(week);
  const days = dates.map((d, i) => {
    const rows = buildDay(cinema, d.date, fc.film, fc.days[i], cinema.name + '|' + fmtDate(d.date) + '|' + fc.film.id);
    return { ...fc.days[i], date:d.date, dow:d.n, idx:i, rows };
  });
  // stable ids so a row can be selected and moved without losing track of it
  let uid = 0;
  days.forEach(d => d.rows.forEach(r => { r.id = 'r' + (uid++); }));
  return { fc, cinema, week, dates, days };
}

/* ============================================================
   5b. TIME ADJUSTMENT — move a planned session earlier / later
   ============================================================ */
function screenOrderMap(cinema){
  const order = {};
  cinema.screens.map(s=>s.name).sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}))
    .forEach((n,i)=> order[n] = i);
  return order;
}

function sortDay(day, cinema){
  const order = screenOrderMap(cinema);
  day.rows.sort((a,b)=> (order[a.screen]-order[b.screen]) || (a.start-b.start));
}

/* Admits for the day are fixed by the forecast; moving a session re-splits them
   across the film's own sessions by prime-time weight × house size. Move a show
   from 14:00 to 20:00 and it earns a bigger share of the same day. */
function reflowDay(day){
  const mine = day.rows.filter(r=>r.mine);
  const wsum = mine.reduce((a,s)=> a + primeWeight(s.start) * s.cap, 0) || 1;
  mine.forEach(s=>{
    const raw = day.admits * (primeWeight(s.start) * s.cap) / wsum;
    s.sold = Math.min(s.cap, Math.round(raw));
    s.locked = Math.min(Math.max(0, s.cap - s.sold), s.locked || 0);
    s.avail = s.cap - s.sold - s.locked;
    s.occ = s.sold / s.cap;
  });
}

function clashesFor(day, row){
  const block = row.film.mins + PRE_ROLL;
  return day.rows.filter(r=> r !== row && r.screen === row.screen &&
    !(row.start + block + TURNOVER <= r.start || row.start >= r.end + TURNOVER));
}

/* Where a session sits on its screen: what is above it, what is below it, and
   how far it can slide up before it touches the session above. */
function limits(day, row){
  const block = row.film.mins + PRE_ROLL;
  const chain = day.rows.filter(r=> r.screen === row.screen).sort((a,b)=> a.start - b.start);
  const i = chain.indexOf(row);
  const prev = i > 0 ? chain[i-1] : null;
  const next = i >= 0 && i < chain.length - 1 ? chain[i+1] : null;
  const earliest = Math.ceil(Math.max(OPEN_MIN, prev ? prev.end + TURNOVER : OPEN_MIN) / 5) * 5;
  // latest start that still lets everything below fit before closing
  let tail = block;
  for(let k = i + 1; k < chain.length; k++) tail += TURNOVER + chain[k].film.mins + PRE_ROLL;
  const latest = Math.max(row.start, Math.floor((CLOSE_MIN - tail) / 5) * 5);
  return { block, chain, i, prev, next, earliest, latest, below: chain.length - i - 1 };
}

/* Move earlier: stops when it touches the session above.
   Move later: pushes the sessions below down the screen, like moving a block in a
   timeline. Fails only when the chain would run past closing. */
function moveSession(day, row, delta, cinema){
  const L = limits(day, row);
  const lenOf = r => r.film.mins + PRE_ROLL;
  const want = row.start + delta;

  if(delta < 0){
    const target = Math.max(want, L.earliest);
    if(target === row.start){
      return { ok:false, why: L.prev
        ? `${L.prev.film.title} ends ${hhmm(L.prev.end)} — no room earlier`
        : `Already at the start of the operating day (${hhmm(OPEN_MIN)})` };
    }
    row.start = target; row.end = target + L.block;
    reflowDay(day); sortDay(day, cinema);
    return { ok:true, pushed:0, target };
  }

  // later — cascade
  const starts = L.chain.map(r=> r.start);
  starts[L.i] = want;
  if(want + L.block > CLOSE_MIN){
    return { ok:false, why:`The day closes at ${hhmm(CLOSE_MIN)}` };
  }
  let pushed = 0;
  for(let k = L.i + 1; k < L.chain.length; k++){
    const need = starts[k-1] + lenOf(L.chain[k-1]) + TURNOVER;
    if(need > starts[k]){ starts[k] = need; pushed++; }
    if(starts[k] + lenOf(L.chain[k]) > CLOSE_MIN){
      return { ok:false, why:`${L.chain[k].film.title} would run past ${hhmm(CLOSE_MIN)}` };
    }
  }
  L.chain.forEach((r,k)=>{
    if(starts[k] !== r.start){ r.start = starts[k]; r.end = starts[k] + lenOf(r); }
  });
  reflowDay(day); sortDay(day, cinema);
  return { ok:true, pushed, target: want };
}

function bandName(m){
  const h = ((m % 1440) + 1440) % 1440 / 60;
  if(h < 11) return 'matinee — low demand';
  if(h < 12) return 'late morning';
  if(h < 14) return 'early afternoon';
  if(h < 17) return 'afternoon — soft';
  if(h < 19) return 'early evening — building';
  if(h < 22) return 'prime time — peak';
  if(h < 24) return 'late show';
  return 'post-midnight';
}

function editRow(){
  if(!state.edit || !state.plan) return null;
  const day = state.plan.days[state.edit.dayIdx];
  return day ? day.rows.find(r=>r.id === state.edit.id) || null : null;
}

function openEdit(id){
  if(!state.plan) return;
  const day = state.plan.days[state.dayIdx];
  const row = day.rows.find(r=>r.id === id);
  if(!row || !row.mine) return;
  state.edit = { dayIdx: state.dayIdx, id, start0: row.start };
  render(); drawDrawer();
}

function closeEdit(){
  state.edit = null;
  const el = $('#sessedit');
  if(el){ el.classList.remove('on'); el.innerHTML = ''; }
}

function drawDrawer(){
  const el = $('#sessedit');
  if(!el) return;
  const row = editRow();
  if(!row){ el.classList.remove('on'); el.innerHTML = ''; return; }

  const day = state.plan.days[state.edit.dayIdx];
  const block = row.film.mins + PRE_ROLL;
  const L = limits(day, row);

  const mine = day.rows.filter(r=>r.mine);
  const primeNow = mine.filter(r=> primeWeight(r.start) >= 1.4).length;
  const primeAll = mine.length;

  const before = state.edit.start0;
  const moved = row.start - before;
  const offPlan = row.start - (row.planStart != null ? row.planStart : before);

  // what the move did to this session's take (weights rebuilt with the old start)
  const wBefore = mine.reduce((a,s)=> a + primeWeight(s === row ? before : s.start) * s.cap, 0) || 1;
  const soldBefore = Math.round(day.admits * (primeWeight(before) * row.cap) / wBefore);
  const soldNow = row.sold;
  const dSold = soldNow - soldBefore;

  // 15-minute slots across the legal range
  const slotOpts = [];
  for(let t = L.earliest; t <= L.latest; t += 15) slotOpts.push(t);
  if(!slotOpts.includes(row.start)) slotOpts.push(row.start);
  slotOpts.sort((a,b)=>a-b);

  const slideDisabled = L.latest <= L.earliest;

  el.innerHTML = `
    <div class="sh">
      <div>
        <div class="kick">Adjust time</div>
        <h3>${esc(row.film.title)}</h3>
        <div class="sub">${esc(row.screen)} · ${row.cap} seats · ${row.film.mins}m + ${PRE_ROLL}m trailers</div>
      </div>
      <button class="x" data-act="edclose" title="Close">×</button>
    </div>

    <div class="sb">
      <div class="sed-step">
        <button class="sed-big" data-act="edmove" data-v="-15" title="15 minutes earlier">−</button>
        <div class="sed-clock">
          <div class="t">${hhmm(row.start)}</div>
          <div class="e">finishes <b>${hhmm(row.end)}</b>${offPlan ? ` · ${offPlan>0?'+':''}${offPlan} min from planned ${hhmm(row.planStart != null ? row.planStart : before)}` : ''}</div>
        </div>
        <button class="sed-big" data-act="edmove" data-v="15" title="15 minutes later">+</button>
      </div>

      <div class="sed-range">
        <input type="range" id="edslide" min="${L.earliest}" max="${L.latest}" step="5" value="${row.start}"
               ${slideDisabled?'disabled':''} aria-label="Session start time" />
        <div class="ends">
          <span>${hhmm(L.earliest)}</span>
          <span class="mid">${slideDisabled ? 'no room to move on this screen' : 'drag to move'}</span>
          <span>${hhmm(L.latest)}</span>
        </div>
      </div>

      <div class="sed-quick">
        ${[[-60,'−1h'],[-30,'−30'],[-15,'−15'],[15,'+15'],[30,'+30'],[60,'+1h']]
          .map(([d,l])=>`<button data-act="edmove" data-v="${d}">${l}</button>`).join('')}
      </div>

      <div class="sed-slot">
        <label>Or jump to a start time</label>
        <select id="edslot" data-act="edslot">
          ${slotOpts.map(t=>`<option value="${t}" ${t===row.start?'selected':''}>${hhmm(t)} — finishes ${hhmm(t+block)}</option>`).join('')}
        </select>
      </div>

      <div class="sed-band">
        <b>${hhmm(row.start)}</b> is ${bandName(row.start)} · demand weight <b>${primeWeight(row.start).toFixed(2)}×</b>
        ${primeWeight(row.start) >= 1.4 ? ' — the strongest band of the day.' : ''}
      </div>

      <div class="sed-room">
        <div class="h">Room on ${esc(row.screen)}</div>
        <div class="r"><span>Above</span><b>${L.prev ? esc(L.prev.film.title)+' ends '+hhmm(L.prev.end) : 'top of the day'}</b></div>
        <div class="r"><span>Below</span><b>${L.next ? esc(L.next.film.title)+' starts '+hhmm(L.next.start) : 'end of the day'}</b></div>
        <div class="r"><span>Can start</span><b>${hhmm(L.earliest)} – ${hhmm(L.latest)}</b></div>
        <div class="r"><span>Moving later</span><b>${L.below ? `pushes ${L.below} session${L.below>1?'s':''} below` : 'nothing below to push'}</b></div>
      </div>

      <div class="sed-imp">
        <div class="h">Effect on this session</div>
        <div class="r">
          <span>Seats sold</span>
          <b>${dSold===0 ? soldNow : `${soldBefore} <em>→</em> ${soldNow}
            <span class="${dSold>0?'up':dSold<0?'dn':''}">${dSold>0?'▲'+dSold:dSold<0?'▼'+Math.abs(dSold):'—'}</span>`}</b>
        </div>
        <div class="r">
          <span>Occupancy</span>
          <b>${(row.occ*100).toFixed(1)}%${dSold!==0?` <em>from</em> ${(soldBefore/row.cap*100).toFixed(1)}%`:''}</b>
        </div>
        <div class="r">
          <span>Prime-time sessions that day</span>
          <b>${primeNow} of ${primeAll}</b>
        </div>
        <div class="r">
          <span>Day total</span>
          <b>${Math.round(day.admits).toLocaleString()} admits</b>
        </div>
      </div>
    </div>

    <div class="sed-foot">
      <button class="ghost" data-act="edrevert" ${offPlan?'':'disabled style="opacity:.45;cursor:default"'}>Revert</button>
      <button class="prim" data-act="edclose">Done</button>
    </div>`;
  el.classList.add('on');
}

/* Move one session, re-render the grid, keep the drawer and scroll position. */
function nudgeRow(row, delta){
  if(!state.plan || !delta) return false;
  const day = state.plan.days[state.dayIdx];
  const res = moveSession(day, row, delta, state.plan.cinema);
  if(!res.ok){
    toast(res.why);
    return false;
  }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  if(state.edit) drawDrawer();
  const pushed = res.pushed || 0;
  toast(`${hhmm(row.start)} — ${Math.abs(delta)} min ${delta<0?'earlier':'later'}${pushed ? ` · pushed ${pushed} session${pushed>1?'s':''} below` : ''}`);
  return true;
}

/* One step of the up/down move buttons. Clamps to the screen's free slot so a
   held button just stops at the edge instead of erroring. */
function stepMove(row, sign, silent){
  if(!state.plan) return false;
  const day = state.plan.days[state.dayIdx];
  const L = limits(day, row);
  const STEP = 15;
  const d = sign < 0 ? Math.max(L.earliest - row.start, -STEP)
                     : Math.min(L.latest - row.start, STEP);
  if(!d){
    if(!silent) toast(sign < 0 ? 'Already at the earliest free slot' : 'Already at the latest free slot');
    return false;
  }
  const res = moveSession(day, row, d, state.plan.cinema);
  if(!res.ok){ if(!silent) toast(res.why); return false; }
  render();
  if(!silent){
    const pushed = res.pushed || 0;
    toast(`${hhmm(row.start)} · ${Math.abs(d)} min ${sign<0?'earlier':'later'}${pushed?` · pushed ${pushed} below`:''}`);
  }
  return true;
}

/* Press-and-hold the ▲ / ▼ buttons to keep moving (mouse + touch). A single
   click is handled by the click listener; hold just repeats stepMove. */
let holdT = null, holdSuppress = false;
function beginHold(btn){
  const id = btn.dataset.id, act = btn.dataset.act;
  if(act !== 'stepup' && act !== 'stepdown') return;
  if(!state.plan) return;
  const day = state.plan.days[state.dayIdx];
  const row = day ? day.rows.find(r=>r.id === id) : null;
  if(!row) return;
  const sign = act === 'stepup' ? -1 : 1;
  holdSuppress = true;                  // the coming click should not double-step
  stepMove(row, sign, true);
  clearInterval(holdT);
  holdT = setInterval(()=> stepMove(row, sign, true), 200);
}
function endHold(){ clearInterval(holdT); holdT = null; }
document.addEventListener('mousedown', e=>{
  const b = e.target.closest && e.target.closest('[data-act="stepup"],[data-act="stepdown"]');
  if(b){ e.preventDefault(); beginHold(b); }
});
['mouseup','mouseleave','blur'].forEach(ev=> document.addEventListener(ev, endHold));
document.addEventListener('touchstart', e=>{
  const b = e.target.closest && e.target.closest('[data-act="stepup"],[data-act="stepdown"]');
  if(b) beginHold(b);
}, {passive:true});
['touchend','touchcancel'].forEach(ev=> document.addEventListener(ev, endHold));

/* ============================================================
   6. RENDER — CHROME
   ============================================================ */

function renderChrome(){

}

/* ============================================================
   7. STAGE 1 — FILM PICKER
   ============================================================ */
function stageFilm(){
  const q = state.q.toLowerCase();
  const list = FILMS.filter(f=>{
    if(q && !(f.title+' '+f.genre+' '+f.lang).toLowerCase().includes(q)) return false;
    if(state.filter === 'pre') return weekIndexOf(f, pd('2026-11-02')) < 0;
    if(state.filter === 'now') return weekIndexOf(f, pd('2026-11-02')) >= 0;
    if(state.filter !== 'all' && f.lang !== state.filter) return false;
    return true;
  });

  const cards = list.map(f=>{
    const sc = state.scores[f.id] || defaultScores(f);
    const idx = composite(sc);
    const v = verdict(idx);
    const pre = weekIndexOf(f, pd('2026-11-02')) < 0;
    return `<button class="fc" data-act="film" data-v="${f.id}">
      <div class="pos" style="background:linear-gradient(150deg,${f.c1} 0%,${f.c2} 100%)">
        <div class="glow" style="background:${f.accent}"></div>
        <div class="st ${pre?'prev':''}">${pre?'Preview':'On screen'}</div>
        <div class="rt">${f.rating}</div>
        <div class="ti">${esc(f.title)}${f.sub?`<small>${esc(f.sub)}</small>`:''}</div>
      </div>
      <div class="bd">
        <div class="g">${f.genre}</div>
        <div class="m">${f.mins}m<i></i>${f.lang}<i></i>${f.rating}</div>
        <div class="bot">
          <span>${esc(f.distributor)}</span>
          <span class="ixpill ${v.cls}">${Math.round(idx)}</span>
        </div>
      </div>
    </button>`;
  }).join('');

/* ============================================================

   ============================================================ */
function chartSVG(fc){
  const days = fc.days;
  const W = 700, H = 196, PL = 40, PR = 10, PT = 16, PB = 28;
  const iw = W-PL-PR, ih = H-PT-PB;
  const rawMax = Math.max(...days.map(d=>d.admits)) * 1.16 || 100;
  const p = Math.pow(10, Math.floor(Math.log10(rawMax/4)));
  const nrm = (rawMax/4)/p;
  const stepV = (nrm<=1?1:nrm<=2?2:nrm<=2.5?2.5:nrm<=5?5:10) * p;
  const maxY = stepV * 4;
  const colW = iw/days.length;
  const bw = colW*0.52;
  const y = v => PT + ih - (v/maxY)*ih;

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = stepV*i, yy = y(v);
    grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="${i===0?'#D8D1C6':'#EDE8E0'}" stroke-width="1"/>`;
    grid += `<text x="${PL-7}" y="${(yy+3).toFixed(1)}" fill="#A79E94" font-size="8.5" text-anchor="end">${Math.round(v)}</text>`;
  }

  let bars = '';
  days.forEach((d,i)=>{
    const x = PL + colW*i + (colW-bw)/2;
    const h = Math.max(2, (d.admits/maxY)*ih);
    const peak = d.admits === Math.max(...days.map(x=>x.admits));
    bars += `<rect x="${x.toFixed(1)}" y="${(PT+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
      fill="${peak?'var(--red)':'#2B2620'}" opacity="${peak?1:.82}"/>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(PT+ih-h-5).toFixed(1)}" text-anchor="middle" font-size="9"
      font-weight="700" fill="${peak?'var(--red)':'#3A3530'}" font-family="Inter,Segoe UI,sans-serif">${Math.round(d.admits)}</text>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(H-9).toFixed(1)}" text-anchor="middle" font-size="9"
      fill="#8B8279" font-family="Inter,Segoe UI,sans-serif">${d.dow}</text>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(H-0.5).toFixed(1)}" text-anchor="middle" font-size="7.5"
      fill="#B8AFA5" font-family="Inter,Segoe UI,sans-serif">${d.date.getDate()}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${bars}</svg>`;
}

    <div class="row tot"><span class="l">week admits</span><span class="r">${Math.round(t.admits).toLocaleString()}</span></div>
    <div class="row"><span class="l cm">confidence band ±${Math.round(fc.bandPct*100)}%</span><span class="r cm">${Math.round(fc.band.lo).toLocaleString()} – ${Math.round(fc.band.hi).toLocaleString()}</span></div>

function buildNotes(fc){
  const out = [];
  const film = fc.film, t = fc.total, a = fc.anchor;

  const peak = fc.days.reduce((x,y)=> y.admits>x.admits?y:x, fc.days[0]);
  const low  = fc.days.reduce((x,y)=> y.admits<x.admits?y:x, fc.days[0]);

  if(fc.pre){
    out.push({t:'warn', m:`<b>Pre-release forecast.</b> ${film.title} has no local run to calibrate against, so this is comparables plus your score at half weight. Treat the ±${Math.round(fc.bandPct*100)}% band as real, not decorative.`});
  }

  if(t.occ > 0.52){
    out.push({t:'good', m:`<b>${Math.round(t.occ*100)}% blended occupancy</b> — this is a strong week. ${peak.dow} alone takes ${Math.round(peak.admits).toLocaleString()} admits on ${peak.shows} shows.`});
  } else if(t.occ < 0.22){
    out.push({t:'warn', m:`<b>Only ${Math.round(t.occ*100)}% occupancy.</b> ${t.shows} sessions is too many for this demand — every show past ${Math.max(film.rules.minShows, 4)} is diluting the average.`});
  } else {
    out.push({t:'good', m:`<b>Balanced at ${Math.round(t.occ*100)}%.</b> ${t.shows} sessions across the week with ${low.dow} as the floor at ${Math.round(low.admits)} admits.`});
  }

  if(film.rating === '18'){
    out.push({t:'info', m:`<b>18-rated.</b> No sessions before 12:00 and nothing in the family slots. The 18 keeps roughly 40% of the market out, but concentrates what is left into 19:00 onward.`});
  }

  if(film.mins >= 150){
    out.push({t:'warn', m:`<b>${film.mins} minutes plus ${PRE_ROLL} pre-roll.</b> Each session eats ${film.mins+PRE_ROLL+TURNOVER} minutes of screen time — that is ${Math.floor((CLOSE_MIN-OPEN_MIN)/(film.mins+PRE_ROLL+TURNOVER))} shows per screen per day, hard ceiling.`});
  }

  if(film.rules.imax){
    out.push({t:'info', m:`<b>IMAX contract active.</b> The format screen is locked to this title for at least one prime show a day. ${fc.cinema.screens.filter(s=>s.type==='IMAX').length} IMAX screen(s) at this site.`});
  } else {
    out.push({t:'info', m:`<b>No IMAX contract.</b> IMAX stays with the format-native titles — ${esc(film.title)} plays 2D only, which is the right call unless the print is upgraded.`});
  }

  const delta = fc.idx - a.idx;
  if(Math.abs(delta) >= 12){
    out.push({t: delta>0?'info':'warn', m:`Your index sits <b>${Math.abs(Math.round(delta))} points ${delta>0?'above':'below'}</b> the comparable average. ${delta>0?'That is doing a lot of work in this number — make sure the heat score is real, not hopeful.':'The plan is being held up by distributor minimums, not by demand.'}`});
  }

  const daysLow = fc.days.filter(d=>d.occ < 0.18);
  if(daysLow.length >= 2){
    out.push({t:'warn', m:`<b>${daysLow.map(d=>d.dow).join(', ')}</b> run under 18%. Those are the shows to cut if you need the screen back for something else.`});
  }

  const margin = (t.admits * fc.cinema.atp) - (t.shows * 180);
  out.push({t: margin>0?'good':'warn', m:`<b>${money(margin)}</b> contribution after an estimated RM180 house cost per session (staff, power, prints). ${margin>0?'The week pays for itself.':'This week does not cover its own operating cost — the distributor minimum is forcing it.'}`});

  return out;
}
